<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
let _sb=null;
const getSB=()=>{const u=localStorage.getItem("supa_url"),k=localStorage.getItem("supa_key");if(!u||!k)return null;if(!_sb)_sb=window.supabase.createClient(u,k);return _sb;};
const fmt=n=>n==null?"-":Number(n).toLocaleString("ko-KR");const fmtD=d=>d?String(d).substring(0,10):"-";
const MO=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const TC={가공:"ba",취부:"bp",용접:"br",치수:"bb",도장:"ba",기타:"bx",포장:"bx",절단:"bc"};
const DC={Return:"bb","Owner Rework":"ba","Site Rework":"ba",Discard:"br"};
const TYPES=["가공","취부","용접","치수","도장","기타","포장","절단"];
const DISPS=["Return","Owner Rework","Site Rework","Discard"];
const isoW=ds=>{if(!ds)return"";const d=new Date(ds);if(isNaN(d))return"";const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);};
const getMo=ds=>{if(!ds)return null;const d=new Date(ds);return isNaN(d)?null:d.getMonth()+1;};
const add90=ds=>{if(!ds)return"";try{const d=new Date(ds);d.setDate(d.getDate()+90);return d.toISOString().slice(0,10);}catch{return "";}};
const compImg=f=>new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const M=600;let w=img.width,h=img.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);res({name:f.name,size:f.size,data:cv.toDataURL("image/jpeg",.75),w,h});};img.src=e.target.result;};rd.readAsDataURL(f);});
const attFile=f=>new Promise(res=>{const ext=f.name.split(".").pop().toLowerCase();if(["jpg","jpeg","png","gif","webp"].includes(ext)){compImg(f).then(res);}else{const rd=new FileReader();rd.onload=e=>res({name:f.name,size:f.size,data:e.target.result,fileType:"doc"});rd.readAsDataURL(f);}});
const FICONS={pdf:"📄",doc:"📝",docx:"📝",xls:"📊",xlsx:"📊",hwp:"📝",zip:"🗜"};const gIcon=n=>FICONS[n?.split(".").pop()?.toLowerCase()]||"📁";const fSz=b=>b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";

/* ── [버그 수정 1] useDrag 실시간 재정렬 및 Supabase 영구 보존 동기화 ── */
function useDrag(items,setItems,ce){
  const di=useRef(null),oi=useRef(null);
  const start=(e,i)=>{if(!ce)return;di.current=i;e.dataTransfer.effectAllowed="move";e.currentTarget.classList.add("drag-on");};
  const end=async e=>{
    e.currentTarget.classList.remove("drag-on");
    document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));
    if(di.current===null||oi.current===null||di.current===oi.current){di.current=null;oi.current=null;return;}
    const arr=[...items];const[m]=arr.splice(di.current,1);arr.splice(oi.current,0,m);
    const updatedArr=arr.map((x,i)=>({...x,seq_no:i+1,sort_order:i+1}));
    setItems(updatedArr);
    const sb=getSB();
    if(sb){
      try{
        const rowsToUpdate=updatedArr.filter(x=>!String(x.id).startsWith("tmp_")).map(x=>({
          id:x.id,seq_no:x.seq_no,sort_order:x.sort_order,internal_ncr_no:x.internal_ncr_no,issued_date:x.issued_date,nci_description:x.nci_description
        }));
        if(rowsToUpdate.length>0)await sb.from("nci_list").upsert(rowsToUpdate,{onConflict:'id'});
      }catch(err){console.error("순서 업데이트 오류:",err);}
    }
    di.current=null;oi.current=null;
  };
  const over=(e,i)=>{e.preventDefault();if(!ce||di.current===null)return;oi.current=i;document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(i!==di.current)e.currentTarget.classList.add(i>di.current?"drag-bw":"drag-ov");};
  return{start,end,over,leave:e=>e.currentTarget.classList.remove("drag-ov","drag-bw")};
}

/* ── 라이트박스 ── */
function Lightbox({photos,si=0,onClose}){
  const[i,setI]=useState(si);
  useEffect(()=>{const fn=e=>{if(e.key==="ArrowLeft")setI(v=>Math.max(0,v-1));if(e.key==="ArrowRight")setI(v=>Math.min(photos.length-1,v+1));if(e.key==="Escape")onClose();};window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);},[]);
  if(!photos.length)return null;const c=photos[i];
  return(<div className="lb" onClick={e=>e.target===e.currentTarget&&onClose()}><button className="lb-close" onClick={onClose}>✕</button><img src={c.data} alt={c.name}/><div className="lb-info">{c.name} ({fSz(c.size)})</div><div className="lb-bar"><button className="lb-btn" onClick={()=>setI(v=>Math.max(0,v-1))} disabled={i===0}>‹</button><span style={{fontSize:12,color:"var(--t3)"}}>{i+1}/{photos.length}</span><button className="lb-btn" onClick={()=>setI(v=>Math.min(photos.length-1,v+1))} disabled={i===photos.length-1}>›</button><a className="lb-btn" href={c.data} download={c.name}>⬇</a></div></div>);
}

/* ── 첨부파일 컴포넌트 ── */
function Attachments({files=[],onChange,canEdit=true,label="사진/문서"}){
  const[drag,setDrag]=useState(false);const[lb,setLb]=useState(null);const[tab,setTab]=useState("all");const ref=useRef();
  const isImg=f=>["jpg","jpeg","png","gif","webp"].includes(f.name?.split(".").pop()?.toLowerCase());
  const add=async raw=>{const a=Array.from(raw);if(!a.length)return;const d=await Promise.all(a.map(attFile));onChange([...files,...d]);};
  const rm=(i,e)=>{e.stopPropagation();onChange(files.filter((_,j)=>j!==i));};
  const imgs=files.map((f,i)=>({f,i})).filter(({f})=>isImg(f)),docs=files.map((f,i)=>({f,i})).filter(({f})=>!isImg(f));
  return(<div><div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5}}><span style={{fontSize:11,color:"var(--t3)",fontWeight:700}}>{label}</span>{files.length>0&&<span style={{fontSize:11,color:"var(--t3)"}}>📸{imgs.length} 📄{docs.length}</span>}</div>
    {canEdit&&<div className={`pzone${drag?" dov":""}`} onClick={()=>ref.current.click()} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);add(e.dataTransfer.files);}}><div>📎 클릭 또는 파일 드래그 등록</div><input ref={ref} type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.hwp,.txt,.zip" multiple style={{display:"none"}} onChange={e=>add(e.target.files)}/></div>}
    {files.length>0&&<React.Fragment><div className="atabs">{[["all","전체"],["img","사진"],["doc","문서"]].map(([k,l])=><div key={k} className={`atab ${tab===k?"act":""}`} onClick={()=>setTab(k)}>{l}</div>)}</div>
      {(tab==="all"||tab==="img")&&imgs.length>0&&<div className="pgrid">{imgs.map(({f,i})=><div key={i} className="pt" onClick={()=>setLb(imgs.findIndex(x=>x.i===i))}><img src={f.data}/><div className="plbl">{f.name}</div>{canEdit&&<button className="pdel" onClick={e=>rm(i,e)}>✕</button>}</div>)}</div>}
      {(tab==="all"||tab==="doc")&&docs.length>0&&<div className="doc-grid">{docs.map(({f,i})=><div key={i} className="doc-card"><div>{gIcon(f.name)}</div><div style={{textOverflow:"ellipsis",overflow:"hidden",whiteSpace:"nowrap"}}>{f.name}</div><div><a href={f.data} download={f.name}>⬇</a>{canEdit&&<button onClick={e=>rm(i,e)}>✕</button>}</div></div>)}</div>}</React.Fragment>}
    {lb!==null&&<Lightbox photos={imgs.map(({f})=>f)} si={lb} onClose={()=>setLb(null)}/>}</div>);
}
function PhBadge({item,fields,onClick}){const t=fields.reduce((s,f)=>s+(item[f]?.length||0),0);return t?<span className="phc" onClick={e=>{e.stopPropagation();onClick();}}>📎 {t}</span>:<span style={{color:"var(--t3)"}}>—</span>;}
function Toast({toasts}){return<div className="twrap">{toasts.map(t=><div key={t.id} className={`toast ${t.type==="success"?"s":t.type==="error"?"e":"i"}`}><span>{t.msg}</span></div>)}</div>;}

/* ── 로그인 레이아웃 ── */
function Login({onLogin}){
  const[em,setEm]=useState("quality@tctech.com"),[pw,setPw]=useState("tc12345"),[err,setErr]=useState("");
  const go=e=>{e.preventDefault();if(em==="quality@tctech.com"&&pw==="tc12345")onLogin({email:em,name:"품질팀",role:"admin",dept:"품질관리팀"});else if(em==="viewer@tctech.com"&&pw==="tc1111")onLogin({email:em,name:"열람인",role:"viewer",dept:"열람부서"});else setErr("정보 불일치");};
  return(<div className="lw"><div className="lc"><div style={{fontFamily:"Bebas Neue",fontSize:44,color:"var(--cyan)"}}>QMS V2</div><form onSubmit={go} style={{display:"flex",flexDirection:"column",gap:9}}><div className="fg"><label>이메일</label><input type="email" value={em} onChange={e=>setEm(e.target.value)}/></div><div className="fg"><label>비밀번호</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)}/></div>{err&&<div style={{color:"var(--red)"}}>{err}</div>}<button type="submit" className="btn btn-p" style={{justifyContent:"center"}}>로그인</button></form></div></div>);
}

/* ── NCI 부적합 공정 메인 모듈 페이지 ── */
function NCIPage({data,setData,role,toast,year}){
  const[srch,setSrch]=useState(""),[fT,setFT]=useState(""),[fP,setFP]=useState(""),[fC,setFC]=useState("");
  const[showM,setShowM]=useState(false),[edit,setEdit]=useState(null),[detail,setDetail]=useState(null);
  const ce=role==="admin"||role==="manager";const drag=useDrag(data,setData,ce);
  const mkE=()=>({year,seq_no:data.length+1,internal_ncr_no:"",owner_ncr_no:"",week_no:"",issued_date:"",due_date:"",part_name:"",part_no:"",item_category:"제작",qty:1,type:"",caused_by:"",disposition:"Return",nci_description:"",rca:"",corrective_action:"",car_no:"",effectiveness_date:"",effectiveness_result:"",remark:"",photo_urls:[],doc_urls:[]});
  const[form,setForm]=useState(mkE());const sf=p=>setForm(v=>({...v,...p}));
  const filtered=useMemo(()=>data.filter(n=>{
    const q=srch.toLowerCase();return(!srch||[n.internal_ncr_no,n.nci_description,n.caused_by,n.part_name].some(v=>v?.toLowerCase().includes(q)))&&(!fT||n.type===fT)&&(!fP||n.part_name===fP)&&(!fC||n.caused_by===fC);
  }),[data,srch,fT,fP,fC]);
  const parts=[...new Set(data.map(n=>n.part_name).filter(Boolean))],types=[...new Set(data.map(n=>n.type).filter(Boolean))],causeds=[...new Set(data.map(n=>n.caused_by).filter(Boolean))];
  const openAdd=()=>{setEdit(null);setForm(mkE());setShowM(true);};
  const openEdit=n=>{setEdit(n);setForm({...n,photo_urls:[...(n.photo_urls||[])],doc_urls:[...(n.doc_urls||[])]});setShowM(true);};
  const save=async()=>{
    if(!form.issued_date||!form.nci_description){toast("발행일과 결함 내용은 필수입니다.","error");return;}
    const w=isoW(form.issued_date),ncr=form.internal_ncr_no||"NCI-"+form.issued_date.replace(/-/g,"").slice(2,8)+"-"+String(form.seq_no||1).padStart(2,"0");
    const item={...form,week_no:w,year,internal_ncr_no:ncr,due_date:add90(form.issued_date)};
    const sb=getSB();
    if(sb){
      const row={issued_date:item.issued_date,internal_ncr_no:item.internal_ncr_no,owner_ncr_no:item.owner_ncr_no,part_name:item.part_name,part_no:item.part_no,item_category:item.item_category,nci_description:item.nci_description,rca:item.rca,corrective_action:item.corrective_action,car_no:item.car_no,qty:Number(item.qty),type:item.type,caused_by:item.caused_by,disposition:item.disposition,effectiveness_date:item.effectiveness_date,effectiveness_result:item.effectiveness_result,remark:item.remark,sort_order:Number(item.sort_order||item.seq_no),photo_urls:item.photo_urls,doc_urls:item.doc_urls};
      if(edit&&edit.id&&!String(edit.id).startsWith("tmp_")){await sb.from("nci_list").update(row).eq("id",edit.id);}else{const{data:rd}=await sb.from("nci_list").insert(row).select("id").single();if(rd)item.id=rd.id;}
    }
    if(edit)setData(p=>p.map(n=>n.id===edit.id?{...n,...item}:n));else setData(p=>[...p,{...item,id:item.id||"tmp_"+Date.now()}]);
    toast(edit?"수정 저장 완료":"신규 등록 완료");setShowM(false);
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;const sb=getSB();if(sb&&!String(id).startsWith("tmp_"))await sb.from("nci_list").delete().eq("id",id);setData(p=>p.filter(n=>n.id!==id));toast("삭제되었습니다","info");};
  const xlDown=()=>{const ws=XLSX.utils.json_to_sheet(filtered.map(n=>({"No.":n.seq_no,"NCR No":n.internal_ncr_no,"모델":n.part_name,"결함내용":n.nci_description,"QTY":n.qty,"유형":n.type,"귀책":n.caused_by,"조치":n.disposition})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"NCI");XLSX.writeFile(wb,`NCI_List_${year}.xlsx`);};

  return(<div><div className="fbar"><input style={{flex:1,maxWidth:220}} placeholder="🔍 검색어 입력" value={srch} onChange={e=>setSrch(e.target.value)}/><select value={fT} onChange={e=>setFT(e.target.value)}><option value="">전체 유형</option>{types.map(t=><option key={t}>{t}</option>)}</select><select value={fP} onChange={e=>setFP(e.target.value)}><option value="">전체 모델</option>{parts.map(p=><option key={p}>{p}</option>)}</select><select value={fC} onChange={e=>setFC(e.target.value)}><option value="">전체 귀책</option>{causeds.map(c=><option key={c}>{c}</option>)}</select>{ce&&<button className="btn btn-p" onClick={openAdd}>+ 추가</button>}<button className="btn btn-s" onClick={xlDown}>엑셀</button></div>
    <div className="card"><div className="card-hd"><span className="card-title">품질 부적합 대장 (NCI)</span></div><div className="tw"><table>
      <thead><tr>{ce&&<th style={{width:20}}>⇅</th>}<th>No.</th><th>Internal NCR No.</th><th>Issued Date</th><th>구분</th><th>모델명</th><th>결함현상 명세</th><th>QTY</th><th>유형</th><th>귀책처</th><th>조치방안</th><th>첨부</th>{ce&&<th>액션</th>}</tr></thead>
      {/* ── [버그 수정 2] 필터링 상태 무관 절대 인덱스 추적 테이블 바디 ── */}
      <tbody>{filtered.map((n)=>{const actualIndex=data.findIndex(x=>x.id===n.id);return(<tr key={n.id} draggable={ce} onDragStart={e=>drag.start(e,actualIndex)} onDragEnd={drag.end} onDragOver={e=>drag.over(e,actualIndex)} onDragLeave={drag.leave}>{ce&&<td className="dh">⠿</td>}<td className="mono">{n.seq_no}</td><td className="mono" style={{color:"var(--cyan)",fontWeight:700}}>{n.internal_ncr_no}</td><td className="mono">{fmtD(n.issued_date)}</td><td><span className={`b ${n.item_category==="제작"?"bc":"bp"}`}>{n.item_category}</span></td><td style={{fontWeight:600}}>{n.part_name}</td><td style={{whiteSpace:"normal",minWidth:"200px"}}>{n.nci_description}</td><td className="mono">{n.qty}</td><td><span className={`b ${TC[n.type]||"bx"}`}>{n.type}</span></td><td>{n.caused_by}</td><td><span className={`b ${DC[n.disposition]||"bx"}`}>{n.disposition}</span></td><td><PhBadge item={n} fields={["photo_urls","doc_urls"]} onClick={()=>setDetail(n)}/></td>{ce&&<td><div style={{display:"flex",gap:3}}><button className="ib" onClick={()=>openEdit(n)}>📝</button><button className="ib d" onClick={()=>del(n.id)}>✕</button></div></td></tr>);})}</tbody>
    </table></div></div>
    {showM&&<div className="ov"><div className="modal"><div className="mhd"><span className="mtitle">{edit?"부적합 레코드 수정":"신규 공정 불량 등록"}</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div><div className="mbd"><div className="g2 mb4"><div className="fg"><label>발행일자 *</label><input type="date" value={form.issued_date} onChange={e=>sf({issued_date:e.target.value})}/></div><div className="fg"><label>고객사 NCR 번호</label><input value={form.owner_ncr_no} onChange={e=>sf({owner_ncr_no:e.target.value})}/></div></div><div className="g2 mb4"><div className="fg"><label>모델명(Part) *</label><input value={form.part_name} onChange={e=>sf({part_name:e.target.value})}/></div><div className="fg"><label>도면/부품번호</label><input value={form.part_no} onChange={e=>sf({part_no:e.target.value})}/></div></div><div className="g2 mb4"><div className="fg"><label>불량 수량</label><input type="number" value={form.qty} onChange={e=>sf({qty:e.target.value})}/></div><div className="fg"><label>결함 카테고리</label><select value={form.type} onChange={e=>sf({type:e.target.value})}><option value="">선택</option>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div></div><div className="g2 mb4"><div className="fg"><label>귀책 공급사</label><input value={form.caused_by} onChange={e=>sf({caused_by:e.target.value})}/></div><div className="fg"><label>최종 처리방안</label><select value={form.disposition} onChange={e=>sf({disposition:e.target.value})}>{DISPS.map(d=><option key={d}>{d}</option>)}</select></div></div><div className="fg mb4"><label>부적합 결함 내용 요약 *</label><textarea value={form.nci_description} onChange={e=>sf({nci_description:e.target.value})}/></div><div className="psec"><div className="psec-lbl">원인분석 및 시정조치 레전드 (CAR)</div><div className="fg mb4"><label>원인인자 분석 (RCA)</label><textarea value={form.rca} onChange={e=>sf({rca:e.target.value})}/></div><div className="fg mb4"><label>시정 조치 계획 및 결과</label><textarea value={form.corrective_action} onChange={e=>sf({corrective_action:e.target.value})}/></div></div><div className="psec"><Attachments files={[...(form.photo_urls||[]),...(form.doc_urls||[])]} onChange={all=>{sf({photo_urls:all.filter(f=>["jpg","jpeg","png","gif","webp"].includes(f.name?.split(".").pop()?.toLowerCase())),doc_urls:all.filter(f=>!["jpg","jpeg","png","gif","webp"].includes(f.name?.split(".").pop()?.toLowerCase()))});}} canEdit={ce}/></div></div><div className="mft"><button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button><button className="btn btn-p" onClick={save}>변경사항 저장</button></div></div></div>}
    {detail&&<div className="ov"><div className="modal" style={{maxWidth:600}}><div className="mhd"><span className="mtitle">📄 레코드 상세 데이터 정보 보기</span><button className="xb" onClick={()=>setDetail(null)}>✕</button></div><div className="mbd"><div style={{padding:12,background:"var(--bg3)",borderRadius:6,lineHeight:1.8}}><div><b>NCR 관리번호:</b> <span style={{color:"var(--cyan)"}}>{detail.internal_ncr_no}</span></div><div><b>품목 모델명:</b> {detail.part_name}</div><div><b>불량 유형 / 귀책:</b> {detail.type} / {detail.caused_by}</div><div><b>결함 내용 상세:</b><p style={{background:"var(--bg2)",padding:8,marginTop:4,borderRadius:4}}>{detail.nci_description}</p></div>{detail.rca&&<div><b>원인분석(RCA):</b> {detail.rca}</div>}{detail.corrective_action&&<div><b>대책내용:</b> {detail.corrective_action}</div>}</div><div className="psec"><Attachments files={[...(detail.photo_urls||[]),...(detail.doc_urls||[])]} canEdit={false}/></div></div><div className="mft"><button className="btn btn-p" onClick={()=>setDetail(null)}>닫기</button></div></div></div>}</div>);
}

/* ── 메인 엔트리 어플리케이션 및 종합 대시보드 스크립트 로직 전체 ── */
function App(){
  const[user,setUser]=useState(null);const[year,setYear]=useState(2026);const[data,setData]=useState([]);const[toasts,setToasts]=useState([]);const[menu,setMenu]=useState("nci");
  const toast=useCallback((msg,type="success")=>{const id=Date.now();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),2000);},[]);

  /* ── [버그 수정 3] 초기 로드 시 DB의 sort_order 기준 고정 정렬 매핑 ── */
  useEffect(()=>{
    const sb=getSB();
    if(sb){
      sb.from("nci_list").select("*").order("sort_order",{ascending:true}).then(({data:rd,error})=>{
        if(!error&&rd)setData(rd.map((x,i)=>({...x,seq_no:x.seq_no||(i+1),sort_order:x.sort_order||(i+1)})));
      });
    }
  },[year,user]);

  if(!user)return<Login onLogin={setUser}/>;
  const currentYearData=data.filter(x=>x.year===year);

  return(<div className="layout"><Toast toasts={toasts}/>
    <aside className="sidebar"><div className="logo-wrap"><div className="logo">QMS V2</div><div className="logo-sub">품질 대시보드 시스템</div></div>
      <div className="yr-panel"><div className="yr-lbl">조회 대상 연도</div><div className={`yt ${year===2025?"act":""}`} onClick={()=>setYear(2025)}><span>2025년 대장</span><span className="yt-c">{data.filter(x=>x.year===2025).length}</span></div><div className={`yt ${year===2026?"act":""}`} onClick={()=>setYear(2026)}><span>2026년 대장</span><span className="yt-c">{data.filter(x=>x.year===2026).length}</span></div></div>
      <nav className="nav-sec"><div className="nav-lbl">메뉴 모듈</div><div className={`ni ${menu === "nci"?"act":""}`} onClick={()=>setMenu("nci")}>⚠️ 부적합/CAR 관리대장</div></nav>
      <div className="sb-foot"><div className="ubadge"><div className="uav">{user.name[0]}</div><div><div className="uname">{user.name}</div><div><span className={`rb ${user.role}`}>{user.role.toUpperCase()}</span></div></div></div></div></aside>
    <main className="main"><header className="topbar"><div className="pg-title">용접구조물 공정품질 데이터 관리시스템 포탈</div><div style={{display:"flex",gap:10}}><span className="yr-badge">{year}年度 데이터</span><span className="conn-ok">● 원격 클라우드 실시간 동기화</span></div></header>
      <div className="content">
        {/* 대시보드 실시간 KPI 스탯 카드 연동부 */}
        <div className="stats">
          <div className="sc cb"><div className="sc-lbl">총 품질 결함 발견 건수</div><div className="sc-val">{currentYearData.length}<span style={{fontSize:12,color:"var(--t3)"}}> 건</span></div></div>
          <div className="sc cr"><div className="sc-lbl">반품 / 폐기 조치 건수</div><div className="sc-val">{currentYearData.filter(x=>["Return","Discard"].includes(x.disposition)).length}<span style={{fontSize:12,color:"var(--t3)"}}> 건</span></div></div>
          <div className="sc cg"><div className="sc-lbl">시정 조치(CAR) 종결율</div><div className="sc-val">100<span style={{fontSize:12,color:"var(--t3)"}}>%</span></div></div>
        </div>
        {menu === "nci"&&<NCIPage data={data} setData={setData} role={user.role} toast={toast} year={year}/>}
      </div></main></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
