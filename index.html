<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ═══════════════════════════════════════════
   MASTER 비밀번호 (변경하려면 이 값을 수정)
   ═══════════════════════════════════════════ */
const MASTER_PW = "qmsmaster2026";
const MASTER_STORAGE_KEY = "qms_auth_table_v1";

/* ── 기본 역할 정의 ── */
const DEFAULT_ROLES = [
  { id:"admin",    label:"관리자",  color:"#ff3d3d", desc:"데이터 입력·수정·삭제·전체 열람" },
  { id:"manager",  label:"품질팀",  color:"#ffab00", desc:"등록·수정·ERP 업로드·전체 열람" },
  { id:"viewer",   label:"관련팀",  color:"#7fb3d3", desc:"전체 데이터 읽기 전용" },
  { id:"external", label:"외부",    color:"#a78bfa", desc:"열람 가능, 금액·매출 블러 처리" },
];

/* ── 기본 계정 — 비어있음, Master가 직접 등록 ── */
const DEFAULT_USERS = [];

/* ── 저장소 헬퍼 (Supabase 기반 — 모든 브라우저/기기에서 공유) ── */
const loadAuthTable = async () => {
  try {
    // 역할 로드
    const rRes = await fetch(_SUPA_URL+"/rest/v1/qms_roles?select=*", {headers:_H});
    const roles = rRes.ok ? await rRes.json() : [];
    // 계정 로드
    const uRes = await fetch(_SUPA_URL+"/rest/v1/qms_auth?select=*", {headers:_H});
    const users = uRes.ok ? await uRes.json() : [];
    // 역할 데이터 매핑
    const mappedRoles = roles.length > 0 ? roles.map(r=>({
      id: r.id, label: r.label, color: r.color, desc: r.role_desc||""
    })) : DEFAULT_ROLES;
    // 계정 데이터 매핑
    const mappedUsers = users.map(u=>({
      id: u.id, email: u.email, pw: u.pw, name: u.name||"",
      role: u.role, dept: u.dept||"", active: u.active
    }));
    return { roles: mappedRoles, users: mappedUsers };
  } catch(e) {
    console.warn("Auth 로드 오류:", e);
    return { roles: DEFAULT_ROLES, users: DEFAULT_USERS };
  }
};

const saveAuthTable = async (data) => {
  // Supabase에 저장 — 개별 upsert로 처리
  // roles 저장
  for(const r of data.roles){
    await fetch(_SUPA_URL+"/rest/v1/qms_roles", {
      method:"POST",
      headers:{..._H, Prefer:"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify({id:r.id, label:r.label, color:r.color, role_desc:r.desc||""})
    });
  }
  // users 저장 — 전체 삭제 후 재삽입
  // 개별 upsert
  for(const u of data.users){
    await fetch(_SUPA_URL+"/rest/v1/qms_auth", {
      method:"POST",
      headers:{..._H, Prefer:"resolution=merge-duplicates,return=minimal"},
      body: JSON.stringify({id:u.id, email:u.email, pw:u.pw, name:u.name||"", role:u.role, dept:u.dept||"", active:u.active})
    });
  }
};

const deleteAuthUser = async (userId) => {
  await fetch(_SUPA_URL+"/rest/v1/qms_auth?id=eq."+encodeURIComponent(userId), {
    method:"DELETE", headers:{..._H, Prefer:"return=minimal"}
  });
};

const _H={apikey:_SUPA_KEY,Authorization:"Bearer "+_SUPA_KEY,"Content-Type":"application/json"};
const _sb={
  from:table=>{
    const base=_SUPA_URL+"/rest/v1/"+table;
    return{
      select:cols=>{
        let url=base+"?select="+(cols||"*");
        let _order="",_limit="",_filters=[];
        const q={
          order:(col,opt)=>{_order="&order="+col+(opt?.ascending===false?".desc":".asc");return q;},
          limit:n=>{_limit="&limit="+n;return q;},
          eq:(col,val)=>{_filters.push(col+"=eq."+encodeURIComponent(val));return q;},
          neq:(col,val)=>{_filters.push(col+"=neq."+encodeURIComponent(val));return q;},
          single:async()=>{
            const r=await fetch(url+(_filters.length?"&"+_filters.join("&"):"")+_order+"&limit=1",{headers:_H});
            if(!r.ok){const e=await r.json();return{data:null,error:e};}
            const d=await r.json();return{data:d[0]||null,error:null};
          },
          then:(res,rej)=>{
            return fetch(url+(_filters.length?"&"+_filters.join("&"):"")+_order+_limit,{headers:_H})
              .then(r=>r.ok?r.json():r.json().then(e=>Promise.reject({error:e})))
              .then(data=>res({data,error:null}))
              .catch(e=>res({data:null,error:e?.error||e}));
          }
        };
        return q;
      },
      insert:rows=>{
        const arr=Array.isArray(rows)?rows:[rows];
        return{
          select:col=>({single:async()=>{
            const r=await fetch(base+"?select="+(col||"*"),{method:"POST",headers:{..._H,Prefer:"return=representation"},body:JSON.stringify(arr[0])});
            if(!r.ok){const e=await r.json();return{data:null,error:e};}
            const d=await r.json();return{data:d[0]||null,error:null};
          }}),
          then:(res,rej)=>{
            return fetch(base,{method:"POST",headers:{..._H,Prefer:"return=minimal"},body:JSON.stringify(arr)})
              .then(r=>r.ok?res({data:null,error:null}):r.json().then(e=>res({data:null,error:e})))
              .catch(e=>res({data:null,error:e}));
          }
        };
      },
      update:row=>{
        let _filters=[];
        const q={
          eq:(col,val)=>{_filters.push(col+"=eq."+encodeURIComponent(val));return q;},
          then:(res,rej)=>{
            const url=base+(_filters.length?"?"+_filters.join("&"):"");
            return fetch(url,{method:"PATCH",headers:{..._H,Prefer:"return=minimal"},body:JSON.stringify(row)})
              .then(r=>r.ok?res({data:null,error:null}):r.json().then(e=>res({data:null,error:e})))
              .catch(e=>res({data:null,error:e}));
          }
        };
        return q;
      },
      delete:()=>{
        let _filters=[];
        const q={
          eq:(col,val)=>{_filters.push(col+"=eq."+encodeURIComponent(val));return q;},
          neq:(col,val)=>{_filters.push(col+"=neq."+encodeURIComponent(val));return q;},
          then:(res,rej)=>{
            const url=base+(_filters.length?"?"+_filters.join("&"):"");
            return fetch(url,{method:"DELETE",headers:{..._H,Prefer:"return=minimal"}})
              .then(r=>r.ok?res({data:null,error:null}):r.json().then(e=>res({data:null,error:e})))
              .catch(e=>res({data:null,error:e}));
          }
        };
        return q;
      },
      upsert:(rows,opt)=>{
        const arr=Array.isArray(rows)?rows:[rows];
        const prefer="resolution=merge-duplicates,return=minimal"+(opt?.onConflict?",on_conflict="+opt.onConflict:"");
        return{
          then:(res,rej)=>{
            return fetch(base,{method:"POST",headers:{..._H,Prefer:prefer},body:JSON.stringify(arr)})
              .then(r=>r.ok?res({data:null,error:null}):r.json().then(e=>res({data:null,error:e})))
              .catch(e=>res({data:null,error:e}));
          }
        };
      }
    };
  },
  channel:()=>({on:()=>({subscribe:()=>{}})}),
  removeChannel:()=>{}
};
const getSB=()=>_sb;

/* 이미지 600px/75% 압축 */
const compImg=f=>new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const M=600;let w=img.width,h=img.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);res({name:f.name,size:f.size,data:cv.toDataURL("image/jpeg",.75),w,h});};img.src=e.target.result;};rd.readAsDataURL(f);});
const attFile=f=>new Promise(res=>{const ext=f.name.split(".").pop().toLowerCase();if(["jpg","jpeg","png","gif","webp"].includes(ext)){compImg(f).then(res);}else{const rd=new FileReader();rd.onload=e=>res({name:f.name,size:f.size,data:e.target.result,fileType:"doc"});rd.readAsDataURL(f);}});
const FICONS={pdf:"📄",doc:"📝",docx:"📝",xls:"📊",xlsx:"📊",hwp:"📝",zip:"🗜"};
const gIcon=n=>FICONS[n?.split(".").pop()?.toLowerCase()]||"📁";
const fSz=b=>b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";

/* ── useDrag ── */
function useDrag(items,setItems,ce,table){
  const di=useRef(null),oi=useRef(null);
  const start=(e,i)=>{if(!ce)return;di.current=i;e.dataTransfer.effectAllowed="move";e.currentTarget.classList.add("drag-on");};
  const end=e=>{e.currentTarget.classList.remove("drag-on");document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(di.current===null||oi.current===null||di.current===oi.current){di.current=null;oi.current=null;return;}const arr=[...items];const[m]=arr.splice(di.current,1);arr.splice(oi.current,0,m);const reordered=arr.map((x,i)=>({...x,seq_no:i+1,sort_order:i+1}));setItems(reordered);
    if(table){const sb=getSB();if(sb){(async()=>{try{for(const it of reordered){if(it.id)await sb.from(table).update({sort_order:it.sort_order}).eq("id",it.id);}}catch(err){console.warn("순서 저장 오류:",err.message);}})();}}
    di.current=null;oi.current=null;};
  const over=(e,i)=>{e.preventDefault();if(!ce||di.current===null)return;oi.current=i;document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(i!==di.current)e.currentTarget.classList.add(i>di.current?"drag-bw":"drag-ov");};
  const leave=e=>e.currentTarget.classList.remove("drag-ov","drag-bw");
  return{start,end,over,leave};
}

/* ── Lightbox ── */
function Lightbox({photos,si=0,onClose}){
  const[i,setI]=useState(si);
  useEffect(()=>{const fn=e=>{if(e.key==="ArrowLeft")setI(v=>Math.max(0,v-1));if(e.key==="ArrowRight")setI(v=>Math.min(photos.length-1,v+1));if(e.key==="Escape")onClose();};window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);},[]);
  if(!photos.length)return null;const c=photos[i];
  return(<div className="lb" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <button className="lb-close" onClick={onClose}>✕</button>
    <img src={c.data} alt={c.name}/>
    <div className="lb-info">{c.name} · {fSz(c.size)}</div>
    <div className="lb-bar">
      <button className="lb-btn" onClick={()=>setI(v=>Math.max(0,v-1))} disabled={i===0}>‹</button>
      <span style={{fontSize:12,color:"var(--t3)"}}>{i+1}/{photos.length}</span>
      <button className="lb-btn" onClick={()=>setI(v=>Math.min(photos.length-1,v+1))} disabled={i===photos.length-1}>›</button>
      <a className="lb-btn" href={c.data} download={c.name}>⬇</a>
    </div>
  </div>);
}

                  {r.id==="external"&&<span style={{marginLeft:8,padding:"1px 6px",borderRadius:3,background:"rgba(139,92,246,.15)",color:"#a78bfa",fontSize:10}}>💰 금액 블러</span>}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>}
    </div>
    {/* 계정 추가/수정 모달 */}
    {showUserM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowUserM(false)}>
      <div className="modal" style={{maxWidth:500}}>
        <div className="mhd"><span className="mtitle">{editUser?"계정 수정":"계정 추가"}</span><button className="xb" onClick={()=>setShowUserM(false)}>✕</button></div>
        <div className="mbd">
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div className="fg"><label>이름 *</label><input value={userForm.name} onChange={e=>setUserForm(p=>({...p,name:e.target.value}))} placeholder="홍길동"/></div>
            <div className="fg"><label>이메일(로그인 ID) *</label><input type="email" value={userForm.email} onChange={e=>setUserForm(p=>({...p,email:e.target.value}))} placeholder="user@company.com" readOnly={!!editUser}/></div>
            <div className="fg"><label>비밀번호 *</label><input value={userForm.pw} onChange={e=>setUserForm(p=>({...p,pw:e.target.value}))} placeholder="비밀번호 입력"/></div>
            <div className="fg"><label>역할</label>
              <select value={userForm.role} onChange={e=>setUserForm(p=>({...p,role:e.target.value}))}>
                {authData.roles.map(r=><option key={r.id} value={r.id}>{r.label} ({r.id})</option>)}
              </select>
            </div>
            <div className="fg"><label>부서/소속</label><input value={userForm.dept} onChange={e=>setUserForm(p=>({...p,dept:e.target.value}))} placeholder="품질관리팀"/></div>
            <div className="fg"><label>상태</label>
              <select value={userForm.active?"active":"inactive"} onChange={e=>setUserForm(p=>({...p,active:e.target.value==="active"}))}>
                <option value="active">활성</option><option value="inactive">비활성</option>
              </select>
            </div>
            {userForm.role==="external"&&<div className="info-box" style={{background:"rgba(139,92,246,.08)",border:"1px solid rgba(139,92,246,.2)",color:"#a78bfa"}}>
              💰 외부 역할: 클레임 금액·매출액 관련 모든 수치가 블러 처리됩니다.
            </div>}
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-s" onClick={()=>setShowUserM(false)}>취소</button>
          <button className="btn btn-p" onClick={saveUser}>저장</button>

    </div>}

    {/* 역할명 수정 모달 */}
    {showRoleM&&editRole&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowRoleM(false)}>
      <div className="modal" style={{maxWidth:420}}>
        <div className="mhd"><span className="mtitle">역할 이름 수정 — {editRole.id}</span><button className="xb" onClick={()=>setShowRoleM(false)}>✕</button></div>
        <div className="mbd">
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div className="info-box amber">시스템 역할 ID(<b>{editRole.id}</b>)는 변경되지 않습니다. 화면에 표시되는 이름만 바뀝니다.</div>
            <div className="fg"><label>역할 표시 이름 *</label>
              <input value={roleForm.label} onChange={e=>setRoleForm(p=>({...p,label:e.target.value}))} placeholder="예: 품질팀, 협력사, 관련부서"/>
            </div>
            <div className="fg"><label>색상</label>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input type="color" value={roleForm.color} onChange={e=>setRoleForm(p=>({...p,color:e.target.value}))} style={{width:44,height:34,padding:2,cursor:"pointer"}}/>
                <span className="role-chip" style={{background:`${roleForm.color}22`,color:roleForm.color,border:`1px solid ${roleForm.color}44`,fontSize:13,padding:"4px 12px"}}>{roleForm.label||"미리보기"}</span>
              </div>
            </div>
            <div className="fg"><label>설명</label>
              <input value={roleForm.desc} onChange={e=>setRoleForm(p=>({...p,desc:e.target.value}))}/>
            </div>
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-s" onClick={()=>setShowRoleM(false)}>취소</button>
          <button className="btn btn-p" onClick={saveRole}>저장</button>
        </div>
      </div>
    </div>}

    {!inline&&<Toast toasts={toasts}/>}
  </div>);
}

/* ════════════════════════════════════════════
   LOGIN
   ════════════════════════════════════════════ */
function Login({onLogin}){
  const[em,setEm]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");
  const[authData, setAuthData]=useState({ roles: DEFAULT_ROLES, users: DEFAULT_USERS });
  const[loading, setLoading]=useState(true);

  useEffect(()=>{
    loadAuthTable().then(d=>{ setAuthData(d); setLoading(false); });
  },[]);

  const getRoleLabel = (roleId) => authData.roles.find(r=>r.id===roleId)?.label || roleId;

  const go=e=>{
    e.preventDefault();
    // Master 체크 — QMS 진입하되 isMaster=true
    if(pw===MASTER_PW){
      onLogin({id:"master", email:"master", name:"Master", role:"admin", roleLabel:"Master", dept:"시스템관리", active:true, isMaster:true});
      return;
    }
    // 일반 계정
    const u=authData.users.find(x=>x.email===em&&x.pw===pw&&x.active);
    if(u) onLogin({...u, id:u.email, role:u.role, roleLabel:getRoleLabel(u.role), isMaster:false});
    else setErr("이메일 또는 비밀번호가 올바르지 않습니다.");
  };

  const noUsers = !loading && authData.users.length === 0;

  return(<div className="lw"><div className="lc">
    <div style={{fontFamily:"Bebas Neue",fontSize:44,color:"var(--cyan)",letterSpacing:5}}>QMS</div>
    <div style={{fontSize:12,color:"var(--t3)",letterSpacing:2,marginBottom:4}}>QUALITY MANAGEMENT SYSTEM v2</div>
    <div style={{fontSize:12,color:"var(--cyan)",opacity:.5,marginBottom:22}}>용접구조물 품질관리 포털</div>
    {loading ? <div style={{textAlign:"center",color:"var(--t3)",padding:20}}>잠시만 기다려주세요...</div> :
    <form onSubmit={go} style={{display:"flex",flexDirection:"column",gap:9}}>
      {/* 자동완성 방지용 hidden 더미 input */}
      <input type="text" style={{display:"none"}} readOnly/>
      <input type="password" style={{display:"none"}} readOnly/>
      <div className="fg"><label>이메일</label><input type="text" value={em} onChange={e=>setEm(e.target.value)} placeholder="이메일 입력" autoComplete="new-password" name="qms-email"/></div>
      <div className="fg"><label>비밀번호</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="••••••" autoComplete="new-password" name="qms-pw"/></div>
      {err&&<div style={{color:"var(--red)",fontSize:13}}>⚠ {err}</div>}
      <button type="submit" className="btn btn-p" style={{justifyContent:"center",padding:"8px",marginTop:3}}>로그인</button>
    </form>}
    {noUsers&&<div style={{marginTop:14,padding:10,background:"rgba(255,171,0,.07)",border:"1px solid rgba(255,171,0,.2)",borderRadius:6,fontSize:12,color:"var(--amber)"}}>
      ⚠ 등록된 계정이 없습니다.<br/>Master 비밀번호로 로그인 후 계정을 먼저 등록해주세요.
    </div>}
  </div></div>);
}

/* ════════════════════════════════════════════
   NCI PAGE — 기존 코드 동일
   ════════════════════════════════════════════ */
function NCIPage({data,setData,role,toast,year}){
  const[srch,setSrch]=useState("");const[fT,setFT]=useState("");const[fP,setFP]=useState("");const[fC,setFC]=useState("");
  const[showM,setShowM]=useState(false);const[edit,setEdit]=useState(null);const[detail,setDetail]=useState(null);
  const ce=role==="admin"||role==="manager";
  const drag=useDrag(data,setData,ce,"nci_list");
  const mkE=()=>({year,seq_no:data.length+1,internal_ncr_no:"",owner_ncr_no:"",week_no:"",issued_date:"",due_date:"",part_name:"",part_no:"",item_category:"",nci_photo_yn:"N",nci_description:"",rca:"",corrective_action:"",car_no:"",qty:1,type:"",caused_by:"",disposition:"Return",effectiveness_date:"",effectiveness_result:"",remark:"",photo_urls:[],doc_urls:[]});
  const[form,setForm]=useState(mkE());
  const sf=p=>setForm(v=>({...v,...p}));
  const filtered=useMemo(()=>data.filter(n=>{
    const q=srch.toLowerCase();
    return(!srch||[n.internal_ncr_no,n.nci_description,n.caused_by,n.part_name,n.rca].some(v=>v?.toLowerCase().includes(q)))
      &&(!fT||n.type===fT)&&(!fP||n.part_name===fP)&&(!fC||n.caused_by===fC);
  }),[data,srch,fT,fP,fC]);
  const parts=[...new Set(data.map(n=>n.part_name).filter(Boolean))];
  const types=[...new Set(data.map(n=>n.type).filter(Boolean))];
  const causeds=[...new Set(data.map(n=>n.caused_by).filter(Boolean))];
  const openAdd=()=>{setEdit(null);setForm(mkE());setShowM(true);};
  const openEdit=n=>{setEdit(n);setForm({...n,week_no:isoW(n.issued_date),due_date:add90(n.issued_date),photo_urls:[...(n.photo_urls||[])],doc_urls:[...(n.doc_urls||[])]});setShowM(true);};
  const save=async()=>{
    if(!form.issued_date||!form.nci_description){toast("발행일과 부적합 내용은 필수입니다.","error");return;}
    const w=isoW(form.issued_date);
    const ncr=form.internal_ncr_no||"NCI-"+form.issued_date.replace(/-/g,"").slice(2,8)+"-"+String(form.seq_no||1).padStart(2,"0");
    const item={...form,week_no:w,year,internal_ncr_no:ncr,due_date:add90(form.issued_date)};
    const sb=getSB();
    if(sb){
      const row={issued_date:item.issued_date,internal_ncr_no:item.internal_ncr_no||null,owner_ncr_no:item.owner_ncr_no||null,part_name:item.part_name||null,part_no:item.part_no||null,item_category:item.item_category||"fab",nci_description:item.nci_description||null,rca:item.rca||null,corrective_action:item.corrective_action||null,car_no:item.car_no||null,qty:Number(item.qty)||1,type:item.type||null,caused_by:item.caused_by||null,disposition:item.disposition||"Return",effectiveness_date:item.effectiveness_date||null,effectiveness_result:item.effectiveness_result||null,remark:item.remark||null,sort_order:Number(item.sort_order||item.seq_no||1),photo_urls:item.photo_urls||[],doc_urls:item.doc_urls||[]};
      if(edit&&edit.id&&!String(edit.id).startsWith("tmp_")){const{error}=await sb.from("nci_list").update(row).eq("id",edit.id);if(error){toast("저장 오류: "+error.message,"error");return;}}
      else{const{data,error}=await sb.from("nci_list").insert(row).select("id").single();if(error){toast("저장 오류: "+error.message,"error");return;}if(data)item.id=data.id;}
    }
    if(edit)setData(p=>p.map(n=>n.id===edit.id?{...n,...item}:n));
    else setData(p=>[...p,{...item,id:item.id||"tmp_"+Date.now()}]);
    toast(edit?"수정 완료":"등록 완료","success");setShowM(false);
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;
    const sb=getSB();
    if(sb&&!String(id).startsWith("tmp_")){const{error}=await sb.from("nci_list").delete().eq("id",id);if(error){toast("삭제 오류: "+error.message,"error");return;}}
    setData(p=>p.filter(n=>n.id!==id));toast("삭제 완료","info");
  };
  const xlDown=()=>{
    const ws=XLSX.utils.json_to_sheet(filtered.map(n=>({"No.":n.seq_no,"Internal NCR No.":n.internal_ncr_no,"Owner NCR No.":n.owner_ncr_no,"W":n.week_no,"Issued Date":n.issued_date,"Part Name(모델)":n.part_name,"Part No.":n.part_no,"NCI Photos":n.photo_urls?.length||0,"NCI Description":n.nci_description,"RCA(원인분석)":n.rca,"Corrective Action":n.corrective_action,"CAR No":n.car_no,"QTY":n.qty,"Type":n.type,"Caused By":n.caused_by,"Disposition":n.disposition,"Effect.Date":n.effectiveness_date,"Results":n.effectiveness_result,"+90일(Due)":n.due_date,"비고":n.remark})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"NCI");XLSX.writeFile(wb,`NCI_CAR_List_${year}_${new Date().toISOString().slice(0,10)}.xlsx`);toast("다운로드 완료","success");
  };
  return(<div>
    <div className="fbar">
      <input style={{flex:1,maxWidth:250}} placeholder="🔍 NCR번호·내용·귀책처·모델" value={srch} onChange={e=>setSrch(e.target.value)}/>
      <select style={{width:100}} value={fT} onChange={e=>setFT(e.target.value)}><option value="">전체 유형</option>{types.map(t=><option key={t}>{t}</option>)}</select>
      <select style={{width:120}} value={fP} onChange={e=>setFP(e.target.value)}><option value="">전체 모델</option>{parts.map(p=><option key={p}>{p}</option>)}</select>
      <select style={{width:100}} value={fC} onChange={e=>setFC(e.target.value)}><option value="">전체 귀책</option>{causeds.map(c=><option key={c}>{c}</option>)}</select>
      <span className="hint" style={{marginLeft:"auto"}}>⠿ 드래그 순서변경</span>
      {ce&&<button className="btn btn-p" onClick={openAdd}>+ NCI 등록</button>}
      <button className="btn btn-s" onClick={xlDown}>⬇ 엑셀</button>
    </div>
    <div className="card">
      <div className="card-hd"><span className="card-title">NCI & CAR List ({year}년)</span>
        <div style={{display:"flex",gap:5,alignItems:"center"}}><span className="b bc">{filtered.length}건</span><span className="b ba">{filtered.reduce((s,n)=>s+(n.qty||0),0)}대</span></div>
      </div>
      <div className="tw"><table>
        <thead><tr>
          {ce&&<th style={{width:20}}>⇅</th>}
          <th>No.</th><th>Internal NCR No.</th><th>Owner NCR No.</th><th>W</th>
          <th>Issued Date</th><th>구분</th><th>Part Name(모델)</th><th>Part No.</th>
          <th>NCI Description</th><th>RCA</th>
          <th>CAR No</th><th>QTY</th><th>Type</th><th>Caused By</th>
          <th>Disposition</th><th>Effect.Date</th><th>Results</th><th>+90일</th>
          <th>첨부</th>{ce&&<th>관리</th>}
        </tr></thead>
        <tbody>{filtered.map(n=>(
          <tr key={n.id} draggable={ce} onDragStart={e=>drag.start(e,data.findIndex(x=>x.id===n.id))} onDragEnd={drag.end} onDragOver={e=>drag.over(e,data.findIndex(x=>x.id===n.id))} onDragLeave={drag.leave}>
            {ce&&<td style={{textAlign:"center"}}><span className="dh">⠿</span></td>}
            <td className="mono">{n.seq_no}</td>
            <td><span style={{color:"#60a5fa",cursor:"pointer",fontFamily:"Calibri",fontSize:13}} onClick={()=>setDetail(n)}>{n.internal_ncr_no}</span></td>
            <td className="mono" style={{color:"var(--t3)",fontSize:13}}>{n.owner_ncr_no}</td>
            <td className="mono">{n.week_no}W</td>
            <td style={{fontSize:13}}>{fmtD(n.issued_date)}</td>
            <td><span className={`b ${n.item_category==="cut"?"bc":n.item_category==="fab"?"bg":"bx"}`} style={{fontSize:10}}>{n.item_category==="cut"?"절단품":n.item_category==="fab"?"제관품":"—"}</span></td>
            <td style={{fontSize:12,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis"}}>{n.part_name}</td>
            <td className="mono" style={{color:"var(--t3)",fontSize:13}}>{n.part_no}</td>
            <td style={{maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",fontSize:13}}>{n.nci_description}</td>
            <td style={{maxWidth:110,overflow:"hidden",textOverflow:"ellipsis",fontSize:12,color:"var(--t3)"}}>{n.rca}</td>
            <td style={{fontSize:12,color:"var(--t3)"}}>{n.car_no}</td>
            <td className="mono">{n.qty}</td>
            <td><span className={`b ${TC[n.type]||"bx"}`}>{n.type}</span></td>
            <td style={{fontSize:13}}>{n.caused_by}</td>
            <td><span className={`b ${DC[n.disposition]||"bx"}`}>{n.disposition}</span></td>
            <td style={{fontSize:13}}>{fmtD(n.effectiveness_date)}</td>
            <td>{n.effectiveness_result?<span className={`b ${n.effectiveness_result==="Accepted"?"bg":"br"}`} style={{fontSize:13}}>{n.effectiveness_result}</span>:<span className="b ba" style={{fontSize:13}}>미확인</span>}</td>
            <td style={{fontSize:12,color:"var(--t3)"}}>{n.due_date||add90(n.issued_date)}</td>
            <td><PhBadge item={n} fields={["photo_urls","doc_urls"]} onClick={()=>setDetail(n)}/></td>
            {ce&&<td><div style={{display:"flex",gap:3}}><button className="ib" onClick={()=>openEdit(n)}>✎</button><button className="ib d" onClick={()=>del(n.id)}>✕</button></div></td>}
          </tr>
        ))}</tbody>
      </table></div>
    </div>
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
      <div className="modal">
        <div className="mhd"><span className="mtitle">{edit?"NCI 수정":"NCI 신규 등록"}</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div>
        <div className="mbd">
          <div style={{marginBottom:10}} className="info-box amber"><b>자동계산 항목</b> — No.: 자동순번 | W: 주차 자동 | Internal NCR No.: NCI-YYMMDD-순번 자동 | +90일: Issued Date 기준 자동</div>
          <div className="fgg">
            <div className="fg"><label>No. <span className="tag-a">자동</span></label><input readOnly value={form.seq_no||"—"}/></div>
            <div className="fg"><label>Internal NCR No. <span className="tag-a">자동생성</span></label><input value={form.internal_ncr_no||""} onChange={e=>sf({internal_ncr_no:e.target.value})} placeholder="비우면 자동 생성"/></div>
            <div className="fg"><label>Owner NCR No.</label><input value={form.owner_ncr_no||""} onChange={e=>sf({owner_ncr_no:e.target.value})}/></div>
            <div className="fg"><label>Issued Date *</label><input type="date" value={form.issued_date||""} onChange={e=>sf({issued_date:e.target.value,week_no:isoW(e.target.value),due_date:add90(e.target.value)})}/></div>
            <div className="fg"><label>W (주차) <span className="tag-a">자동</span></label><input readOnly value={form.week_no?form.week_no+"W":"—"}/></div>
            <div className="fg"><label>+90일 (Due Date) <span className="tag-a">자동</span></label><input readOnly value={form.due_date||"—"}/></div>
            <div className="fg"><label>제관품 / 절단품 구분 *</label>
              <select value={form.item_category||""} onChange={e=>sf({item_category:e.target.value})} style={{borderColor:!form.item_category?"var(--amber)":""}}>
                <option value="">선택 필수</option><option value="fab">제관품 (Fabrication)</option><option value="cut">절단품 (Cut parts)</option>

            <div className="fg"><label>Results</label>
              <select value={form.effectiveness_result||""} onChange={e=>sf({effectiveness_result:e.target.value})}><option value="">미확인</option><option>Accepted</option><option>Rejected</option><option>In Progress</option></select>
            </div>
            <div className="fg full"><label>비고</label><textarea value={form.remark||""} onChange={e=>sf({remark:e.target.value})}/></div>

          <div className="psec"><div className="psec-lbl">✅ Effectiveness Check Documents</div><Attachments files={form.doc_urls||[]} onChange={v=>sf({doc_urls:v})} canEdit={ce} label="이행확인 사진/문서"/></div>

          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>

    {detail&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>

          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:11}}>
            {[["Issued Date",fmtD(detail.issued_date)],["W",detail.week_no+"W"],["구분",detail.item_category==="cut"?"절단품":detail.item_category==="fab"?"제관품":"—"],["Part Name",detail.part_name],["Part No.",detail.part_no],["Type",detail.type],["Caused By",detail.caused_by],["QTY",detail.qty+"대"],["Disposition",detail.disposition],["Effect.Date",fmtD(detail.effectiveness_date)],["Results",detail.effectiveness_result||"미확인"],["CAR No",detail.car_no||"-"],["+90일 Due",detail.due_date||add90(detail.issued_date)]].map(([k,v])=>(
              <div key={k}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:13}}>{v||"-"}</div></div>
            ))}
          </div>
          {[["NCI Description",detail.nci_description],["RCA (원인분석)",detail.rca],["Corrective Action (개선대책)",detail.corrective_action],["비고",detail.remark]].map(([k,v])=>v&&(
            <div key={k} style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)",whiteSpace:"pre-wrap"}}>{v}</div></div>
          ))}
          {((detail.photo_urls?.length||0)+(detail.doc_urls?.length||0))>0&&<div className="psec"><div className="psec-lbl">📎 첨부 파일</div>
            {(detail.photo_urls?.length||0)>0&&<Attachments files={detail.photo_urls} onChange={()=>{}} canEdit={false} label="부적합 사진/문서"/>}
            {(detail.doc_urls?.length||0)>0&&<div style={{marginTop:7}}><Attachments files={detail.doc_urls} onChange={()=>{}} canEdit={false} label="이행확인 사진/문서"/></div>}
          </div>}
        </div>
      </div>
    </div>}
  </div>);
}

/* ════════════════════════════════════════════
   CLAIM PAGE — external 블러 적용
   ════════════════════════════════════════════ */
function ClaimPage({data,setData,role,toast,year,currency,setCurrency,rates,setRates}){
  const isExt = role==="external";
  const[srch,setSrch]=useState("");const[showM,setShowM]=useState(false);const[edit,setEdit]=useState(null);const[detail,setDetail]=useState(null);
  const ce=role==="admin"||role==="manager";
  const drag=useDrag(data,setData,ce,"claim_list");
  const CURR=[{c:"KRW",s:"₩",r:1},{c:"USD",s:"$",r:rates?.USD||1480},{c:"EUR",s:"€",r:rates?.EUR||1620},{c:"JPY",s:"¥",r:rates?.JPY||9.8}];
  const ci=CURR.find(x=>x.c===currency)||CURR[0];
  const cvtRaw=n=>n==null?"-":currency==="KRW"?fmt(n):ci.s+(n/ci.r).toFixed(2);
  const cvt=(n)=> isExt ? <span className="blur-val">●●●</span> : cvtRaw(n);
  const parts=[...new Set(data.map(n=>n.part_name).filter(Boolean))];
  const causeds=[...new Set(data.map(n=>n.caused_by).filter(Boolean))];
  const mkE=()=>({year,seq_no:data.length+1,internal_ncr_no:"",owner_ncr_no:"",week_no:"",issued_date:"",part_name:"",part_no:"",nci_description:"",type:"",caused_by:"",disposition:"Return",claim_amount:0,final_agreed:0,tc_tech_ratio:0,partner_ratio:0,doc_no:"",remark:"",photo_urls:[],doc_urls:[]});
  const[form,setForm]=useState(mkE());const sf=p=>setForm(v=>({...v,...p}));
  const tcCalc=Math.round((form.final_agreed||0)*(form.tc_tech_ratio||0)/100);
  const partnerCalc=Math.round((form.final_agreed||0)*(form.partner_ratio||0)/100);
  const filtered=useMemo(()=>data.filter(n=>!srch||JSON.stringify(n).toLowerCase().includes(srch.toLowerCase())),[data,srch]);
  const totClaim=data.reduce((s,c)=>s+(c.claim_amount||0),0);
  const totFinal=data.reduce((s,c)=>s+(c.final_agreed||0),0);
  const totTC=data.reduce((s,c)=>s+Math.round((c.final_agreed||0)*(c.tc_tech_ratio||0)/100),0);
  const openAdd=()=>{setEdit(null);setForm(mkE());setShowM(true);};
  const openEdit=n=>{setEdit(n);setForm({...n,photo_urls:[...(n.photo_urls||[])],doc_urls:[...(n.doc_urls||[])]});setShowM(true);};
  const save=async()=>{
    if(!form.issued_date){toast("발행일을 입력하세요.","error");return;}
    const item={...form,week_no:isoW(form.issued_date),year,claim_amount:Number(form.claim_amount),final_agreed:Number(form.final_agreed),tc_burden:Math.round(Number(form.final_agreed)*Number(form.tc_tech_ratio)/100),partner_share:Math.round(Number(form.final_agreed)*Number(form.partner_ratio)/100)};
    const sb=getSB();
    if(sb){
      const row={issued_date:item.issued_date,internal_ncr_no:item.internal_ncr_no||null,owner_ncr_no:item.owner_ncr_no||null,part_name:item.part_name||null,part_no:item.part_no||null,nci_description:item.nci_description||null,type:item.type||null,caused_by:item.caused_by||null,disposition:item.disposition||"Return",claim_amount:Number(item.claim_amount)||0,final_agreed:Number(item.final_agreed)||0,tc_tech_ratio:Number(item.tc_tech_ratio)||0,partner_ratio:Number(item.partner_ratio)||0,doc_no:item.doc_no||null,remark:item.remark||null,sort_order:Number(item.sort_order||item.seq_no||1),photo_urls:item.photo_urls||[],doc_urls:item.doc_urls||[]};
      if(edit&&edit.id&&!String(edit.id).startsWith("tmp_")){const{error}=await sb.from("claim_list").update(row).eq("id",edit.id);if(error){toast("저장 오류: "+error.message,"error");return;}}
      else{const{data,error}=await sb.from("claim_list").insert(row).select("id").single();if(error){toast("저장 오류: "+error.message,"error");return;}if(data)item.id=data.id;}
    }
    if(edit)setData(p=>p.map(n=>n.id===edit.id?{...n,...item}:n));
    else setData(p=>[...p,{...item,id:item.id||"tmp_"+Date.now()}]);
    toast(edit?"수정 완료":"등록 완료","success");setShowM(false);
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;
    const sb=getSB();
    if(sb&&!String(id).startsWith("tmp_")){const{error}=await sb.from("claim_list").delete().eq("id",id);if(error){toast("삭제 오류: "+error.message,"error");return;}}
    setData(p=>p.filter(n=>n.id!==id));toast("삭제 완료","info");
  };
  const xlDown=()=>{
    if(isExt){toast("외부 계정은 금액 데이터 다운로드가 제한됩니다","error");return;}
    const ws=XLSX.utils.json_to_sheet(filtered.map(c=>({"No.":c.seq_no,"Internal NCR No.":c.internal_ncr_no,"Owner NCR No.":c.owner_ncr_no,"W":c.week_no,"Issued Date":c.issued_date,"Part Name(모델)":c.part_name,"Part No.":c.part_no,"NCI Description":c.nci_description,"Type":c.type,"Caused By":c.caused_by,"Disposition":c.disposition,"청구금액":c.claim_amount,"최종 합의금":c.final_agreed,"협력사 합의금":Math.round((c.final_agreed||0)*(c.partner_ratio||0)/100),"TC 부담금":Math.round((c.final_agreed||0)*(c.tc_tech_ratio||0)/100),"TC Tech 귀책율(%)":c.tc_tech_ratio,"협력사 귀책율(%)":c.partner_ratio,"품의서 번호":c.doc_no,"비고":c.remark})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Claims");XLSX.writeFile(wb,`Filed_Claim_List_${year}_${new Date().toISOString().slice(0,10)}.xlsx`);toast("다운로드 완료","success");
  };
  return(<div>
    {isExt&&<div style={{padding:"6px 11px",background:"rgba(139,92,246,.08)",border:"1px solid rgba(139,92,246,.2)",borderRadius:"var(--r)",marginBottom:10,fontSize:12,color:"#a78bfa",display:"flex",alignItems:"center",gap:6}}>
      🔒 외부 열람 모드 — 금액 관련 항목은 보안 처리되어 표시됩니다.
    </div>}
    {/* 화폐 단위 바 */}
    {!isExt&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",background:"var(--bg2)",border:"1px solid var(--bdr)",borderRadius:"var(--r)",marginBottom:11,flexWrap:"wrap"}}>
      <span style={{fontSize:12,color:"var(--t3)"}}>💱 화폐단위</span>
      {CURR.map(c=><button key={c.c} className={`btn btn-sm ${currency===c.c?"btn-p":"btn-s"}`} onClick={()=>setCurrency(c.c)}>{c.s} {c.c}</button>)}
      {currency!=="KRW"&&<div style={{display:"flex",alignItems:"center",gap:5,marginLeft:"auto"}}>
        <span style={{fontSize:12,color:"var(--t3)"}}>1{ci.s}=</span>
        <input type="number" value={rates?.[currency]||ci.r} style={{width:75,padding:"2px 6px",fontSize:13}} onChange={e=>setRates(r=>({...r,[currency]:Number(e.target.value)}))}/>
        <span style={{fontSize:12,color:"var(--t3)"}}>₩</span>
      </div>}
    </div>}
    <div className="stats" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
      <div className="sc cr"><div className="sc-lbl">▸ 총 청구금액(Claim)</div><div className="sc-val" style={{color:"var(--red)",fontSize:13}}>{isExt?<span className="blur-val">●●●</span>:<span>{ci.s}{currency==="KRW"?fmt(totClaim):(totClaim/ci.r).toFixed(0)}</span>}</div></div>
      <div className="sc ca"><div className="sc-lbl">▸ 최종 합의금</div><div className="sc-val" style={{color:"var(--amber)",fontSize:13}}>{isExt?<span className="blur-val">●●●</span>:<span>{ci.s}{currency==="KRW"?fmt(totFinal):(totFinal/ci.r).toFixed(0)}</span>}</div></div>
      <div className="sc cg"><div className="sc-lbl">▸ TC 부담금 <span className="kpi-a">자동계산</span></div><div className="sc-val" style={{color:"var(--green)",fontSize:13}}>{isExt?<span className="blur-val">●●●</span>:<span>{ci.s}{currency==="KRW"?fmt(totTC):(totTC/ci.r).toFixed(0)}</span>}</div></div>
      <div className="sc cb"><div className="sc-lbl">▸ 클레임 건수</div><div className="sc-val">{data.length}</div></div>

            <div className="fg"><label>TC Tech 귀책율(%)</label><input type="number" step=".01" value={form.tc_tech_ratio||0} onChange={e=>sf({tc_tech_ratio:e.target.value})}/></div>
            <div className="fg"><label>협력사 귀책율(%)</label><input type="number" step=".01" value={form.partner_ratio||0} onChange={e=>sf({partner_ratio:e.target.value})}/></div>
            <div className="fg"><label>TC 부담금 <span className="kpi-a">자동계산</span></label><input data-auto readOnly value={fmt(tcCalc)+" 원"}/></div>
            <div className="fg"><label>협력사 합의금 <span className="kpi-a">자동계산</span></label><input data-auto readOnly value={fmt(partnerCalc)+" 원"}/></div>
            <div className="fg"><label>품의서 번호</label><input value={form.doc_no||""} onChange={e=>sf({doc_no:e.target.value})}/></div>
            <div className="fg full"><label>비고</label><textarea value={form.remark||""} onChange={e=>sf({remark:e.target.value})}/></div>
          </div>
          <div className="psec"><div className="psec-lbl">📎 NCI Photos / 클레임 증빙</div><Attachments files={form.photo_urls||[]} onChange={v=>sf({photo_urls:v})} canEdit={ce} label="사진/문서"/></div>
        </div>
        <div className="mft">
          <span style={{fontSize:12,color:"var(--t3)",marginRight:"auto"}}>TC부담금: {fmt(tcCalc)}원 | 협력사: {fmt(partnerCalc)}원 <span className="kpi-a">자동계산</span></span>
          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>

    {detail&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>
      <div className="modal" style={{maxWidth:860}}>
        <div className="mhd"><span className="mono" style={{color:"#60a5fa",fontWeight:700}}>{detail.internal_ncr_no}</span>
          <div style={{display:"flex",gap:5}}>{ce&&<button className="btn btn-s btn-sm" onClick={()=>{setDetail(null);openEdit(detail);}}>✎</button>}<button className="xb" onClick={()=>setDetail(null)}>✕</button></div>
        </div>
        <div className="mbd">
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:10}}>
            {[["발행일",fmtD(detail.issued_date)],["주차",detail.week_no+"W"],["모델",detail.part_name],["귀책처",detail.caused_by]].map(([k,v])=>(
              <div key={k}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:13}}>{v||"-"}</div></div>
            ))}
            {[["청구금액",isExt?null:fmt(detail.claim_amount)+"원"],["최종합의금",isExt?null:fmt(detail.final_agreed)+"원"],
              ["TC 부담금",isExt?null:fmt(Math.round((detail.final_agreed||0)*(detail.tc_tech_ratio||0)/100))+"원 (자동)"],["TC귀책율",isExt?null:detail.tc_tech_ratio+"%"],
              ["협력사합의금",isExt?null:fmt(Math.round((detail.final_agreed||0)*(detail.partner_ratio||0)/100))+"원 (자동)"],["협력사귀책율",isExt?null:detail.partner_ratio+"%"],
              ["품의서번호",detail.doc_no||"-"],["Disposition",detail.disposition]].map(([k,v])=>(
              <div key={k}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div>
                <div style={{fontSize:13}}>{v===null?<span className="blur-val">●●●</span>:v||"-"}</div>
              </div>
            ))}
          </div>
          {detail.nci_description&&<div style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>NCI Description</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)"}}>{detail.nci_description}</div></div>}
          {detail.remark&&<div style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>비고</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)",whiteSpace:"pre-wrap"}}>{detail.remark}</div></div>}
          {((detail.photo_urls?.length||0)+(detail.doc_urls?.length||0))>0&&<div className="psec"><div className="psec-lbl">📎 첨부</div><Attachments files={[...(detail.photo_urls||[]),...(detail.doc_urls||[])]} onChange={()=>{}} canEdit={false} label="첨부 파일"/></div>}
        </div>
      </div>
    </div>}
  </div>);
}

/* ════════════════════════════════════════════
   KPI PAGE — external 블러 적용 (매출액·실패비용·비율)
   ════════════════════════════════════════════ */
function KPIPage({nci,claim,erp,target,setTarget,role,year,yearDB}){
  const isExt = role==="external";
  const r1=useRef(),r2=useRef(),r3=useRef(),r4=useRef(),r5=useRef();
  const c1=useRef(),c2=useRef(),c3=useRef(),c4=useRef(),c5=useRef();
  const ce=role==="admin"||role==="manager";
  const[eTgt,setETgt]=useState(false);
  const[tF,setTF]=useState({...target});
  const[view,setView]=useState("monthly");
  const[kpiMon,setKpiMon]=useState(new Date().getMonth()+1);

  const nciM=Array(12).fill(0),nciQM=Array(12).fill(0);
  const cutNciM=Array(12).fill(0),cutQtyM=Array(12).fill(0);
  const fabNciM=Array(12).fill(0),fabQtyM=Array(12).fill(0);
  nci.forEach(n=>{const m=getMo(n.issued_date);if(!m)return;nciM[m-1]++;nciQM[m-1]+=(n.qty||0);if(n.item_category==="cut"){cutNciM[m-1]++;cutQtyM[m-1]+=(n.qty||0);}else{fabNciM[m-1]++;fabQtyM[m-1]+=(n.qty||0);}});
  const claimM=Array(12).fill(0);
  claim.forEach(cl=>{const m=getMo(cl.issued_date);if(m)claimM[m-1]+=(cl.claim_amount||0);});
  const cutShipM=Array(12).fill(0),fabShipM=Array(12).fill(0),revM=Array(12).fill(0);
  (erp||[]).forEach(e=>{const m=e.month||(e.invoice_date?getMo(e.invoice_date):null);if(!m)return;if(e.is_cut_parts)cutShipM[m-1]+=(e.qty||0);else if(e.is_fabrication)fabShipM[m-1]+=(e.qty||0);revM[m-1]+=(e.total_amount_krw||0);});
  const cutNciW={},cutQtyW={},fabNciW={},fabQtyW={},cutShipW={},fabShipW={};
  nci.forEach(n=>{const w=n.week_no||isoW(n.issued_date);if(!w)return;if(n.item_category==="cut"){cutNciW[w]=(cutNciW[w]||0)+1;cutQtyW[w]=(cutQtyW[w]||0)+(n.qty||0);}else{fabNciW[w]=(fabNciW[w]||0)+1;fabQtyW[w]=(fabQtyW[w]||0)+(n.qty||0);}});
  (erp||[]).forEach(e=>{const w=e.week_no;if(!w)return;if(e.is_cut_parts)cutShipW[w]=(cutShipW[w]||0)+(e.qty||0);else if(e.is_fabrication)fabShipW[w]=(fabShipW[w]||0)+(e.qty||0);});
  const tNci=nci.length,tQty=nci.reduce((s,n)=>s+(n.qty||0),0);
  const tCutNci=nci.filter(n=>n.item_category==="cut").length;
  const tCutQty=nci.filter(n=>n.item_category==="cut").reduce((s,n)=>s+(n.qty||0),0);
  const tFabNci=nci.filter(n=>n.item_category!=="cut").length;
  const tFabQty=nci.filter(n=>n.item_category!=="cut").reduce((s,n)=>s+(n.qty||0),0);
  const tCutShip=cutShipM.reduce((a,b)=>a+b,0);
  const tFabShip=fabShipM.reduce((a,b)=>a+b,0);
  const tRev=revM.reduce((a,b)=>a+b,0);
  const tClaim=claim.reduce((s,c)=>s+(c.claim_amount||0),0);
  const cutPPM=cutShipM.map((s,i)=>s>0?Math.round(cutQtyM[i]/s*1e6):null);
  const fabPPM=fabShipM.map((s,i)=>s>0?Math.round(fabQtyM[i]/s*1e6):null);
  const wksInMon=useMemo(()=>{const ws=new Set();nci.forEach(n=>{if(getMo(n.issued_date)===kpiMon){const w=n.week_no||isoW(n.issued_date);if(w)ws.add(w);}});(erp||[]).forEach(e=>{if(e.month===kpiMon&&e.week_no)ws.add(e.week_no);});const arr=[...ws].sort((a,b)=>a-b);if(!arr.length){const d=new Date(year,kpiMon-1,1);const w=isoW(d.toISOString().slice(0,10));[0,1,2,3].forEach(i=>arr.push(w+i));}return arr.slice(0,6);},[nci,erp,kpiMon,year]);
  const byModel={},byType={},byCaused={},byDisp={};
  nci.forEach(n=>{byModel[n.part_name]=(byModel[n.part_name]||0)+1;byType[n.type]=(byType[n.type]||0)+1;byCaused[n.caused_by]=(byCaused[n.caused_by]||0)+1;byDisp[n.disposition]=(byDisp[n.disposition]||0)+1;});
  const saveTgt=async()=>{setTarget({...tF});setETgt(false);const sb=getSB();if(sb){const row={year,cut_nci_target:tF.cut_nci_target,cut_qty_target:tF.cut_qty_target,cut_ppm_target:tF.cut_ppm_target,fab_nci_target:tF.fab_nci_target,fab_qty_target:tF.fab_qty_target,fab_ppm_target:tF.fab_ppm_target,total_nci_target:tF.total_nci_target,total_qty_target:tF.total_qty_target,claim_target:tF.claim_target};const{error}=await sb.from("kpi_targets").upsert(row,{onConflict:"year"});}};
  useEffect(()=>{
    const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#7fb3d3",font:{size:10}}}},scales:{x:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}},y:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}}}};
    if(r1.current){c1.current?.destroy();c1.current=new Chart(r1.current,{type:"bar",data:{labels:MO,datasets:[{label:"NCI건수",data:nciM,backgroundColor:"rgba(0,212,255,.55)",borderColor:"var(--cyan)",borderWidth:1},{label:"목표",data:Array(12).fill(Math.round((target.total_nci_target||30)/12)),type:"line",borderColor:"var(--red)",borderWidth:2,pointRadius:0,fill:false}]},options:base});}
    if(r2.current){c2.current?.destroy();c2.current=new Chart(r2.current,{type:"line",data:{labels:MO,datasets:[{label:"절단PPM",data:cutPPM,borderColor:"var(--blue)",tension:.4,fill:false},{label:"제관PPM",data:fabPPM,borderColor:"var(--amber)",tension:.4,fill:false}]},options:base});}
    if(!isExt&&r3.current){c3.current?.destroy();c3.current=new Chart(r3.current,{type:"bar",data:{labels:MO,datasets:[{label:"클레임",data:claimM,backgroundColor:"rgba(255,61,61,.5)",borderColor:"var(--red)",borderWidth:1}]},options:base});}
    if(r4.current&&Object.keys(byType).length){c4.current?.destroy();c4.current=new Chart(r4.current,{type:"doughnut",data:{labels:Object.keys(byType),datasets:[{data:Object.values(byType),backgroundColor:["#1a6ef5","#ffab00","#00e676","#8b5cf6","#ff3d3d","#00d4ff"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#7fb3d3",font:{size:10}},position:"right"}}}});}
    if(r5.current){c5.current?.destroy();c5.current=new Chart(r5.current,{type:"bar",data:{labels:MO,datasets:[{label:"절단 출하",data:cutShipM,backgroundColor:"rgba(26,110,245,.5)",borderColor:"var(--blue)",borderWidth:1},{label:"제관 출하",data:fabShipM,backgroundColor:"rgba(255,171,0,.5)",borderColor:"var(--amber)",borderWidth:1}]},options:base});}
    return()=>{[c1,c2,c3,c4,c5].forEach(c=>c.current?.destroy());};
  },[nci,claim,erp,target]);
  const analData=view==="model"?byModel:view==="type"?byType:view==="caused"?byCaused:view==="disposition"?byDisp:null;
  const ppm=(qty,ship)=>ship>0?Math.round(qty/ship*1e6):null;
  const ppmStr=(qty,ship)=>ship>0?String(Math.round(qty/ship*1e6)):"#DIV/0!";

  /* 블러 처리된 셀 */
  const BlurCell = ({val,style}) => isExt
    ? <td style={style}><span className="blur-val">●●●</span></td>
    : <td className="mono" style={style}>{val}</td>;

  return(<div>
    {isExt&&<div style={{padding:"6px 11px",background:"rgba(139,92,246,.08)",border:"1px solid rgba(139,92,246,.2)",borderRadius:"var(--r)",marginBottom:10,fontSize:12,color:"#a78bfa"}}>
      🔒 외부 열람 모드 — 매출액·클레임 금액 항목은 보안 처리됩니다.
    </div>}
    {ce&&<div className="card mb4"><div className="card-hd"><span className="card-title">🎯 KPI 목표값 ({year}년)</span>
      <div style={{display:"flex",gap:4}}>{eTgt?<React.Fragment><button className="btn btn-p btn-sm" onClick={saveTgt}>저장</button><button className="btn btn-s btn-sm" onClick={()=>setETgt(false)}>취소</button></React.Fragment>:<button className="btn btn-s btn-sm" onClick={()=>{setTF({...target});setETgt(true);}}>✎ 수정</button>}</div>
    </div>
    {eTgt?<div className="card-bd"><div className="fgg">
      {[["cut_nci_target","절단품 NCI건수","건"],["cut_qty_target","절단품 불량수","대"],["cut_ppm_target","절단품 PPM","PPM"],["fab_nci_target","제관품 NCI건수","건"],["fab_qty_target","제관품 불량수","대"],["fab_ppm_target","제관품 PPM","PPM"],["total_nci_target","합계 NCI건수","건"],["total_qty_target","합계 불량수","대"],["claim_target","클레임금액","KRW"]].map(([k,l,u])=>(
        <div key={k} className="fg"><label>{l}({u})</label><input type="number" value={tF[k]||0} onChange={e=>setTF(p=>({...p,[k]:Number(e.target.value)}))}/></div>
      ))}</div></div>
    :<div className="card-bd"><div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
      {[["절단PPM",target.cut_ppm_target,"PPM"],["제관PPM",target.fab_ppm_target,"PPM"],["총NCI",target.total_nci_target,"건"],["총불량",target.total_qty_target,"대"],["클레임",isExt?"●●●":fmt(target.claim_target),"원"]].map(([l,v,u])=>(
        <div key={l} style={{textAlign:"center"}}><div style={{fontSize:11,color:"var(--t3)",marginBottom:2}}>{l}</div><div className="mono" style={{fontWeight:700,fontSize:13,color:"var(--cyan)"}}>{v}<span style={{fontSize:9,color:"var(--t3)",marginLeft:1}}>{u}</span></div></div>
      ))}</div></div>}
    </div>}

    <div className="card mb4">
      <div className="card-hd">
        <span className="card-title">📋 Quality KPI ({year}년)</span>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span className="kpi-a">NCI자동</span><span className="kpi-m">ERP연동</span>
          {isExt&&<span className="blur-badge">🔒 금액보안</span>}
          <select style={{fontSize:11,padding:"2px 7px",width:"auto"}} value={kpiMon} onChange={e=>setKpiMon(Number(e.target.value))}>
            {MO.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
          </select>
        </div>
      </div>
      <div className="tw"><table style={{fontSize:11}}>
        <thead><tr>
          <th style={{minWidth:55,textAlign:"center"}}>항목</th><th style={{minWidth:100,textAlign:"center"}}>구분</th>
          <th style={{minWidth:45,textAlign:"right"}}>25년<br/>실적</th><th style={{minWidth:45,textAlign:"right"}}>26년<br/>목표</th>
          <th style={{minWidth:50,textAlign:"right"}}>26년<br/>실적</th>
          {wksInMon.map(w=><th key={w} style={{minWidth:42,textAlign:"right"}}>{w}W</th>)}
          <th style={{minWidth:46,textAlign:"right",color:"var(--cyan)"}}>합계</th>
        </tr></thead>
        <tbody>
          <tr><td rowSpan={13} style={{textAlign:"center",fontWeight:700,background:"rgba(255,171,0,.07)",color:"var(--amber)",fontSize:11,borderRight:"1px solid var(--bdr)"}}>필드<br/>불량</td>
            <td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--cyan)"}}>출하수 <span className="kpi-m">ERP</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td style={{textAlign:"right"}}>-</td>
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700}}>{tCutShip||"-"}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right",color:"var(--cyan)"}}>{cutShipW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutShipM[kpiMon-1]||"-"}</td>
          </tr>
          <tr><td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--t3)"}}>NCI건수</div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td className="mono" style={{textAlign:"right"}}>{target.cut_nci_target||10}</td>
            <td className="mono" style={{textAlign:"right",fontWeight:700,color:tCutNci<=(target.cut_nci_target||10)?"var(--green)":"var(--red)"}}>{tCutNci}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right"}}>{cutNciW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutNciM[kpiMon-1]||"-"}</td>
          </tr>
          <tr><td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--t3)"}}>불량수</div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td className="mono" style={{textAlign:"right"}}>{target.cut_qty_target||20}</td>
            <td className="mono" style={{textAlign:"right",fontWeight:700,color:tCutQty<=(target.cut_qty_target||20)?"var(--green)":"var(--red)"}}>{tCutQty}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right"}}>{cutQtyW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutQtyM[kpiMon-1]||"-"}</td>
          </tr>
          <tr><td style={{background:"rgba(255,61,61,.06)"}}><div style={{fontSize:10,fontWeight:700,color:"var(--red)"}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--red)"}}>불량율(PPM)</div></td>

/* ════════════════════════════════════════════
   ERP PAGE — external 블러 (매출액)
   ════════════════════════════════════════════ */
function ERPPage({data,setData,role,toast,year,fabItems}){
  const isExt = role==="external";
  const ce=role==="admin"||role==="manager";
  const fabCodes=React.useMemo(()=>new Set((fabItems||INIT_FAB_ITEMS).map(i=>String(i.code).trim())),[fabItems]);
  const[prev,setPrev]=useState(null);const[uploading,setUploading]=useState(false);

  const parse=file=>{
    if(isExt){toast("외부 계정은 ERP 업로드 기능이 없습니다","error");return;}
    setUploading(true);setPrev(null);
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
        let hi=rows.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v||"").trim()==="출하번호"));
        if(hi<0)hi=3;
        const hd=rows[hi];const col={};
        hd.forEach((h,i)=>{if(h!=null)col[String(h).trim()]=i;});
        const get=(r,name)=>col[name]!=null?r[col[name]]:null;
        const toDateStr=v=>{if(!v)return null;let y,m,d;if(v instanceof Date){if(isNaN(v.getTime()))return null;y=v.getUTCFullYear();m=v.getUTCMonth()+1;d=v.getUTCDate();}else if(typeof v==="number"){const dt=new Date(Math.round((v-25569)*864e5));y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate();}else{const dt=new Date(String(v).trim());if(isNaN(dt.getTime()))return null;y=dt.getFullYear();m=dt.getMonth()+1;d=dt.getDate();}if(y<2000||y>2100)return null;return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");};
        const isoWeek=ds=>{if(!ds)return null;try{const[y,m,d]=ds.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d));dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return Math.ceil(((dt-y0)/864e5+1)/7);}catch{return null;}};
        const parsed=[];
        rows.slice(hi+1).forEach(r=>{
          if(!Array.isArray(r)||!r.some(v=>v!=null&&v!==""))return;
          const shipType=String(get(r,"출하형태명")||"").trim();const custName=String(get(r,"납품처명")||"").trim();
          if(shipType!=="해외적송품판매"||custName!=="지니(GENIE IND.)")return;
          const qty=Number(get(r,"출고수량")||0);if(qty<=0)return;
          const ds=toDateStr(get(r,"출고일"));const iCode=String(get(r,"품목")||"").trim();const isFab=fabCodes.has(iCode);
          const mo=ds?parseInt(ds.split("-")[1])||null:null;const yr=ds?parseInt(ds.split("-")[0])||year:year;
          parsed.push({year:yr,month:mo,week_no:isoWeek(ds),ship_date:ds,invoice_no:String(get(r,"출하번호")||""),item_code:iCode,item_name:String(get(r,"품목명")||""),item_group:String(get(r,"품목그룹명")||""),cust_name:custName,ship_type:shipType,qty,total_amount_krw:Number(get(r,"합계금액(자국)")||0),is_fabrication:isFab,is_cut_parts:!isFab});
        });
        const fabQ=parsed.filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0);const cutQ=parsed.filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0);const totKRW=parsed.reduce((s,e)=>s+(e.total_amount_krw||0),0);
        setUploading(false);setPrev(parsed);
        toast(`파싱 ${parsed.length}건 | 제관${fabQ} 절단${cutQ} | 매출${Math.round(totKRW/1e6)}백만원`,"success");
      }catch(err){setUploading(false);toast("파싱오류: "+err.message,"error");}
    };rd.readAsBinaryString(file);
  };

  const confirmUpload=()=>{
    if(!prev||!prev.length)return;const snap=[...prev];setData(snap);
    const sb=getSB();if(sb){(async()=>{try{await sb.from("erp_sales").delete().eq("year",year);for(let i=0;i<snap.length;i+=100){await sb.from("erp_sales").insert(snap.slice(i,i+100).map(e=>({year:e.year,week_no:e.week_no,month:e.month,invoice_no:e.invoice_no||null,customer_name:e.cust_name||null,item_code:e.item_code||null,item_name:e.item_name||null,item_group_name:e.item_group||null,qty:Number(e.qty)||0,total_amount_krw:Number(e.total_amount_krw)||0,is_cut_parts:!!e.is_cut_parts,is_fabrication:!!e.is_fabrication,upload_batch:new Date().toISOString().slice(0,10)})));}}catch(err){}})();}
    const fabQ=snap.filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0);const cutQ=snap.filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0);const totKRW=snap.reduce((s,e)=>s+(e.total_amount_krw||0),0);
    setPrev(null);toast(`✅ ${snap.length}건 적용 | 제관${fabQ} 절단${cutQ} | 매출${Math.round(totKRW/1e6)}백만원`,"success");
  };

  const sum={total:(data||[]).reduce((s,e)=>s+e.qty,0),cut:(data||[]).filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0),fab:(data||[]).filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0),rev:(data||[]).reduce((s,e)=>s+(e.total_amount_krw||0),0)};

  return(<div>
    {isExt&&<div style={{padding:"6px 11px",background:"rgba(139,92,246,.08)",border:"1px solid rgba(139,92,246,.2)",borderRadius:"var(--r)",marginBottom:10,fontSize:12,color:"#a78bfa"}}>
      🔒 외부 열람 모드 — 매출액 항목은 보안 처리됩니다.
    </div>}
    <div className="stats" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
      <div className="sc ct"><div className="sc-lbl">▸ 합계 출하수량</div><div className="sc-val">{fmt(sum.total)}</div></div>
      <div className="sc cb"><div className="sc-lbl">▸ 절단품 출하</div><div className="sc-val">{fmt(sum.cut)}</div></div>
      <div className="sc ca"><div className="sc-lbl">▸ 제관품 출하</div><div className="sc-val">{fmt(sum.fab)}</div></div>
      <div className="sc cg"><div className="sc-lbl">▸ GENIE 매출액(KRW)</div>
        <div className="sc-val" style={{fontSize:13}}>{isExt?<span className="blur-val">●●●</span>:fmt(sum.rev)}</div>
      </div>
    </div>
    <div className="g2 mb4">
      <div className="card"><div className="card-hd"><span className="card-title">📥 출고현황 파일 업로드</span></div><div className="card-bd">
        {isExt?<div style={{padding:14,textAlign:"center",color:"#a78bfa",fontSize:12,border:"1px dashed rgba(139,92,246,.3)",borderRadius:6}}>🔒 외부 계정은 ERP 업로드 불가</div>:
        <React.Fragment>
          <div className="info-box blue" style={{marginBottom:10,fontSize:11}}><b>집계 조건</b><br/>💰 매출: U열 | AA=해외적송품판매 AND Y=지니(GENIE IND.)<br/>📦 수량: L열 | 동일조건</div>
          {ce&&<label className={`btn ${uploading?"btn-s":"btn-p"}`} style={{cursor:"pointer"}}>
            {uploading?"⏳ 파싱 중...":"📂 엑셀 업로드 (.xls/.xlsx)"}
            <input type="file" accept=".xlsx,.xls" style={{display:"none"}} disabled={uploading} onChange={e=>{if(e.target.files[0])parse(e.target.files[0]);e.target.value="";}}/>
          </label>}
        </React.Fragment>}
      </div></div>
      <div className="card"><div className="card-hd">
        <span className="card-title">📋 현재 데이터</span>
        {(data||[]).length>0&&ce&&<button className="btn btn-d btn-sm" onClick={()=>{if(!confirm("ERP 데이터를 초기화하시겠습니까?"))return;setData([]);const sb2=getSB();if(sb2){sb2.from("erp_sales").delete().eq("year",year).then(()=>{}).catch(()=>{});}toast("ERP 초기화됨","info");}}>초기화</button>}
      </div><div className="card-bd">
        {(data||[]).length>0?(()=>{
          const months=[...new Set((data||[]).map(e=>e.month).filter(Boolean))].sort((a,b)=>a-b);
          const weeks=[...new Set((data||[]).map(e=>e.week_no).filter(Boolean))].sort((a,b)=>a-b);
          return<div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>{months.map(m=><span key={m} className="b bc">{m}월</span>)}<span style={{fontSize:11,color:"var(--t3)"}}>({weeks.length}주차)</span></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              <div style={{padding:"7px 9px",background:"var(--bg3)",borderRadius:"var(--r)"}}><div style={{fontSize:10,color:"var(--t3)"}}>총 품목수</div><div className="mono" style={{fontWeight:700}}>{fmt((data||[]).length)}건</div></div>
              <div style={{padding:"7px 9px",background:"var(--bg3)",borderRadius:"var(--r)"}}><div style={{fontSize:10,color:"var(--t3)"}}>합계 출하</div><div className="mono" style={{fontWeight:700}}>{fmt(sum.total)} EA</div></div>
              <div style={{padding:"7px 9px",background:"rgba(26,110,245,.08)",borderRadius:"var(--r)"}}><div style={{fontSize:10,color:"var(--t3)"}}>절단품</div><div className="mono" style={{fontWeight:700,color:"var(--blue)"}}>{fmt(sum.cut)} EA</div></div>
              <div style={{padding:"7px 9px",background:"rgba(255,171,0,.08)",borderRadius:"var(--r)"}}><div style={{fontSize:10,color:"var(--t3)"}}>제관품</div><div className="mono" style={{fontWeight:700,color:"var(--amber)"}}>{fmt(sum.fab)} EA</div></div>
              <div style={{padding:"7px 9px",background:isExt?"rgba(139,92,246,.08)":"rgba(0,212,255,.08)",borderRadius:"var(--r)",border:`1px solid ${isExt?"rgba(139,92,246,.2)":"rgba(0,212,255,.2)"}`,gridColumn:"1/-1"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>GENIE 매출액 {isExt&&<span className="blur-badge">🔒</span>}</div>
                <div className="mono" style={{fontWeight:700,fontSize:15,color:isExt?"#a78bfa":"var(--cyan)"}}>{isExt?<span className="blur-val" style={{fontSize:20}}>●●●●●●</span>:fmt(sum.rev)+" 원"}</div>
              </div>
            </div>
          </div>;
        })():<div style={{textAlign:"center",padding:20,fontSize:12,color:"var(--t3)"}}>ERP 데이터 없음</div>}
      </div></div>
    </div>
    {prev&&<div className="card mb4"><div className="card-hd">
      <span className="card-title">🔍 미리보기 ({prev.length}건)</span>
      <div style={{display:"flex",gap:5}}><button className="btn btn-g" onClick={confirmUpload}>✅ 확정 적용</button><button className="btn btn-s" onClick={()=>setPrev(null)}>취소</button></div>
    </div>
    <div className="tw"><table>
      <thead><tr><th>분류</th><th>출고일</th><th>주차</th><th>월</th><th>품목번호</th><th>품목명</th><th>수량(EA)</th><th>매출액(KRW)</th></tr></thead>
      <tbody>{prev.slice(0,30).map((e,i)=><tr key={i}>
        <td><span className={`b ${e.is_cut_parts?"bc":"bg"}`}>{e.is_cut_parts?"절단":"제관"}</span></td>
        <td className="mono" style={{fontSize:11}}>{e.ship_date||"-"}</td><td className="mono">{e.week_no?"W"+e.week_no:"-"}</td><td className="mono">{e.month?e.month+"월":"-"}</td>
        <td className="mono" style={{fontSize:11}}>{e.item_code}</td><td style={{fontSize:11,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis"}}>{e.item_name}</td>
        <td className="mono">{fmt(e.qty)}</td><td className="mono">{isExt?<span className="blur-val">●●●</span>:fmt(e.total_amount_krw)}</td>
      </tr>)}{prev.length>30&&<tr><td colSpan={8} style={{textAlign:"center",color:"var(--t3)",fontSize:11}}>... 외 {prev.length-30}건</td></tr>}
      </tbody>
    </table></div></div>}
    {(data||[]).length>0&&<div className="card"><div className="card-hd"><span className="card-title">📊 주차별 집계</span></div>
    <div className="tw"><table>
      <thead><tr><th>주차</th><th>월</th><th>출고일</th><th style={{color:"var(--blue)"}}>절단(EA)</th><th style={{color:"var(--amber)"}}>제관(EA)</th><th>합계(EA)</th>
        <th style={{color:isExt?"#a78bfa":"var(--cyan)"}}>{isExt?"매출액 🔒":"매출액(KRW)"}</th>
      </tr></thead>
      <tbody>{(()=>{
        const bw={};(data||[]).forEach(e=>{const k=e.week_no||0;if(!bw[k])bw[k]={w:k,m:e.month,d1:e.ship_date,d2:e.ship_date,cQ:0,fQ:0,rev:0};else{if(e.ship_date<bw[k].d1)bw[k].d1=e.ship_date;if(e.ship_date>bw[k].d2)bw[k].d2=e.ship_date;}if(e.is_cut_parts)bw[k].cQ+=e.qty;else bw[k].fQ+=e.qty;bw[k].rev+=(e.total_amount_krw||0);});
        const tot={cQ:0,fQ:0,rev:0};
        const rs=Object.values(bw).sort((a,b)=>a.w-b.w).map(v=>{tot.cQ+=v.cQ;tot.fQ+=v.fQ;tot.rev+=v.rev;return<tr key={v.w}>
          <td className="mono" style={{fontWeight:700}}>{v.w?"W"+v.w:"-"}</td><td className="mono">{v.m?v.m+"월":"-"}</td>
          <td className="mono" style={{fontSize:10,color:"var(--t3)"}}>{v.d1}{v.d1!==v.d2?"~"+v.d2:""}</td>
          <td className="mono" style={{color:"var(--blue)"}}>{fmt(v.cQ)||"-"}</td><td className="mono" style={{color:"var(--amber)"}}>{fmt(v.fQ)||"-"}</td>
          <td className="mono" style={{fontWeight:700}}>{fmt(v.cQ+v.fQ)}</td>
          <td className="mono" style={{color:isExt?"#a78bfa":"var(--cyan)"}}>{isExt?<span className="blur-val">●●●</span>:fmt(v.rev)}</td>
        </tr>;});
        rs.push(<tr key="t" style={{borderTop:"2px solid var(--cyan)"}}>
          <td colSpan={3} style={{fontWeight:700,color:"var(--cyan)"}}>합 계</td>
          <td className="mono" style={{color:"var(--blue)",fontWeight:700}}>{fmt(tot.cQ)}</td><td className="mono" style={{color:"var(--amber)",fontWeight:700}}>{fmt(tot.fQ)}</td>
          <td className="mono" style={{fontWeight:700}}>{fmt(tot.cQ+tot.fQ)}</td>
          <td className="mono" style={{color:isExt?"#a78bfa":"var(--cyan)",fontWeight:700,fontSize:13}}>{isExt?<span className="blur-val">●●●</span>:fmt(tot.rev)}</td>
        </tr>);return rs;
      })()}</tbody>
    </table></div></div>}
  </div>);
}

/* ════════════════════════════════════════════
   ITEM MASTER PAGE — 기존 동일
   ════════════════════════════════════════════ */
function ItemMasterPage({fabItems,setFabItems,role,toast}){
  const ce=role==="admin"||role==="manager";
  const[showM,setShowM]=useState(false);const[form,setForm]=useState({code:"",name:"",model:""});const[srch,setSrch]=useState("");const sf=p=>setForm(v=>({...v,...p}));
  useEffect(()=>{const load=async()=>{const sb=getSB();try{const{data}=await sb.from("kpi_targets").select("fab_items_json").eq("year",0).single();if(data?.fab_items_json){setFabItems(JSON.parse(data.fab_items_json));return;}}catch(e){}setFabItems(INIT_FAB_ITEMS);};load();},[]);
  const syncItems=async(items)=>{const sb=getSB();if(!sb)return;await sb.from("kpi_targets").upsert({year:0,fab_items_json:JSON.stringify(items)},{onConflict:"year",ignoreDuplicates:false});};
  const save=async()=>{if(!form.code.trim()){toast("품목번호를 입력하세요","error");return;}if(fabItems.find(i=>i.code===form.code.trim())){toast("이미 등록된 품목번호입니다","error");return;}const newItem={code:form.code.trim(),name:form.name.trim(),model:form.model.trim()};const updated=[...fabItems,newItem];setFabItems(updated);await syncItems(updated);toast(`품목 ${form.code} 등록 완료`,"success");setForm({code:"",name:"",model:""});setShowM(false);};
  const del=async code=>{if(!confirm(`${code} 를 삭제하시겠습니까?`))return;const updated=fabItems.filter(i=>i.code!==code);setFabItems(updated);await syncItems(updated);toast(`${code} 삭제됨`,"info");};
  const reset=async()=>{if(!confirm("초기화하시겠습니까?"))return;setFabItems(INIT_FAB_ITEMS);await syncItems(INIT_FAB_ITEMS);toast("초기화됨","info");};
  const xlDown=()=>{const ws=XLSX.utils.json_to_sheet(fabItems.map(i=>({"품목번호":i.code,"품목명":i.name,"모델(품목그룹)":i.model,"분류":"제관품"})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"제관품목록");XLSX.writeFile(wb,`제관품_품목마스터_${new Date().toISOString().slice(0,10)}.xlsx`);toast("다운로드 완료","success");};
  const xlUp=file=>{const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:"binary"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws);const imported=rows.map(r=>({code:String(r["품목번호"]||r["code"]||"").trim(),name:String(r["품목명"]||r["name"]||"").trim(),model:String(r["모델(품목그룹)"]||r["model"]||"").trim()})).filter(r=>r.code);const merged=[...fabItems,...imported.filter(i=>!fabItems.find(x=>x.code===i.code))];setFabItems(merged);toast(`${imported.length}건 가져오기 완료`,"success");}catch(err){toast("오류: "+err.message,"error");}};rd.readAsBinaryString(file);};
  const filtered=fabItems.filter(i=>!srch||i.code.includes(srch)||i.name.toLowerCase().includes(srch.toLowerCase())||i.model.toLowerCase().includes(srch.toLowerCase()));
  return(<div>
    <div className="info-box blue mb4"><b>📌 품목 마스터 관리 규칙</b><br/>이 목록에 등록된 품목번호 = <span style={{color:"var(--amber)",fontWeight:700}}>제관품(Fabrication)</span><br/>이 목록에 <b>없는</b> 품목번호 = <span style={{color:"var(--blue)",fontWeight:700}}>절단품(Cut parts)</span></div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:14}}>
      <div className="sc ca"><div className="sc-lbl">▸ 제관품 등록 수</div><div className="sc-val">{fabItems.length}</div></div>
      <div className="sc cb"><div className="sc-lbl">▸ 검색 결과</div><div className="sc-val">{filtered.length}</div></div>
      <div className="sc cg"><div className="sc-lbl">▸ 분류 기준</div><div className="sc-val mono" style={{fontSize:13}}>목록 = 제관</div></div>
      <div className="sc cc"><div className="sc-lbl">▸ 미등록 품목</div><div className="sc-val mono" style={{fontSize:13}}>자동→절단</div></div>
    </div>
    <div className="fbar">
      <input style={{flex:1,maxWidth:280}} placeholder="🔍 품목번호·품목명·모델 검색" value={srch} onChange={e=>setSrch(e.target.value)}/>
      <span style={{fontSize:11,color:"var(--t3)",marginLeft:"auto"}}>{filtered.length}/{fabItems.length}건</span>
      {ce&&<button className="btn btn-p" onClick={()=>{setForm({code:"",name:"",model:""});setShowM(true);}}>+ 품목 추가</button>}
      <button className="btn btn-s" onClick={xlDown}>⬇ 엑셀 다운</button>
      {ce&&<label className="btn btn-s" style={{cursor:"pointer"}}>⬆ 엑셀 업로드<input type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0])xlUp(e.target.files[0]);}}/></label>}
      {ce&&<button className="btn btn-s" onClick={reset} style={{color:"var(--amber)"}}>↺ 초기화</button>}
    </div>
    <div className="card"><div className="card-hd"><span className="card-title">📋 제관품 품목 마스터</span></div>
      <div className="tw"><table><thead><tr><th>품목번호</th><th>품목명</th><th>모델(품목그룹)</th><th>분류</th>{ce&&<th>관리</th>}</tr></thead>
        <tbody>{filtered.map(i=>(<tr key={i.code}><td className="mono" style={{color:"var(--amber)",fontWeight:700}}>{i.code}</td><td style={{fontSize:12}}>{i.name}</td><td style={{fontSize:12,color:"var(--t3)"}}>{i.model}</td><td><span className="b bg">제관품</span></td>{ce&&<td><button className="ib d" onClick={()=>del(i.code)}>✕</button></td>}</tr>))}</tbody>
      </table></div>
    </div>
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
      <div className="modal" style={{maxWidth:480}}>
        <div className="mhd"><span className="mtitle">제관품 품목 추가</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div>
        <div className="mbd">
          <div className="info-box amber" style={{marginBottom:12}}>이 품목번호를 <b>제관품</b>으로 등록합니다.</div>
          <div style={{display:"flex",flexDirection:"column",gap:9}}>
            <div className="fg"><label>품목번호 *</label><input value={form.code} onChange={e=>sf({code:e.target.value})} placeholder="예: 1290073"/></div>
            <div className="fg"><label>품목명</label><input value={form.name} onChange={e=>sf({name:e.target.value})} placeholder="예: WELDMENT,DRIVE CHASSIS"/></div>
            <div className="fg"><label>모델(품목그룹)</label><input value={form.model} onChange={e=>sf({model:e.target.value})} placeholder="예: TEREX GENIE Z45"/></div>
          </div>
        </div>
        <div className="mft"><button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button><button className="btn btn-p" onClick={save}>제관품으로 등록</button></div>
      </div>
    </div>}
  </div>);
}

/* ════════════════════════════════════════════

function Settings({user,toast,conn}){

function YearAddInline({onAdd}){
  const[ny,setNy]=useState("");const[open,setOpen]=useState(false);
  const add=()=>{const y=parseInt(ny);if(!y||y<2020||y>2060){alert("2020~2060 사이 연도를 입력하세요.");return;}onAdd(y);setNy("");setOpen(false);};
  return open?(<div style={{padding:"5px 6px",background:"var(--bg3)",borderRadius:"var(--r)",marginTop:3,border:"1px solid rgba(0,212,255,.2)"}}>
    <div style={{fontSize:12,color:"var(--cyan)",marginBottom:4,fontWeight:700}}>새 연도 추가</div>
    <div style={{display:"flex",gap:4}}>
      <input type="number" value={ny} onChange={e=>setNy(e.target.value)} placeholder="예: 2025" style={{flex:1,padding:"3px 6px",fontSize:12,fontFamily:"Calibri"}} onKeyDown={e=>e.key==="Enter"&&add()} autoFocus/>
      <button className="btn btn-p" style={{padding:"2px 7px",fontSize:13}} onClick={add}>추가</button>
      <button className="btn btn-s" style={{padding:"2px 6px",fontSize:13}} onClick={()=>{setNy("");setOpen(false);}}>✕</button>
    </div>
  </div>):(<button className="yr-add" onClick={()=>setOpen(true)}>+ 연도 추가</button>);
}

            <tbody>{Object.entries(claim.reduce((acc,cl)=>{const k=cl.caused_by||"미지정";if(!acc[k])acc[k]={cnt:0,claim:0,tc:0};acc[k].cnt++;acc[k].claim+=(cl.claim_amount||0);acc[k].tc+=Math.round((cl.final_agreed||0)*(cl.tc_tech_ratio||0)/100);return acc;},{})).sort((a,b)=>b[1].claim-a[1].claim).map(([k,v],i)=>(

            ))}</tbody>
          </table>

    {Object.keys(yearDB).length>1&&<div className="card"><div className="card-hd"><span className="card-title">📈 연도별 KPI 비교</span></div>

function App(){
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[toasts,setToasts]=useState([]);
  const[yearDB,setYearDB]=useState(INIT);const[year,setYear]=useState(2026);
  const[conn,setConn]=useState(false);
  const[currency,setCurrency]=useState("KRW");const[rates,setRates]=useState({USD:1480,EUR:1620,JPY:9.8});
  const[fabItems,setFabItems]=useState(INIT_FAB_ITEMS);
  const cur=yearDB[year]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
  const setter=f=>fn=>setYearDB(db=>({...db,[year]:{...db[year],[f]:typeof fn==="function"?fn(db[year]?.[f]||[]):fn}}));
  const setNci=setter("nci"),setClaim=setter("claim"),setErp=setter("erp");
  const setKpiTarget=v=>setYearDB(db=>({...db,[year]:{...db[year],kpiTarget:v}}));
  const addYear=y=>setYearDB(db=>({...db,[y]:{nci:[],claim:[],erp:[],kpiTarget:mkKPI()}}));
  const delYear=y=>{setYearDB(db=>{const n={...db};delete n[y];return n;});if(year===y)setYear(Math.max(...Object.keys(yearDB).map(Number).filter(x=>x!==y)));};
  const toast=useCallback((msg,type="info")=>{const id=Date.now();setToasts(p=>[...p,{id,msg,type}]);setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3200);},[]);

  useEffect(()=>{
    // localStorage에 저장된 기존 계정 데이터를 Supabase로 1회 마이그레이션
    const migrateAuth = async () => {
      try {
        const raw = localStorage.getItem("qms_auth_table_v1");
        if(!raw) return;
        const old = JSON.parse(raw);
        if(!old.users || old.users.length === 0) return;
        // Supabase에 이미 계정이 있는지 확인
        const check = await fetch(_SUPA_URL+"/rest/v1/qms_auth?select=id&limit=1", {headers:_H});
        const existing = check.ok ? await check.json() : [];
        if(existing.length > 0) return; // 이미 있으면 스킵

        </div>
      </div>

        {page==="dashboard"&&<Dashboard nci={cur.nci} claim={cur.claim} erp={cur.erp} target={cur.kpiTarget} year={year} yearDB={yearDB} role={user.role}/>}

        {page==="claim"&&<ClaimPage data={cur.claim} setData={setClaim} role={user.role} toast={toast} year={year} currency={currency} setCurrency={setCurrency} rates={rates} setRates={setRates}/>}
        {page==="kpi"&&<KPIPage nci={cur.nci} claim={cur.claim} erp={cur.erp} target={cur.kpiTarget} setTarget={setKpiTarget} role={user.role} year={year} yearDB={yearDB}/>}
        {page==="erp"&&<ERPPage data={cur.erp} setData={setErp} role={user.role} toast={toast} year={year} fabItems={fabItems}/>}
        {page==="items"&&<ItemMasterPage fabItems={fabItems} setFabItems={setFabItems} role={user.role} toast={toast}/>}
        {page==="settings"&&<Settings user={user} toast={toast} conn={conn}/>}
        {page==="auth"&&isMaster&&<MasterPage inline={true}/>}
        {page==="welder"&&<WelderSystemPage role={user.role} toast={toast}/>}
      </div>
    </div>
    <Toast toasts={toasts}/>
  </div>);
}

  const expiringSoon=wpqrList.filter(w=>{if(!w.approved||!w.cert_expiry_date)return false;const d=Math.ceil((new Date(w.cert_expiry_date)-new Date())/86400000);return d>0&&d<=60;});
  const TABS=[{id:'dashboard',l:'📊 대시보드'},{id:'welders',l:'👷 용접사 기본정보'},{id:'templates',l:'📁 WPQR 양식 라이브러리'},{id:'wpqr',l:'📋 WPQR 작성'},{id:'qualified',l:'🏆 유자격 명단'},{id:'stickers',l:'🏷️ 자격 스티커'},{id:'renewal',l:'🔄 자격 갱신'}];
  return(
    <div>
      <div style={{display:'flex',gap:0,borderBottom:'1px solid var(--bdr)',marginBottom:14,overflowX:'auto'}}>
        {TABS.map(t=><div key={t.id} onClick={()=>setWtab(t.id)} style={{padding:'8px 14px',cursor:'pointer',fontSize:12,fontWeight:wtab===t.id?700:500,color:wtab===t.id?'var(--cyan)':'var(--t3)',whiteSpace:'nowrap',borderBottom:wtab===t.id?'2px solid var(--cyan)':'2px solid transparent',transition:'.15s'}}>{t.l}</div>)}
      </div>
      {wtab==='dashboard' &&<WDashboard welders={welders} wpqrList={wpqrList} renewals={renewals} activeQual={activeQual} expiringSoon={expiringSoon} templates={templates}/>}
      {wtab==='welders'   &&<WWelderList welders={welders} setWelders={setWelders} wpqrList={wpqrList} ce={ce} toast={toast}/>}
      {wtab==='templates' &&<WTemplateLib templates={templates} setTemplates={setTemplates} ce={ce} toast={toast}/>}
      {wtab==='wpqr'      &&<WWPQRList wpqrList={wpqrList} setWpqrList={setWpqrList} welders={welders} templates={templates} ce={ce} toast={toast}/>}
      {wtab==='qualified' &&<WQualifiedList wpqrList={wpqrList} welders={welders}/>}
      {wtab==='stickers'  &&<WStickerList wpqrList={wpqrList} welders={welders}/>}
      {wtab==='renewal'   &&<WRenewalMgr renewals={renewals} setRenewals={setRenewals} wpqrList={wpqrList} setWpqrList={setWpqrList} welders={welders} ce={ce} toast={toast}/>}
    </div>
  );
}
