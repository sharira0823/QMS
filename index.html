<style>
:root{
  --font-ko:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --font-en:"Calibri","Calibri Regular",Arial,sans-serif;
  --font-mono:"Calibri","Consolas","IBM Plex Mono",monospace;
  --bg:#060d1a;--bg2:#0b1628;--bg3:#0f1f38;--bg4:#162a4a;
  --cyan:#00d4ff;--blue:#1a6ef5;--green:#00e676;--amber:#ffab00;--red:#ff3d3d;--purple:#8b5cf6;--teal:#00bcd4;
  --t1:#e8f4fd;--t2:#7fb3d3;--t3:#3a6080;--bdr:#143050;--bdr2:#1a3a58;--r:6px;--rl:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-ko);background:var(--bg);color:var(--t1);min-height:100vh;font-size:13px;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto;}
.main{margin-left:210px;flex:1;display:flex;flex-direction:column;}
.topbar{height:44px;background:var(--bg2);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:90;gap:10px;}
.content{padding:12px 14px;flex:1;}
.logo-wrap{padding:10px 12px;border-bottom:1px solid var(--bdr);}
.logo{font-family:"Bebas Neue";font-size:26px;color:var(--cyan);letter-spacing:4px;}
.logo-sub{font-size:9px;color:var(--t3);letter-spacing:1px;}
.logo-ver{font-size:9px;color:var(--cyan);opacity:.5;}

.yr-lbl{font-size:10px;color:var(--t3);letter-spacing:1px;padding:3px 5px;text-transform:uppercase;}
.yt{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--t2);transition:.15s;margin-bottom:1px;}
.yt:hover{background:var(--bg3);color:var(--t1);}
.yt.act{background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2);}
.yt-c{font-size:16px;padding:1px 4px;border-radius:3px;background:var(--bg3);color:var(--t3);}
.yt.act .yt-c{background:rgba(0,212,255,.12);color:var(--cyan);}
.yr-add{width:100%;margin-top:3px;padding:4px;border-radius:var(--r);border:1px dashed var(--bdr);background:transparent;color:var(--t3);cursor:pointer;font-size:15px;font-family:var(--font-ko);}
.yr-add:hover{border-color:var(--cyan);color:var(--cyan);}
.nav-sec{padding:3px 4px 1px;}
.nav-lbl{font-size:10px;color:var(--t3);letter-spacing:1px;padding:4px 7px;text-transform:uppercase;}
.ni{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:var(--r);cursor:pointer;margin-bottom:1px;font-size:12px;color:var(--t2);transition:.15s;}
.ni:hover{background:var(--bg3);color:var(--t1);}
.ni.act{background:var(--blue);color:#fff;}
.sb-foot{padding:7px;border-top:1px solid var(--bdr);margin-top:auto;}
.ubadge{display:flex;align-items:center;gap:5px;padding:6px;background:var(--bg3);border-radius:var(--r);}
.uav{width:24px;height:24px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.uname{font-size:10px;font-weight:600;}
.udept{font-size:8px;color:var(--t3);}
.rb{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;}
.rb.admin{background:rgba(255,61,61,.18);color:var(--red);}
.rb.manager{background:rgba(255,171,0,.18);color:var(--amber);}
.rb.viewer{background:rgba(148,163,184,.12);color:var(--t2);}
.pg-title{font-size:14px;font-weight:700;}
.yr-badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--font-mono);background:rgba(0,212,255,.08);color:var(--cyan);border:1px solid rgba(0,212,255,.18);}
.conn-ok{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.2);}
.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rl);}
.card-hd{padding:8px 13px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;}
.card-bd{padding:10px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.mb3{margin-bottom:8px;}
.mb4{margin-bottom:10px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px;}

.sc::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;}
.sc.cb::before{background:var(--blue);}  .sc.cc::before{background:var(--cyan);}
.sc.cg::before{background:var(--green);} .sc.ca::before{background:var(--amber);}
.sc.cr::before{background:var(--red);}   .sc.cp::before{background:var(--purple);}

.bc{background:rgba(0,212,255,.12);color:var(--cyan);}
.btn{padding:4px 10px;border-radius:var(--r);border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font-ko);display:inline-flex;align-items:center;gap:4px;transition:.15s;white-space:nowrap;}
.btn-p{background:var(--blue);color:#fff;} .btn-p:hover{background:#1555d0;}
.btn-s{background:var(--bg3);color:var(--t2);border:1px solid var(--bdr);} .btn-s:hover{color:var(--t1);}
.btn-d{background:var(--red);color:#fff;}
.btn-g{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.25);}

.ib{width:23px;height:23px;border-radius:var(--r);background:var(--bg3);border:1px solid var(--bdr);color:var(--t3);cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
.ib:hover{color:var(--t1);} .ib.d:hover{color:var(--red);}
.fg{display:flex;flex-direction:column;gap:4px;}
.fgg{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fg.full{grid-column:1/-1;}
label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.4px;}
input,select,textarea{background:var(--bg3);border:1px solid var(--bdr);color:var(--t1);padding:5px 8px;border-radius:var(--r);font-size:12px;font-family:var(--font-ko);transition:.15s;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);}
input[readonly]{background:rgba(0,212,255,.05);border-color:rgba(0,212,255,.18);color:var(--cyan);font-family:var(--font-mono);font-weight:700;cursor:default;}

textarea{resize:vertical;min-height:58px;}
select option{background:var(--bg2);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;}
.modal{background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rl);width:100%;max-width:820px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.7);}
.mhd{padding:13px 17px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1;}
.mtitle{font-size:14px;font-weight:700;}
.mbd{padding:17px;}
.mft{padding:10px 17px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:6px;position:sticky;bottom:0;background:var(--bg2);}
.xb{width:23px;height:23px;border-radius:50%;background:var(--bg3);border:none;color:var(--t2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.pzone{border:2px dashed var(--bdr);border-radius:var(--r);padding:11px;text-align:center;cursor:pointer;transition:.2s;}
.pzone:hover,.pzone.dov{border-color:var(--cyan);background:rgba(0,212,255,.03);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:7px;}
.pt{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr);cursor:pointer;background:var(--bg3);}
.pt img{width:100%;height:100%;object-fit:cover;transition:transform .2s;}
.pt:hover img{transform:scale(1.08);}
.pdel{position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;background:rgba(255,61,61,.9);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;}
.pt:hover .pdel{opacity:1;}
.plbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;padding:2px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.phc{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:16px;font-weight:600;background:rgba(0,212,255,.1);color:var(--cyan);cursor:pointer;}
.phc:hover{background:rgba(0,212,255,.22);}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:6px;margin-top:7px;}
.doc-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:7px;text-align:center;position:relative;transition:.15s;}
.doc-card:hover{border-color:var(--cyan);}
.atabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:7px;}
.atab{padding:5px 11px;font-size:15px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
.atab:hover{color:var(--t2);} .atab.act{color:var(--cyan);border-bottom-color:var(--cyan);}
.psec{margin-top:13px;padding-top:11px;border-top:1px solid var(--bdr);}
.psec-lbl{font-size:16px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:3000;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.lb img{max-width:86vw;max-height:74vh;object-fit:contain;border-radius:var(--r);}
.lb-bar{display:flex;gap:8px;margin-top:10px;align-items:center;}
.lb-btn{background:var(--bg3);border:1px solid var(--bdr);color:var(--t1);padding:4px 11px;border-radius:var(--r);cursor:pointer;font-size:15px;font-family:var(--font-ko);}
.lb-btn:disabled{opacity:.35;cursor:default;}
.lb-close{position:absolute;top:11px;right:11px;width:29px;height:29px;border-radius:50%;background:var(--bg3);border:1px solid var(--bdr);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-info{font-size:16px;color:var(--t3);margin-top:5px;}
.kpi-a{font-size:10px;background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.2);color:var(--green);padding:1px 4px;border-radius:2px;}
.kpi-m{font-size:10px;background:rgba(255,171,0,.1);border:1px solid rgba(255,171,0,.2);color:var(--amber);padding:1px 4px;border-radius:2px;}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.ch-wrap{position:relative;height:180px;}
.fbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:7px;}
.twrap{position:fixed;bottom:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:5px;}
.toast{background:var(--bg4);border:1px solid var(--bdr);border-radius:var(--r);padding:7px 11px;font-size:15px;max-width:270px;display:flex;align-items:center;gap:6px;animation:ti .18s ease;}
.toast.s{border-left:3px solid var(--green);} .toast.e{border-left:3px solid var(--red);} .toast.i{border-left:3px solid var(--blue);}
@keyframes ti{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.lc{width:350px;background:var(--bg2);border:1px solid var(--bdr);border-radius:var(--rl);padding:30px;}
.mono{font-family:var(--font-mono);}
.st{font-size:15px;font-weight:700;color:var(--t3);letter-spacing:1px;text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--bdr);margin-bottom:9px;}
.hint{font-size:11px;color:var(--t3);}
.tag-a{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--green);font-size:9px;padding:1px 4px;border-radius:2px;}
.info-box{padding:8px 11px;border-radius:var(--r);font-size:12px;line-height:1.7;}
.info-box.blue{background:rgba(26,110,245,.07);border:1px solid rgba(26,110,245,.18);color:var(--t2);}
.info-box.green{background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.18);color:var(--green);}
.info-box.amber{background:rgba(255,171,0,.07);border:1px solid rgba(255,171,0,.18);color:var(--amber);}
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:12px;}
.tab{padding:7px 14px;font-size:16px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;}
.tab:hover{color:var(--t2);} .tab.act{color:var(--cyan);border-bottom-color:var(--cyan);}
</style>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
/* ── Supabase ── */
let _sb=null;
const getSB=()=>{const u=localStorage.getItem("supa_url"),k=localStorage.getItem("supa_key");if(!u||!k)return null;if(!_sb)_sb=window.supabase.createClient(u,k);return _sb;};
/* ── Utils ── */
const fmt=n=>n==null?"-":Number(n).toLocaleString("ko-KR");
const fmtD=d=>d?String(d).substring(0,10):"-";
const MO=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const TC={가공:"ba",취부:"bp",용접:"br",치수:"bb",도장:"ba",기타:"bx",포장:"bx",절단:"bc"};
const DC={Return:"bb","Owner Rework":"ba","Site Rework":"ba",Discard:"br"};
const TYPES=["가공","취부","용접","치수","도장","기타","포장","절단"];
const DISPS=["Return","Owner Rework","Site Rework","Discard"];
const isoW=ds=>{if(!ds)return"";const d=new Date(ds);if(isNaN(d))return"";const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);};
const getMo=ds=>{if(!ds)return null;const d=new Date(ds);return isNaN(d)?null:d.getMonth()+1;};
const add90=ds=>{if(!ds)return"";try{const d=new Date(ds);d.setDate(d.getDate()+90);return d.toISOString().slice(0,10);}catch{return "";}};
/* 이미지 600px/75% 압축 */
const compImg=f=>new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const M=600;let w=img.width,h=img.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);res({name:f.name,size:f.size,data:cv.toDataURL("image/jpeg",.75),w,h});};img.src=e.target.result;};rd.readAsDataURL(f);});
const attFile=f=>new Promise(res=>{const ext=f.name.split(".").pop().toLowerCase();if(["jpg","jpeg","png","gif","webp"].includes(ext)){compImg(f).then(res);}else{const rd=new FileReader();rd.onload=e=>res({name:f.name,size:f.size,data:e.target.result,fileType:"doc"});rd.readAsDataURL(f);}});
const FICONS={pdf:"📄",doc:"📝",docx:"📝",xls:"📊",xlsx:"📊",hwp:"📝",zip:"🗜"};
const gIcon=n=>FICONS[n?.split(".").pop()?.toLowerCase()]||"📁";
const fSz=b=>b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";
/* ── useDrag ── */
function useDrag(items,setItems,ce){
  const di=useRef(null),oi=useRef(null);
  const start=(e,i)=>{if(!ce)return;di.current=i;e.dataTransfer.effectAllowed="move";e.currentTarget.classList.add("drag-on");};
  const end=e=>{e.currentTarget.classList.remove("drag-on");document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(di.current===null||oi.current===null||di.current===oi.current){di.current=null;oi.current=null;return;}const arr=[...items];const[m]=arr.splice(di.current,1);arr.splice(oi.current,0,m);setItems(arr.map((x,i)=>({...x,seq_no:i+1,sort_order:i+1})));di.current=null;oi.current=null;};
  const over=(e,i)=>{e.preventDefault();if(!ce||di.current===null)return;oi.current=i;document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(i!==di.current)e.currentTarget.classList.add(i>di.current?"drag-bw":"drag-ov");};
  const leave=e=>e.currentTarget.classList.remove("drag-ov","drag-bw");
  return{start,end,over,leave};
}
/* ── Lightbox ── */
function Lightbox({photos,si=0,onClose}){
  const[i,setI]=useState(si);
  useEffect(()=>{const fn=e=>{if(e.key==="ArrowLeft")setI(v=>Math.max(0,v-1));if(e.key==="ArrowRight")setI(v=>Math.min(photos.length-1,v+1));if(e.key==="Escape")onClose();};window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);},[]);
  if(!photos.length)return null;const c=photos[i];
  return(<div className="lb" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <button className="lb-close" onClick={onClose}>✕</button>
    <img src={c.data} alt={c.name}/>
    <div className="lb-info">{c.name} · {fSz(c.size)}</div>
    <div className="lb-bar">
      <button className="lb-btn" onClick={()=>setI(v=>Math.max(0,v-1))} disabled={i===0}>‹</button>
      <span style={{fontSize:12,color:"var(--t3)"}}>{i+1}/{photos.length}</span>

function Attachments({files=[],onChange,canEdit=true,label="사진/문서"}){
  const[drag,setDrag]=useState(false);const[lb,setLb]=useState(null);const[tab,setTab]=useState("all");const ref=useRef();
  const isImg=f=>["jpg","jpeg","png","gif","webp"].includes(f.name?.split(".").pop()?.toLowerCase());
  const add=async raw=>{const a=Array.from(raw);if(!a.length)return;const d=await Promise.all(a.map(attFile));onChange([...files,...d]);};
  const rm=(i,e)=>{e.stopPropagation();onChange(files.filter((_,j)=>j!==i));};
  const imgs=files.map((f,i)=>({f,i})).filter(({f})=>isImg(f));
  const docs=files.map((f,i)=>({f,i})).filter(({f})=>!isImg(f));
  return(<div>
    <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5}}>

      onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}

      <div style={{fontSize:17,marginBottom:2}}>📎</div>
      <div style={{fontSize:12,fontWeight:600}}>클릭 또는 드래그</div>
      <div style={{fontSize:12,color:"var(--t3)"}}>사진(자동압축600px) · PDF · Word · Excel · HWP</div>
      <input ref={ref} type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.hwp,.txt,.zip" multiple style={{display:"none"}} onChange={e=>add(e.target.files)}/>
    </div>}
    {files.length>0&&<React.Fragment>
      <div className="atabs" style={{marginTop:7}}>
        {[["all","전체"],["img","사진🖼"],["doc","문서📄"]].map(([k,l])=>
          <div key={k} className={`atab ${tab===k?"act":""}`} onClick={()=>setTab(k)}>{l}</div>)}
      </div>
      {(tab==="all"||tab==="img")&&imgs.length>0&&<div className="pgrid">
        {imgs.map(({f,i})=><div key={i} className="pt" onClick={()=>setLb(imgs.findIndex(x=>x.i===i))}>
          <img src={f.data} alt={f.name}/><div className="plbl">{f.name}</div>
          {canEdit&&<button className="pdel" onClick={e=>rm(i,e)}>✕</button>}
        </div>)}
      </div>}
      {(tab==="all"||tab==="doc")&&docs.length>0&&<div className="doc-grid" style={{marginTop:tab==="all"&&imgs.length?7:0}}>
        {docs.map(({f,i})=><div key={i} className="doc-card">
          <div style={{fontSize:20,marginBottom:2}}>{gIcon(f.name)}</div>
          <div style={{fontSize:12,color:"var(--t2)",wordBreak:"break-all",lineHeight:1.3}}>{f.name}</div>
          <div style={{fontSize:12,color:"var(--t3)",marginTop:2}}>{fSz(f.size)}</div>
          <div style={{display:"flex",gap:3,marginTop:4,justifyContent:"center"}}>
            <a style={{fontSize:12,padding:"1px 5px",borderRadius:3,border:"1px solid var(--bdr)",background:"var(--bg4)",color:"var(--t2)",textDecoration:"none"}} href={f.data} download={f.name}>⬇</a>
            {canEdit&&<button style={{fontSize:12,padding:"1px 5px",borderRadius:3,border:"1px solid rgba(255,61,61,.3)",background:"rgba(255,61,61,.08)",color:"var(--red)",cursor:"pointer"}} onClick={e=>rm(i,e)}>✕</button>}
          </div>
        </div>)}
      </div>}
    </React.Fragment>}
    {lb!==null&&<Lightbox photos={imgs.map(({f})=>f)} si={lb} onClose={()=>setLb(null)}/>}
  </div>);
}
function PhBadge({item,fields,onClick}){

  const[form,setForm]=useState(mkE());
  const sf=p=>setForm(v=>({...v,...p}));

    const q=srch.toLowerCase();
    return(!srch||[n.internal_ncr_no,n.nci_description,n.caused_by,n.part_name,n.rca].some(v=>v?.toLowerCase().includes(q)))
      &&(!fT||n.type===fT)&&(!fP||n.part_name===fP)&&(!fC||n.caused_by===fC);
  }),[data,srch,fT,fP,fC]);

    if(!form.issued_date||!form.nci_description){toast("발행일과 부적합 내용은 필수입니다.","error");return;}
    const w=isoW(form.issued_date);
    const ncr=form.internal_ncr_no||"NCI-"+form.issued_date.replace(/-/g,"").slice(2,8)+"-"+String(form.seq_no||1).padStart(2,"0");
    const item={...form,week_no:w,year,internal_ncr_no:ncr,due_date:add90(form.issued_date)};
    // ── Supabase 저장 ──
    const sb=getSB();
    if(sb){
      // SQL nci_list 컬럼과 완전 일치
      const row={
        issued_date:      item.issued_date,
        internal_ncr_no:  item.internal_ncr_no||null,
        owner_ncr_no:     item.owner_ncr_no||null,
        part_name:        item.part_name||null,
        part_no:          item.part_no||null,
        item_category:    item.item_category||"fab",
        nci_description:  item.nci_description||null,
        rca:              item.rca||null,
        corrective_action:item.corrective_action||null,
        car_no:           item.car_no||null,
        qty:              Number(item.qty)||1,
        type:             item.type||null,
        caused_by:        item.caused_by||null,
        disposition:      item.disposition||"Return",
        effectiveness_date:  item.effectiveness_date||null,
        effectiveness_result:item.effectiveness_result||null,

        doc_urls:         item.doc_urls||[]
      };

        const{error}=await sb.from("nci_list").update(row).eq("id",edit.id);

      }else{
        const{data,error}=await sb.from("nci_list").insert(row).select("id").single();

      }

  };

            <Attachments files={form.doc_urls||[]} onChange={v=>sf({doc_urls:v})} canEdit={ce} label="이행확인 사진/문서"/>

          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
          <button className="btn btn-p" onClick={save}>저장</button>

    {detail&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>

          <div style={{display:"flex",gap:5}}>{ce&&<button className="btn btn-s btn-sm" onClick={()=>{setDetail(null);openEdit(detail);}}>✎</button>}<button className="xb" onClick={()=>setDetail(null)}>✕</button></div>
        </div>
        <div className="mbd">
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:11}}>
            {[["Issued Date",fmtD(detail.issued_date)],["W",detail.week_no+"W"],["구분",detail.item_category==="cut"?"절단품":detail.item_category==="fab"?"제관품":"—"],["Part Name",detail.part_name],["Part No.",detail.part_no],
              ["Type",detail.type],["Caused By",detail.caused_by],["QTY",detail.qty+"대"],["Disposition",detail.disposition],
              ["Effect.Date",fmtD(detail.effectiveness_date)],["Results",detail.effectiveness_result||"미확인"],
              ["CAR No",detail.car_no||"-"],["+90일 Due",detail.due_date||add90(detail.issued_date)]].map(([k,v])=>(
              <div key={k}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:13}}>{v||"-"}</div></div>
            ))}
          </div>
          {[["NCI Description",detail.nci_description],["RCA (원인분석)",detail.rca],["Corrective Action (개선대책)",detail.corrective_action],["비고",detail.remark]].map(([k,v])=>v&&(
            <div key={k} style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)",whiteSpace:"pre-wrap"}}>{v}</div></div>
          ))}
          {((detail.photo_urls?.length||0)+(detail.doc_urls?.length||0))>0&&<div className="psec"><div className="psec-lbl">📎 첨부 파일</div>
            {(detail.photo_urls?.length||0)>0&&<Attachments files={detail.photo_urls} onChange={()=>{}} canEdit={false} label="부적합 사진/문서"/>}
            {(detail.doc_urls?.length||0)>0&&<div style={{marginTop:7}}><Attachments files={detail.doc_urls} onChange={()=>{}} canEdit={false} label="이행확인 사진/문서"/></div>}
          </div>}
        </div>
      </div>
    </div>}
  </div>);
}

/* ── Claim Page ── */
function ClaimPage({data,setData,role,toast,year,currency,setCurrency,rates,setRates}){
  const[srch,setSrch]=useState("");const[showM,setShowM]=useState(false);const[edit,setEdit]=useState(null);const[detail,setDetail]=useState(null);
  const ce=role==="admin"||role==="manager";
  const drag=useDrag(data,setData,ce);
  const CURR=[{c:"KRW",s:"₩",r:1},{c:"USD",s:"$",r:rates?.USD||1480},{c:"EUR",s:"€",r:rates?.EUR||1620},{c:"JPY",s:"¥",r:rates?.JPY||9.8}];
  const ci=CURR.find(x=>x.c===currency)||CURR[0];
  const cvt=n=>n==null?"-":currency==="KRW"?fmt(n)+(currency==="KRW"?" 원":""):ci.s+(n/ci.r).toFixed(2);
  const parts=[...new Set(data.map(n=>n.part_name).filter(Boolean))];
  const causeds=[...new Set(data.map(n=>n.caused_by).filter(Boolean))];
  const mkE=()=>({year,seq_no:data.length+1,internal_ncr_no:"",owner_ncr_no:"",week_no:"",issued_date:"",part_name:"",part_no:"",nci_description:"",type:"",caused_by:"",disposition:"Return",claim_amount:0,final_agreed:0,tc_tech_ratio:0,partner_ratio:0,doc_no:"",remark:"",photo_urls:[],doc_urls:[]});
  const[form,setForm]=useState(mkE());const sf=p=>setForm(v=>({...v,...p}));
  // 수식 자동계산 (엑셀과 동일)
  const tcCalc=Math.round((form.final_agreed||0)*(form.tc_tech_ratio||0)/100);
  const partnerCalc=Math.round((form.final_agreed||0)*(form.partner_ratio||0)/100);
  const filtered=useMemo(()=>data.filter(n=>!srch||JSON.stringify(n).toLowerCase().includes(srch.toLowerCase())),[data,srch]);
  const totClaim=data.reduce((s,c)=>s+(c.claim_amount||0),0);
  const totFinal=data.reduce((s,c)=>s+(c.final_agreed||0),0);
  const totTC=data.reduce((s,c)=>s+Math.round((c.final_agreed||0)*(c.tc_tech_ratio||0)/100),0);
  const openAdd=()=>{setEdit(null);setForm(mkE());setShowM(true);};
  const openEdit=n=>{setEdit(n);setForm({...n,photo_urls:[...(n.photo_urls||[])],doc_urls:[...(n.doc_urls||[])]});setShowM(true);};
  const save=async()=>{
    if(!form.issued_date){toast("발행일을 입력하세요.","error");return;}
    const item={...form,week_no:isoW(form.issued_date),year,
      claim_amount:Number(form.claim_amount),final_agreed:Number(form.final_agreed),
      tc_burden:Math.round(Number(form.final_agreed)*Number(form.tc_tech_ratio)/100),
      partner_share:Math.round(Number(form.final_agreed)*Number(form.partner_ratio)/100)};
    // ── Supabase 저장 ──
    const sb=getSB();
    if(sb){
      // SQL claim_list 컬럼과 완전 일치 (tc_burden, partner_share는 GENERATED → 제외)
      const row={
        issued_date:     item.issued_date,
        internal_ncr_no: item.internal_ncr_no||null,
        owner_ncr_no:    item.owner_ncr_no||null,
        part_name:       item.part_name||null,
        part_no:         item.part_no||null,
        nci_description: item.nci_description||null,
        type:            item.type||null,
        caused_by:       item.caused_by||null,
        disposition:     item.disposition||"Return",
        claim_amount:    Number(item.claim_amount)||0,
        final_agreed:    Number(item.final_agreed)||0,
        tc_tech_ratio:   Number(item.tc_tech_ratio)||0,
        partner_ratio:   Number(item.partner_ratio)||0,
        doc_no:          item.doc_no||null,
        remark:          item.remark||null,
        sort_order:      Number(item.sort_order||item.seq_no||1),
        photo_urls:      item.photo_urls||[],
        doc_urls:        item.doc_urls||[]
      };
      if(edit&&edit.id&&!String(edit.id).startsWith("tmp_")){
        const{error}=await sb.from("claim_list").update(row).eq("id",edit.id);
        if(error){toast("저장 오류: "+error.message,"error");return;}
      }else{
        const{data,error}=await sb.from("claim_list").insert(row).select("id").single();
        if(error){toast("저장 오류: "+error.message,"error");return;}
        if(data)item.id=data.id;
      }
    }
    if(edit)setData(p=>p.map(n=>n.id===edit.id?{...n,...item}:n));
    else setData(p=>[...p,{...item,id:item.id||"tmp_"+Date.now()}]);
    toast(edit?"수정 완료":"등록 완료","success");setShowM(false);
  };
  const del=async id=>{if(!confirm("삭제하시겠습니까?"))return;
    const sb=getSB();
    if(sb&&!String(id).startsWith("tmp_")){
      const{error}=await sb.from("claim_list").delete().eq("id",id);
      if(error){toast("삭제 오류: "+error.message,"error");return;}
    }
    setData(p=>p.filter(n=>n.id!==id));toast("삭제 완료","info");
  };
  const xlDown=()=>{
    const ws=XLSX.utils.json_to_sheet(filtered.map(c=>({"No.":c.seq_no,"Internal NCR No.":c.internal_ncr_no,"Owner NCR No.":c.owner_ncr_no,"W":c.week_no,"Issued Date":c.issued_date,"Part Name(모델)":c.part_name,"Part No.":c.part_no,"NCI Description":c.nci_description,"Type":c.type,"Caused By":c.caused_by,"Disposition":c.disposition,"청구금액":c.claim_amount,"최종 합의금":c.final_agreed,"협력사 합의금":Math.round((c.final_agreed||0)*(c.partner_ratio||0)/100),"TC 부담금":Math.round((c.final_agreed||0)*(c.tc_tech_ratio||0)/100),"TC Tech 귀책율(%)":c.tc_tech_ratio,"협력사 귀책율(%)":c.partner_ratio,"품의서 번호":c.doc_no,"비고":c.remark})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Claims");XLSX.writeFile(wb,`Filed_Claim_List_${year}_${new Date().toISOString().slice(0,10)}.xlsx`);toast("다운로드 완료","success");
  };
  return(<div>
    {/* 화폐 단위 바 */}
    <div style={{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",background:"var(--bg2)",border:"1px solid var(--bdr)",borderRadius:"var(--r)",marginBottom:11,flexWrap:"wrap"}}>
      <span style={{fontSize:12,color:"var(--t3)"}}>💱 화폐단위</span>
      {CURR.map(c=><button key={c.c} className={`btn btn-sm ${currency===c.c?"btn-p":"btn-s"}`} onClick={()=>setCurrency(c.c)}>{c.s} {c.c}</button>)}
      {currency!=="KRW"&&<div style={{display:"flex",alignItems:"center",gap:5,marginLeft:"auto"}}>
        <span style={{fontSize:12,color:"var(--t3)"}}>1{ci.s}=</span>
        <input type="number" value={rates?.[currency]||ci.r} style={{width:75,padding:"2px 6px",fontSize:13}} onChange={e=>setRates(r=>({...r,[currency]:Number(e.target.value)}))}/>
        <span style={{fontSize:12,color:"var(--t3)"}}>₩</span>
      </div>}
    </div>
    <div className="stats" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
      <div className="sc cr"><div className="sc-lbl">▸ 총 청구금액(Claim)</div><div className="sc-val" style={{color:"var(--red)",fontSize:13}}>{ci.s}{currency==="KRW"?fmt(totClaim):(totClaim/ci.r).toFixed(0)}</div></div>
      <div className="sc ca"><div className="sc-lbl">▸ 최종 합의금</div><div className="sc-val" style={{color:"var(--amber)",fontSize:13}}>{ci.s}{currency==="KRW"?fmt(totFinal):(totFinal/ci.r).toFixed(0)}</div></div>
      <div className="sc cg"><div className="sc-lbl">▸ TC 부담금 <span className="kpi-a">자동계산</span></div><div className="sc-val" style={{color:"var(--green)",fontSize:13}}>{ci.s}{currency==="KRW"?fmt(totTC):(totTC/ci.r).toFixed(0)}</div></div>
      <div className="sc cb"><div className="sc-lbl">▸ 클레임 건수</div><div className="sc-val">{data.length}</div></div>
    </div>
    <div className="fbar">
      <input style={{flex:1,maxWidth:270}} placeholder="🔍 NCR번호·모델·귀책처 검색" value={srch} onChange={e=>setSrch(e.target.value)}/>
      <span className="hint" style={{marginLeft:"auto"}}>⠿ 드래그 순서변경</span>
      {ce&&<button className="btn btn-p" onClick={openAdd}>+ 클레임 등록</button>}
      <button className="btn btn-s" onClick={xlDown}>⬇ 엑셀</button>
    </div>
    <div className="card">
      <div className="card-hd"><span className="card-title">Filed Claim List ({year}년)</span>
        <span style={{fontSize:12,color:"var(--t3)"}}>TC부담금·협력사합의금 = 최종합의금 × 귀책율 <span className="kpi-a">DB자동계산</span></span>

          <th>TC Tech(%)</th><th>TC 부담금<span className="kpi-a" style={{marginLeft:2}}>자동</span></th>

            <td className="mono" style={{color:"var(--red)"}}>{currency==="KRW"?fmt(c.claim_amount):ci.s+(c.claim_amount/ci.r).toFixed(0)}</td>
            <td className="mono">{currency==="KRW"?fmt(c.final_agreed):ci.s+(c.final_agreed/ci.r).toFixed(0)}</td>

            <td className="mono">{currency==="KRW"?fmt(paS):ci.s+(paS/ci.r).toFixed(0)}</td>
            <td style={{fontSize:12,color:"var(--t3)"}}>{c.doc_no}</td>
            <td><PhBadge item={c} fields={["photo_urls","doc_urls"]} onClick={()=>setDetail(c)}/></td>

          </tr>);})}
        </tbody>
      </table></div>
    </div>
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>

            <div className="fg"><label>W (주차) <span className="tag-a">자동</span></label><input readOnly value={form.week_no?form.week_no+"W":"—"}/></div>
            <div className="fg"><label>Part Name(모델) — 선택 가능</label>
              <select value={form.part_name||""} onChange={e=>sf({part_name:e.target.value})}>

            <div className="fg"><label>TC 부담금 <span className="kpi-a">자동계산</span></label><input data-auto readOnly value={fmt(tcCalc)+" 원"}/></div>
            <div className="fg"><label>협력사 합의금 <span className="kpi-a">자동계산</span></label><input data-auto readOnly value={fmt(partnerCalc)+" 원"}/></div>
            <div className="fg"><label>품의서 번호</label><input value={form.doc_no||""} onChange={e=>sf({doc_no:e.target.value})}/></div>
            <div className="fg full"><label>비고</label><textarea value={form.remark||""} onChange={e=>sf({remark:e.target.value})}/></div>
          </div>
          <div className="psec"><div className="psec-lbl">📎 NCI Photos / 클레임 증빙</div>
            <Attachments files={form.photo_urls||[]} onChange={v=>sf({photo_urls:v})} canEdit={ce} label="사진/문서"/>
          </div>
        </div>
        <div className="mft">
          <span style={{fontSize:12,color:"var(--t3)",marginRight:"auto"}}>TC부담금: {fmt(tcCalc)}원 | 협력사: {fmt(partnerCalc)}원 <span className="kpi-a">자동계산</span></span>
          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
          <button className="btn btn-p" onClick={save}>저장</button>
        </div>
      </div>
    </div>}
    {detail&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setDetail(null)}>
      <div className="modal" style={{maxWidth:860}}>
        <div className="mhd"><span className="mono" style={{color:"#60a5fa",fontWeight:700}}>{detail.internal_ncr_no}</span>
          <div style={{display:"flex",gap:5}}>{ce&&<button className="btn btn-s btn-sm" onClick={()=>{setDetail(null);openEdit(detail);}}>✎</button>}<button className="xb" onClick={()=>setDetail(null)}>✕</button></div>
        </div>
        <div className="mbd">
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:10}}>
            {[["발행일",fmtD(detail.issued_date)],["주차",detail.week_no+"W"],["모델",detail.part_name],["귀책처",detail.caused_by],
              ["청구금액",fmt(detail.claim_amount)+"원"],["최종합의금",fmt(detail.final_agreed)+"원"],
              ["TC 부담금",fmt(Math.round((detail.final_agreed||0)*(detail.tc_tech_ratio||0)/100))+"원 (자동)"],["TC귀책율",detail.tc_tech_ratio+"%"],
              ["협력사합의금",fmt(Math.round((detail.final_agreed||0)*(detail.partner_ratio||0)/100))+"원 (자동)"],["협력사귀책율",detail.partner_ratio+"%"],
              ["품의서번호",detail.doc_no||"-"],["Disposition",detail.disposition]].map(([k,v])=>(
              <div key={k}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>{k}</div><div style={{fontSize:13}}>{v||"-"}</div></div>
            ))}
          </div>
          {detail.nci_description&&<div style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>NCI Description</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)"}}>{detail.nci_description}</div></div>}
          {detail.remark&&<div style={{marginBottom:7}}><div style={{fontSize:12,color:"var(--t3)",marginBottom:2}}>비고</div><div style={{fontSize:12,background:"var(--bg3)",padding:"7px",borderRadius:4,border:"1px solid var(--bdr)",whiteSpace:"pre-wrap"}}>{detail.remark}</div></div>}
          {((detail.photo_urls?.length||0)+(detail.doc_urls?.length||0))>0&&<div className="psec"><div className="psec-lbl">📎 첨부</div><Attachments files={[...(detail.photo_urls||[]),...(detail.doc_urls||[])]} onChange={()=>{}} canEdit={false} label="첨부 파일"/></div>}
        </div>
      </div>
    </div>}
  </div>);
}

/* ── KPI Page ── */
function KPIPage({nci,claim,erp,target,setTarget,role,year,yearDB}){
  const r1=useRef(),r2=useRef(),r3=useRef(),r4=useRef(),r5=useRef();
  const c1=useRef(),c2=useRef(),c3=useRef(),c4=useRef(),c5=useRef();
  const ce=role==="admin"||role==="manager";
  const[eTgt,setETgt]=useState(false);
  const[tF,setTF]=useState({...target});
  const[view,setView]=useState("monthly");
  const[kpiMon,setKpiMon]=useState(new Date().getMonth()+1);

  /* ── 월별 집계 ── */
  const nciM=Array(12).fill(0),nciQM=Array(12).fill(0);
  const cutNciM=Array(12).fill(0),cutQtyM=Array(12).fill(0);
  const fabNciM=Array(12).fill(0),fabQtyM=Array(12).fill(0);
  nci.forEach(n=>{
    const m=getMo(n.issued_date);if(!m)return;
    nciM[m-1]++;nciQM[m-1]+=(n.qty||0);
    if(n.item_category==="cut"){cutNciM[m-1]++;cutQtyM[m-1]+=(n.qty||0);}
    else{fabNciM[m-1]++;fabQtyM[m-1]+=(n.qty||0);}
  });
  const claimM=Array(12).fill(0);
  claim.forEach(cl=>{const m=getMo(cl.issued_date);if(m)claimM[m-1]+=(cl.claim_amount||0);});
  const cutShipM=Array(12).fill(0),fabShipM=Array(12).fill(0),revM=Array(12).fill(0);
  (erp||[]).forEach(e=>{
    const m=e.month||(e.invoice_date?getMo(e.invoice_date):null);if(!m)return;
    if(e.is_cut_parts)cutShipM[m-1]+=(e.qty||0);
    else if(e.is_fabrication)fabShipM[m-1]+=(e.qty||0);
    revM[m-1]+=(e.total_amount_krw||0);
  });
  /* ── 주차별 집계 ── */
  const cutNciW={},cutQtyW={},fabNciW={},fabQtyW={},cutShipW={},fabShipW={};
  nci.forEach(n=>{
    const w=n.week_no||isoW(n.issued_date);if(!w)return;
    if(n.item_category==="cut"){cutNciW[w]=(cutNciW[w]||0)+1;cutQtyW[w]=(cutQtyW[w]||0)+(n.qty||0);}
    else{fabNciW[w]=(fabNciW[w]||0)+1;fabQtyW[w]=(fabQtyW[w]||0)+(n.qty||0);}
  });
  (erp||[]).forEach(e=>{
    const w=e.week_no;if(!w)return;
    if(e.is_cut_parts)cutShipW[w]=(cutShipW[w]||0)+(e.qty||0);
    else if(e.is_fabrication)fabShipW[w]=(fabShipW[w]||0)+(e.qty||0);
  });
  /* ── 누계 ── */
  const tNci=nci.length,tQty=nci.reduce((s,n)=>s+(n.qty||0),0);
  const tCutNci=nci.filter(n=>n.item_category==="cut").length;
  const tCutQty=nci.filter(n=>n.item_category==="cut").reduce((s,n)=>s+(n.qty||0),0);
  const tFabNci=nci.filter(n=>n.item_category!=="cut").length;
  const tFabQty=nci.filter(n=>n.item_category!=="cut").reduce((s,n)=>s+(n.qty||0),0);
  const tCutShip=cutShipM.reduce((a,b)=>a+b,0);
  const tFabShip=fabShipM.reduce((a,b)=>a+b,0);
  const tRev=revM.reduce((a,b)=>a+b,0);
  const tClaim=claim.reduce((s,c)=>s+(c.claim_amount||0),0);
  const cutPPM=cutShipM.map((s,i)=>s>0?Math.round(cutQtyM[i]/s*1e6):null);
  const fabPPM=fabShipM.map((s,i)=>s>0?Math.round(fabQtyM[i]/s*1e6):null);
  const lossM=revM.map((r,i)=>r>0?(claimM[i]/r*100).toFixed(2):null);
  /* ── 선택 월 주차 목록 ── */
  const wksInMon=useMemo(()=>{
    const ws=new Set();
    nci.forEach(n=>{if(getMo(n.issued_date)===kpiMon){const w=n.week_no||isoW(n.issued_date);if(w)ws.add(w);}});
    (erp||[]).forEach(e=>{if(e.month===kpiMon&&e.week_no)ws.add(e.week_no);});
    const arr=[...ws].sort((a,b)=>a-b);
    if(!arr.length){const d=new Date(year,kpiMon-1,1);const w=isoW(d.toISOString().slice(0,10));[0,1,2,3].forEach(i=>arr.push(w+i));}
    return arr.slice(0,6);
  },[nci,erp,kpiMon,year]);
  /* ── 분석 집계 ── */
  const byModel={},byType={},byCaused={},byDisp={};
  nci.forEach(n=>{
    byModel[n.part_name]=(byModel[n.part_name]||0)+1;
    byType[n.type]=(byType[n.type]||0)+1;
    byCaused[n.caused_by]=(byCaused[n.caused_by]||0)+1;
    byDisp[n.disposition]=(byDisp[n.disposition]||0)+1;
  });
  const saveTgt=async()=>{
    setTarget({...tF});
    setETgt(false);
    const sb=getSB();
    if(sb){
      const row={year,
        cut_nci_target:tF.cut_nci_target,cut_qty_target:tF.cut_qty_target,
        cut_ppm_target:tF.cut_ppm_target,fab_nci_target:tF.fab_nci_target,
        fab_qty_target:tF.fab_qty_target,fab_ppm_target:tF.fab_ppm_target,
        total_nci_target:tF.total_nci_target,total_qty_target:tF.total_qty_target,
        claim_target:tF.claim_target
      };
      const{error}=await sb.from("kpi_targets").upsert(row,{onConflict:"year"});
      if(error)toast("KPI목표 저장오류: "+error.message,"error");
      else toast("KPI 목표 저장 완료","success");
    }
  };
  /* ── 차트 ── */
  useEffect(()=>{
    const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#7fb3d3",font:{size:10}}}},scales:{x:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}},y:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}}}};
    if(r1.current){c1.current?.destroy();c1.current=new Chart(r1.current,{type:"bar",data:{labels:MO,datasets:[{label:"NCI건수",data:nciM,backgroundColor:"rgba(0,212,255,.55)",borderColor:"var(--cyan)",borderWidth:1},{label:"목표",data:Array(12).fill(Math.round((target.total_nci_target||30)/12)),type:"line",borderColor:"var(--red)",borderWidth:2,pointRadius:0,fill:false}]},options:base});}
    if(r2.current){c2.current?.destroy();c2.current=new Chart(r2.current,{type:"line",data:{labels:MO,datasets:[{label:"절단PPM",data:cutPPM,borderColor:"var(--blue)",tension:.4,fill:false},{label:"제관PPM",data:fabPPM,borderColor:"var(--amber)",tension:.4,fill:false}]},options:base});}
    if(r3.current){c3.current?.destroy();c3.current=new Chart(r3.current,{type:"bar",data:{labels:MO,datasets:[{label:"클레임",data:claimM,backgroundColor:"rgba(255,61,61,.5)",borderColor:"var(--red)",borderWidth:1}]},options:base});}
    if(r4.current&&Object.keys(byType).length){c4.current?.destroy();c4.current=new Chart(r4.current,{type:"doughnut",data:{labels:Object.keys(byType),datasets:[{data:Object.values(byType),backgroundColor:["#1a6ef5","#ffab00","#00e676","#8b5cf6","#ff3d3d","#00d4ff"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:"#7fb3d3",font:{size:10}},position:"right"}}}});}
    if(r5.current){c5.current?.destroy();c5.current=new Chart(r5.current,{type:"bar",data:{labels:MO,datasets:[{label:"절단 출하",data:cutShipM,backgroundColor:"rgba(26,110,245,.5)",borderColor:"var(--blue)",borderWidth:1},{label:"제관 출하",data:fabShipM,backgroundColor:"rgba(255,171,0,.5)",borderColor:"var(--amber)",borderWidth:1}]},options:base});}
    return()=>{[c1,c2,c3,c4,c5].forEach(c=>c.current?.destroy());};
  },[nci,claim,erp,target]);

  const analData=view==="model"?byModel:view==="type"?byType:view==="caused"?byCaused:view==="disposition"?byDisp:null;
  const ppm=(qty,ship)=>ship>0?Math.round(qty/ship*1e6):null;
  const ppmStr=(qty,ship)=>ship>0?String(Math.round(qty/ship*1e6)):"#DIV/0!";
  const monVal=(arr,idx)=>arr[idx]||0;

  return(<div>
    {/* 목표값 */}
    {ce&&<div className="card mb4"><div className="card-hd"><span className="card-title">🎯 KPI 목표값 ({year}년)</span>
      <div style={{display:"flex",gap:4}}>{eTgt?<React.Fragment><button className="btn btn-p btn-sm" onClick={saveTgt}>저장</button><button className="btn btn-s btn-sm" onClick={()=>setETgt(false)}>취소</button></React.Fragment>:<button className="btn btn-s btn-sm" onClick={()=>{setTF({...target});setETgt(true);}}>✎ 수정</button>}</div>
    </div>
    {eTgt?<div className="card-bd"><div className="fgg">
      {[["cut_nci_target","절단품 NCI건수","건"],["cut_qty_target","절단품 불량수","대"],["cut_ppm_target","절단품 PPM","PPM"],
        ["fab_nci_target","제관품 NCI건수","건"],["fab_qty_target","제관품 불량수","대"],["fab_ppm_target","제관품 PPM","PPM"],
        ["total_nci_target","합계 NCI건수","건"],["total_qty_target","합계 불량수","대"],["claim_target","클레임금액","KRW"]].map(([k,l,u])=>(
        <div key={k} className="fg"><label>{l}({u})</label><input type="number" value={tF[k]||0} onChange={e=>setTF(p=>({...p,[k]:Number(e.target.value)}))}/></div>
      ))}</div></div>
    :<div className="card-bd"><div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
      {[["절단PPM",target.cut_ppm_target,"PPM"],["제관PPM",target.fab_ppm_target,"PPM"],["총NCI",target.total_nci_target,"건"],["총불량",target.total_qty_target,"대"],["클레임",fmt(target.claim_target),"원"]].map(([l,v,u])=>(
        <div key={l} style={{textAlign:"center"}}><div style={{fontSize:11,color:"var(--t3)",marginBottom:2}}>{l}</div><div className="mono" style={{fontWeight:700,fontSize:13,color:"var(--cyan)"}}>{v}<span style={{fontSize:9,color:"var(--t3)",marginLeft:1}}>{u}</span></div></div>
      ))}</div></div>}
    </div>}

    {/* KPI 현황표 — 엑셀 원본 완전 반영 */}
    <div className="card mb4">
      <div className="card-hd">
        <span className="card-title">📋 Quality KPI ({year}년)</span>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span className="kpi-a">NCI자동</span><span className="kpi-m">ERP연동</span>
          <select style={{fontSize:11,padding:"2px 7px",width:"auto"}} value={kpiMon} onChange={e=>setKpiMon(Number(e.target.value))}>
            {MO.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
          </select>
          <span style={{fontSize:11,color:"var(--t3)"}}>월 주차별 보기</span>
        </div>
      </div>
      <div className="tw"><table style={{fontSize:11}}>
        <thead><tr>
          <th style={{minWidth:55,textAlign:"center"}}>항목</th>
          <th style={{minWidth:100,textAlign:"center"}}>구분</th>
          <th style={{minWidth:45,textAlign:"right"}}>25년<br/>실적</th>
          <th style={{minWidth:45,textAlign:"right"}}>26년<br/>목표</th>
          <th style={{minWidth:50,textAlign:"right"}}>26년<br/>실적</th>
          {wksInMon.map(w=><th key={w} style={{minWidth:42,textAlign:"right"}}>{w}W</th>)}
          <th style={{minWidth:46,textAlign:"right",color:"var(--cyan)"}}>합계</th>
        </tr></thead>
        <tbody>
          {/* TEREX 절단품 */}
          <tr><td rowSpan={13} style={{textAlign:"center",fontWeight:700,background:"rgba(255,171,0,.07)",color:"var(--amber)",fontSize:11,borderRight:"1px solid var(--bdr)"}}>필드<br/>불량</td>
            <td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--cyan)"}}>출하수 <span className="kpi-m">ERP</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td style={{textAlign:"right"}}>-</td>
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700}}>{tCutShip||"-"}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right",color:"var(--cyan)"}}>{cutShipW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutShipM[kpiMon-1]||"-"}</td>
          </tr>
          <tr>
            <td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--t3)"}}>NCI건수 <span className="kpi-a">자동</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td className="mono" style={{textAlign:"right"}}>{target.cut_nci_target||10}</td>
            <td className="mono" style={{textAlign:"right",fontWeight:700,color:tCutNci<=(target.cut_nci_target||10)?"var(--green)":"var(--red)"}}>{tCutNci}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right"}}>{cutNciW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutNciM[kpiMon-1]||"-"}</td>
          </tr>
          <tr>
            <td style={{background:"rgba(26,110,245,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--t3)"}}>불량수 <span className="kpi-a">자동</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td className="mono" style={{textAlign:"right"}}>{target.cut_qty_target||20}</td>
            <td className="mono" style={{textAlign:"right",fontWeight:700,color:tCutQty<=(target.cut_qty_target||20)?"var(--green)":"var(--red)"}}>{tCutQty}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right"}}>{cutQtyW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{cutQtyM[kpiMon-1]||"-"}</td>
          </tr>
          <tr>
            <td style={{background:"rgba(255,61,61,.06)"}}><div style={{fontSize:10,fontWeight:700,color:"var(--red)"}}>TEREX(절단품)</div><div style={{fontSize:9,color:"var(--red)"}}>불량율(PPM) <span className="kpi-a">자동</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>133</td><td className="mono" style={{textAlign:"right",color:"var(--amber)"}}>{target.cut_ppm_target||100}</td>
            <td className="mono" style={{textAlign:"right",fontWeight:700,color:ppm(tCutQty,tCutShip)!=null&&ppm(tCutQty,tCutShip)<=(target.cut_ppm_target||100)?"var(--green)":"var(--red)"}}>{ppmStr(tCutQty,tCutShip)}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right",color:"var(--red)"}}>{ppmStr(cutQtyW[w]||0,cutShipW[w]||0)}</td>)}
            <td className="mono" style={{textAlign:"right",fontWeight:700,background:"rgba(0,212,255,.05)",color:"var(--red)"}}>{ppmStr(cutQtyM[kpiMon-1],cutShipM[kpiMon-1])}</td>
          </tr>
          {/* TEREX 제관품 */}
          <tr>
            <td style={{background:"rgba(0,230,118,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(제관품)</div><div style={{fontSize:9,color:"var(--cyan)"}}>출하수 <span className="kpi-m">ERP</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td style={{textAlign:"right"}}>-</td>
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700}}>{tFabShip||"-"}</td>
            {wksInMon.map(w=><td key={w} className="mono" style={{textAlign:"right",color:"var(--cyan)"}}>{fabShipW[w]||"-"}</td>)}
            <td className="mono" style={{textAlign:"right",color:"var(--cyan)",fontWeight:700,background:"rgba(0,212,255,.05)"}}>{fabShipM[kpiMon-1]||"-"}</td>
          </tr>
          <tr>
            <td style={{background:"rgba(0,230,118,.04)"}}><div style={{fontSize:10,fontWeight:600}}>TEREX(제관품)</div><div style={{fontSize:9,color:"var(--t3)"}}>NCI건수 <span className="kpi-a">자동</span></div></td>
            <td className="mono" style={{textAlign:"right",color:"var(--t3)"}}>-</td><td className="mono" style={{textAlign:"right"}}>{target.fab_nci_target||20}</td>

  const confirmUpload=()=>{
    if(!prev?.length)return;

    /* ── 핵심: 완전 교체 (이전 데이터 100% 제거) ── */
    setData([...prev]);   /* 새 배열로 교체 (React state 갱신 보장) */

    /* ── localStorage 백업 (재접속 후 복구용) ── */
    try{
      const yr=prev[0]?.year||year;
      localStorage.setItem('qms_erp_'+yr, JSON.stringify(prev));
      localStorage.setItem('qms_erp_year', String(yr));
    }catch(e){console.warn('ERP 백업 실패:',e);}

    /* ── Supabase 저장 (비동기, 오류 무시) ── */
    const sb=getSB();
    if(sb){
      (async()=>{
        try{
          await sb.from('erp_sales').delete().neq('id','00000000-0000-0000-0000-000000000000');
          const chunks=[];
          for(let i=0;i<prev.length;i+=100)chunks.push(prev.slice(i,i+100));
          for(const chunk of chunks){
            await sb.from('erp_sales').insert(chunk.map(e=>({
              year:e.year,week_no:e.week_no,month:e.month,
              invoice_no:e.invoice_no,customer_name:e.cust_name,
              item_code:e.item_code,item_name:e.item_name,
              item_group_name:e.item_group,item_spec:e.item_spec,
              qty:Number(e.qty),total_amount_krw:Number(e.total_amount_krw),
              is_cut_parts:!!e.is_cut_parts,is_fabrication:!!e.is_fabrication,
              upload_batch:new Date().toISOString().slice(0,10),
            })));
          }
        }catch(err){console.warn('ERP Supabase 저장:',err.message);}
      })();
    }

    const fabQ=prev.filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0);
    const cutQ=prev.filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0);
    const totKRW=prev.reduce((s,e)=>s+(e.total_amount_krw||0),0);
    const months=[...new Set(prev.map(e=>e.month).filter(Boolean))].sort((a,b)=>a-b);
    const weeks=[...new Set(prev.map(e=>e.week_no).filter(Boolean))].sort((a,b)=>a-b);
    setPrev(null);
    toast(
      `✅ 적용완료 (기존데이터 교체) | `+
      `${months.map(m=>m+'월').join('·')} ${weeks.length}주차 | `+
      `제관 ${fabQ.toLocaleString()} / 절단 ${cutQ.toLocaleString()} | `+
      `매출 ${Math.round(totKRW/1000000).toLocaleString()}백만원`,
      'success'
    );
  };


function ERPPage({data,setData,role,toast,year,fabItems}){
  const ce=role==="admin"||role==="manager";
  const fabCodes=React.useMemo(()=>new Set((fabItems||INIT_FAB_ITEMS).map(i=>String(i.code).trim())),[fabItems]);
  const[prev,setPrev]=useState(null);
  const[uploading,setUploading]=useState(false);

  /* ── parse: cellDates:true로 날짜 파싱 불일치 완전 해결 ── */
  const parse=file=>{
    setUploading(true);
    setPrev(null);
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});

        let hi=rows.findIndex(r=>Array.isArray(r)&&r.some(v=>String(v||"").trim()==="출하번호"));
        if(hi<0)hi=3;
        const hd=rows[hi];
        const col={};
        hd.forEach((h,i)=>{if(h!=null)col[String(h).trim()]=i;});
        const get=(r,name)=>col[name]!=null?r[col[name]]:null;

        /* 날짜 → YYYY-MM-DD (항상 동일한 결과 보장) */
        const toDateStr=v=>{
          if(!v)return null;
          let y,m,d;
          if(v instanceof Date){
            if(isNaN(v.getTime()))return null;
            y=v.getUTCFullYear();m=v.getUTCMonth()+1;d=v.getUTCDate();
          }else if(typeof v==="number"){
            const dt=new Date(Math.round((v-25569)*864e5));
            y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate();
          }else{
            const dt=new Date(String(v).trim());
            if(isNaN(dt.getTime()))return null;
            y=dt.getFullYear();m=dt.getMonth()+1;d=dt.getDate();
          }
          if(y<2000||y>2100)return null;
          return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
        };
        const isoWeek=ds=>{
          if(!ds)return null;
          try{
            const[y,m,d]=ds.split("-").map(Number);
            const dt=new Date(Date.UTC(y,m-1,d));
            dt.setUTCDate(dt.getUTCDate()+4-(dt.getUTCDay()||7));
            const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));
            return Math.ceil(((dt-y0)/864e5+1)/7);
          }catch{return null;}
        };

        const parsed=[];
        rows.slice(hi+1).forEach(r=>{
          if(!Array.isArray(r)||!r.some(v=>v!=null&&v!==""))return;
          const shipType=String(get(r,"출하형태명")||"").trim();
          const custName=String(get(r,"납품처명")||"").trim();
          /* 조건: AA열=해외적송품판매 AND Y열=지니(GENIE IND.) */
          if(shipType!=="해외적송품판매"||custName!=="지니(GENIE IND.)")return;
          const qty=Number(get(r,"출고수량")||0);
          if(qty<=0)return;
          const ds=toDateStr(get(r,"출고일"));
          const iCode=String(get(r,"품목")||"").trim();
          const isFab=fabCodes.has(iCode);
          const mo=ds?parseInt(ds.split("-")[1])||null:null;
          const yr=ds?parseInt(ds.split("-")[0])||year:year;
          parsed.push({
            year:yr,month:mo,week_no:isoWeek(ds),ship_date:ds,
            invoice_no:String(get(r,"출하번호")||""),
            item_code:iCode,item_name:String(get(r,"품목명")||""),
            item_group:String(get(r,"품목그룹명")||""),
            cust_name:custName,ship_type:shipType,qty,
            total_amount_krw:Number(get(r,"합계금액(자국)")||0),
            is_fabrication:isFab,is_cut_parts:!isFab,
          });
        });

        const fabQ=parsed.filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0);
        const cutQ=parsed.filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0);
        const totKRW=parsed.reduce((s,e)=>s+(e.total_amount_krw||0),0);
        const months=[...new Set(parsed.map(e=>e.month).filter(Boolean))].sort((a,b)=>a-b);
        const weeks=[...new Set(parsed.map(e=>e.week_no).filter(Boolean))].sort((a,b)=>a-b);
        setUploading(false);
        setPrev(parsed);
        toast(`파싱 ${parsed.length}건 | ${months.map(m=>m+"월").join("·")} ${weeks.length}주차 | 제관${fabQ} 절단${cutQ} | 매출${Math.round(totKRW/1e6)}백만원`,"success");
      }catch(err){setUploading(false);toast("파싱오류: "+err.message,"error");}
    };
    rd.readAsBinaryString(file);
  };

  /* ── confirmUpload: 완전 교체 + localStorage 저장 ── */
  const confirmUpload=()=>{
    if(!prev||!prev.length)return;
    const snap=[...prev];
    /* 1. React state 완전 교체 */
    setData(snap);
    /* 2. localStorage 저장 — 단일 키 사용 */
    const yr=snap[0]?.year||year;
    try{
      localStorage.setItem("qms_erp_"+yr,JSON.stringify(snap));
      localStorage.setItem("qms_erp_year",String(yr));
    }catch(e){}
    /* 3. Supabase 백그라운드 저장 */
    const sb=getSB();
    if(sb){(async()=>{
      try{
        await sb.from("erp_sales").delete().neq("id","00000000-0000-0000-0000-000000000000");
        for(let i=0;i<snap.length;i+=100){
          await sb.from("erp_sales").insert(snap.slice(i,i+100).map(e=>({
            year:e.year,week_no:e.week_no,month:e.month,
            invoice_no:e.invoice_no||null,customer_name:e.cust_name||null,
            item_code:e.item_code||null,item_name:e.item_name||null,
            item_group_name:e.item_group||null,qty:Number(e.qty)||0,
            total_amount_krw:Number(e.total_amount_krw)||0,
            is_cut_parts:!!e.is_cut_parts,is_fabrication:!!e.is_fabrication,
            upload_batch:new Date().toISOString().slice(0,10),
          })));
        }
      }catch(err){}
    })();}
    const fabQ=snap.filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0);
    const cutQ=snap.filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0);
    const totKRW=snap.reduce((s,e)=>s+(e.total_amount_krw||0),0);
    const months=[...new Set(snap.map(e=>e.month).filter(Boolean))].sort((a,b)=>a-b);
    const weeks=[...new Set(snap.map(e=>e.week_no).filter(Boolean))].sort((a,b)=>a-b);
    setPrev(null);
    toast(`✅ ${snap.length}건 적용 | ${months.map(m=>m+"월").join("·")} ${weeks.length}주차 | 제관${fabQ} 절단${cutQ} | 매출${Math.round(totKRW/1e6)}백만원`,"success");
  };

  const sum={
    total:(data||[]).reduce((s,e)=>s+e.qty,0),
    cut:(data||[]).filter(e=>e.is_cut_parts).reduce((s,e)=>s+e.qty,0),
    fab:(data||[]).filter(e=>e.is_fabrication).reduce((s,e)=>s+e.qty,0),
    rev:(data||[]).reduce((s,e)=>s+(e.total_amount_krw||0),0),
  };

  return(<div>
    <div className="stats" style={{gridTemplateColumns:"repeat(4,1fr)"}}>
      <div className="sc ct"><div className="sc-lbl">▸ 합계 출하수량</div><div className="sc-val">{fmt(sum.total)}</div><div className="sc-sub">지니(GENIE) L열</div></div>
      <div className="sc cb"><div className="sc-lbl">▸ 절단품 출하</div><div className="sc-val">{fmt(sum.cut)}</div><div className="sc-sub">품목마스터 미등록</div></div>
      <div className="sc ca"><div className="sc-lbl">▸ 제관품 출하</div><div className="sc-val">{fmt(sum.fab)}</div><div className="sc-sub">품목마스터 등록</div></div>
      <div className="sc cg"><div className="sc-lbl">▸ GENIE 매출액(KRW)</div><div className="sc-val" style={{fontSize:13}}>{fmt(sum.rev)}</div><div className="sc-sub">U열 합계금액(자국)</div></div>
    </div>
    <div className="g2 mb4">
      <div className="card"><div className="card-hd"><span className="card-title">📥 출고현황 파일 업로드</span></div><div className="card-bd">
        <div className="info-box blue" style={{marginBottom:10,fontSize:11}}>
          <b>집계 조건</b> (파일: 출고현황조회 및 명세서출력S)<br/>
          💰 매출: U열 | AA=해외적송품판매 AND Y=지니(GENIE IND.)<br/>
          📦 수량: L열 | 동일조건 | 제관=품목마스터등록 / 절단=나머지<br/>
          📅 주차/월: AI열(출고일) 자동계산
        </div>
        {ce&&<label className={`btn ${uploading?"btn-s":"btn-p"}`} style={{cursor:"pointer"}}>
          {uploading?"⏳ 파싱 중...":"📂 엑셀 업로드 (.xls/.xlsx)"}
          <input type="file" accept=".xlsx,.xls" style={{display:"none"}} disabled={uploading}
            onChange={e=>{if(e.target.files[0])parse(e.target.files[0]);e.target.value="";}}/>
        </label>}
      </div></div>
      <div className="card"><div className="card-hd">
        <span className="card-title">📋 현재 데이터</span>
        {(data||[]).length>0&&ce&&<button className="btn btn-d btn-sm" onClick={()=>{
          if(!confirm("ERP 데이터를 초기화하시겠습니까?"))return;
          setData([]);
          try{const yr=localStorage.getItem("qms_erp_year");if(yr)localStorage.removeItem("qms_erp_"+yr);localStorage.removeItem("qms_erp_year");}catch(e){}
          toast("ERP 초기화됨","info");
        }}>초기화</button>}
      </div><div className="card-bd">
        {(data||[]).length>0?(()=>{
          const months=[...new Set((data||[]).map(e=>e.month).filter(Boolean))].sort((a,b)=>a-b);
          const weeks=[...new Set((data||[]).map(e=>e.week_no).filter(Boolean))].sort((a,b)=>a-b);
          return<div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:8}}>
              {months.map(m=><span key={m} className="b bc">{m}월</span>)}
              <span style={{fontSize:11,color:"var(--t3)"}}>({weeks.length}주차)</span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              <div style={{padding:"7px 9px",background:"var(--bg3)",borderRadius:"var(--r)"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>총 품목수</div>
                <div className="mono" style={{fontWeight:700}}>{fmt((data||[]).length)}건</div>
              </div>
              <div style={{padding:"7px 9px",background:"var(--bg3)",borderRadius:"var(--r)"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>합계 출하</div>
                <div className="mono" style={{fontWeight:700}}>{fmt(sum.total)} EA</div>
              </div>
              <div style={{padding:"7px 9px",background:"rgba(26,110,245,.08)",borderRadius:"var(--r)"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>절단품</div>
                <div className="mono" style={{fontWeight:700,color:"var(--blue)"}}>{fmt(sum.cut)} EA</div>
              </div>
              <div style={{padding:"7px 9px",background:"rgba(255,171,0,.08)",borderRadius:"var(--r)"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>제관품</div>
                <div className="mono" style={{fontWeight:700,color:"var(--amber)"}}>{fmt(sum.fab)} EA</div>
              </div>
              <div style={{padding:"7px 9px",background:"rgba(0,212,255,.08)",borderRadius:"var(--r)",border:"1px solid rgba(0,212,255,.2)",gridColumn:"1/-1"}}>
                <div style={{fontSize:10,color:"var(--t3)"}}>GENIE 매출액 (U열 합계금액 합산)</div>
                <div className="mono" style={{fontWeight:700,fontSize:15,color:"var(--cyan)"}}>{fmt(sum.rev)} 원</div>
              </div>
            </div>
          </div>;
        })():<div style={{textAlign:"center",padding:20,fontSize:12,color:"var(--t3)"}}>
          ERP 데이터 없음 — 파일 업로드 시 KPI 즉시 반영
        </div>}
      </div></div>
    </div>
    {prev&&<div className="card mb4"><div className="card-hd">
      <span className="card-title">🔍 미리보기 ({prev.length}건) — 제관:{prev.filter(e=>e.is_fabrication).length} / 절단:{prev.filter(e=>e.is_cut_parts).length}</span>
      <div style={{display:"flex",gap:5}}>
        <button className="btn btn-g" onClick={confirmUpload}>✅ 확정 적용</button>
        <button className="btn btn-s" onClick={()=>setPrev(null)}>취소</button>
      </div>
    </div>
    <div className="tw"><table>
      <thead><tr><th>분류</th><th>출고일</th><th>주차</th><th>월</th><th>품목번호</th><th>품목명</th><th>수량(EA)</th><th>매출액(KRW)</th></tr></thead>
      <tbody>
        {prev.slice(0,30).map((e,i)=><tr key={i}>
          <td><span className={`b ${e.is_cut_parts?"bc":"bg"}`}>{e.is_cut_parts?"절단":"제관"}</span></td>
          <td className="mono" style={{fontSize:11}}>{e.ship_date||"-"}</td>
          <td className="mono">{e.week_no?"W"+e.week_no:"-"}</td>
          <td className="mono">{e.month?e.month+"월":"-"}</td>
          <td className="mono" style={{fontSize:11}}>{e.item_code}</td>
          <td style={{fontSize:11,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis"}}>{e.item_name}</td>
          <td className="mono">{fmt(e.qty)}</td>
          <td className="mono">{fmt(e.total_amount_krw)}</td>
        </tr>)}
        {prev.length>30&&<tr><td colSpan={8} style={{textAlign:"center",color:"var(--t3)",fontSize:11}}>... 외 {prev.length-30}건</td></tr>}
      </tbody>
    </table></div></div>}
    {(data||[]).length>0&&<div className="card"><div className="card-hd">
      <span className="card-title">📊 주차별 집계</span>
    </div><div className="tw"><table>
      <thead><tr>
        <th>주차</th><th>월</th><th>출고일</th>
        <th style={{color:"var(--blue)"}}>절단(EA)</th>
        <th style={{color:"var(--amber)"}}>제관(EA)</th>
        <th>합계(EA)</th>
        <th style={{color:"var(--cyan)"}}>매출액(KRW)</th>
      </tr></thead>
      <tbody>{(()=>{
        const bw={};
        (data||[]).forEach(e=>{
          const k=e.week_no||0;
          if(!bw[k])bw[k]={w:k,m:e.month,d1:e.ship_date,d2:e.ship_date,cQ:0,fQ:0,rev:0};
          else{if(e.ship_date<bw[k].d1)bw[k].d1=e.ship_date;if(e.ship_date>bw[k].d2)bw[k].d2=e.ship_date;}
          if(e.is_cut_parts)bw[k].cQ+=e.qty;else bw[k].fQ+=e.qty;
          bw[k].rev+=(e.total_amount_krw||0);
        });
        const tot={cQ:0,fQ:0,rev:0};
        const rs=Object.values(bw).sort((a,b)=>a.w-b.w).map(v=>{
          tot.cQ+=v.cQ;tot.fQ+=v.fQ;tot.rev+=v.rev;
          return<tr key={v.w}>
            <td className="mono" style={{fontWeight:700}}>{v.w?"W"+v.w:"-"}</td>
            <td className="mono">{v.m?v.m+"월":"-"}</td>
            <td className="mono" style={{fontSize:10,color:"var(--t3)"}}>{v.d1}{v.d1!==v.d2?"~"+v.d2:""}</td>
            <td className="mono" style={{color:"var(--blue)"}}>{fmt(v.cQ)||"-"}</td>
            <td className="mono" style={{color:"var(--amber)"}}>{fmt(v.fQ)||"-"}</td>
            <td className="mono" style={{fontWeight:700}}>{fmt(v.cQ+v.fQ)}</td>
            <td className="mono" style={{color:"var(--cyan)"}}>{fmt(v.rev)}</td>
          </tr>;
        });
        rs.push(<tr key="t" style={{borderTop:"2px solid var(--cyan)"}}>
          <td colSpan={3} style={{fontWeight:700,color:"var(--cyan)"}}>합 계</td>
          <td className="mono" style={{color:"var(--blue)",fontWeight:700}}>{fmt(tot.cQ)}</td>
          <td className="mono" style={{color:"var(--amber)",fontWeight:700}}>{fmt(tot.fQ)}</td>
          <td className="mono" style={{fontWeight:700}}>{fmt(tot.cQ+tot.fQ)}</td>
          <td className="mono" style={{color:"var(--cyan)",fontWeight:700,fontSize:13}}>{fmt(tot.rev)}</td>
        </tr>);
        return rs;
      })()}</tbody>
    </table></div></div>}
  </div>);
}

function ItemMasterPage({fabItems,setFabItems,role,toast}){
  const ce=role==="admin"||role==="manager";
  const[showM,setShowM]=useState(false);
  const[form,setForm]=useState({code:"",name:"",model:""});
  const[srch,setSrch]=useState("");
  const sf=p=>setForm(v=>({...v,...p}));

  // 초기 데이터 로드 → Supabase 우선, 없으면 localStorage, 없으면 INIT
  useEffect(()=>{
    const load=async()=>{
      const sb=getSB();
      if(sb){
        try{
          const{data}=await sb.from("kpi_targets").select("fab_items_json").eq("year",0).single();
          if(data?.fab_items_json){
            const parsed=JSON.parse(data.fab_items_json);
            setFabItems(parsed);
            localStorage.setItem("qms_fab_items",JSON.stringify(parsed));
            return;
          }
        }catch(e){}
      }
      // Supabase 없으면 localStorage
      const saved=localStorage.getItem("qms_fab_items");
      if(saved){try{setFabItems(JSON.parse(saved));return;}catch(e){}}
      // 그것도 없으면 INIT
      setFabItems(INIT_FAB_ITEMS);
      localStorage.setItem("qms_fab_items",JSON.stringify(INIT_FAB_ITEMS));
    };
    load();
  },[]);

  const syncItems=async(items)=>{
    const sb=getSB();
    if(!sb)return;
    // kpi_targets 테이블에 fab_items JSON으로 저장 (연도 0 = 글로벌)
    const{error}=await sb.from("kpi_targets").upsert(
      {year:0,fab_items_json:JSON.stringify(items)},
      {onConflict:"year",ignoreDuplicates:false}
    );
    if(error)console.warn("품목마스터 Supabase 동기화 오류:",error.message);
  };
  const save=async()=>{
    if(!form.code.trim()){toast("품목번호를 입력하세요","error");return;}
    if(fabItems.find(i=>i.code===form.code.trim())){toast("이미 등록된 품목번호입니다","error");return;}
    const newItem={code:form.code.trim(),name:form.name.trim(),model:form.model.trim()};
    const updated=[...fabItems,newItem];
    setFabItems(updated);
    localStorage.setItem("qms_fab_items",JSON.stringify(updated));
    await syncItems(updated);
    toast(`품목 ${form.code} 등록 완료 (제관품) — 저장됨`,"success");
    setForm({code:"",name:"",model:""});setShowM(false);
  };

  const del=async code=>{
    if(!confirm(`${code} 를 제관품 목록에서 삭제하시겠습니까?\n삭제 시 해당 품목은 절단품으로 처리됩니다.`))return;
    const updated=fabItems.filter(i=>i.code!==code);
    setFabItems(updated);
    localStorage.setItem("qms_fab_items",JSON.stringify(updated));
    await syncItems(updated);
    toast(`${code} 삭제 → 절단품으로 처리됨`,"info");
  };

  const reset=async()=>{
    if(!confirm("초기 기본 목록으로 리셋하시겠습니까?"))return;
    setFabItems(INIT_FAB_ITEMS);
    localStorage.setItem("qms_fab_items",JSON.stringify(INIT_FAB_ITEMS));
    await syncItems(INIT_FAB_ITEMS);
    toast("초기 목록으로 리셋됨","info");
  };

  const xlDown=()=>{
    const ws=XLSX.utils.json_to_sheet(fabItems.map(i=>({"품목번호":i.code,"품목명":i.name,"모델(품목그룹)":i.model,"분류":"제관품"})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"제관품목록");
    XLSX.writeFile(wb,`제관품_품목마스터_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast("다운로드 완료","success");
  };

  const xlUp=file=>{
    const rd=new FileReader();rd.onload=e=>{try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws);
      const imported=rows.map(r=>({
        code:String(r["품목번호"]||r["code"]||"").trim(),
        name:String(r["품목명"]||r["name"]||"").trim(),
        model:String(r["모델(품목그룹)"]||r["model"]||"").trim(),
      })).filter(r=>r.code);
      const merged=[...fabItems,...imported.filter(i=>!fabItems.find(x=>x.code===i.code))];
      setFabItems(merged);
      localStorage.setItem("qms_fab_items",JSON.stringify(merged));
      toast(`${imported.length}건 가져오기 완료 (중복제외)`,"success");
    }catch(err){toast("오류: "+err.message,"error");}};
    rd.readAsBinaryString(file);
  };

  const filtered=fabItems.filter(i=>!srch||i.code.includes(srch)||i.name.toLowerCase().includes(srch.toLowerCase())||i.model.toLowerCase().includes(srch.toLowerCase()));

  return(<div>
    <div className="info-box blue mb4">
      <b>📌 품목 마스터 관리 규칙</b><br/>
      이 목록에 등록된 품목번호 = <span style={{color:"var(--amber)",fontWeight:700}}>제관품(Fabrication)</span><br/>
      이 목록에 <b>없는</b> 품목번호 = <span style={{color:"var(--blue)",fontWeight:700}}>절단품(Cut parts)</span> (기본값)<br/>
      ERP 업로드 시 이 목록을 기준으로 자동 분류됩니다.
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:9,marginBottom:14}}>
      <div className="sc ca"><div className="sc-lbl">▸ 제관품 등록 수</div><div className="sc-val">{fabItems.length}</div><div className="sc-sub">품목번호</div></div>

    if(!y||y<2020||y>2060){alert("2020~2060 사이 연도를 입력하세요.");return;}
    onAdd(y);setNy("");setOpen(false);

  );
}

/* ── Dashboard ── */
function Dashboard({nci,claim,erp,target,year,yearDB}){
  /* ── refs: 차트 8개 ── */
  const rNciMonth=useRef(),rNciType=useRef(),rNciCaused=useRef(),rNciDisp=useRef(),rNciPart=useRef();
  const rClaimMonth=useRef(),rClaimCaused=useRef(),rClaimType=useRef();
  const cNciMonth=useRef(),cNciType=useRef(),cNciCaused=useRef(),cNciDisp=useRef(),cNciPart=useRef();
  const cClaimMonth=useRef(),cClaimCaused=useRef(),cClaimType=useRef();

  /* ── 집계 ── */
  const nciM=Array(12).fill(0),nciQM=Array(12).fill(0);
  nci.forEach(n=>{const m=getMo(n.issued_date);if(m){nciM[m-1]++;nciQM[m-1]+=(n.qty||0);}});
  const claimM=Array(12).fill(0);
  claim.forEach(cl=>{const m=getMo(cl.issued_date);if(m)claimM[m-1]+=(cl.claim_amount||0);});

  // NCI 분석
  const byType={},byCaused={},byDisp={},byPart={};
  nci.forEach(n=>{
    if(n.type)byType[n.type]=(byType[n.type]||0)+1;
    if(n.caused_by)byCaused[n.caused_by]=(byCaused[n.caused_by]||0)+1;
    if(n.disposition)byDisp[n.disposition]=(byDisp[n.disposition]||0)+1;
    if(n.part_name)byPart[n.part_name]=(byPart[n.part_name]||0)+1;
  });
  // Claim 분석
  const clByType={},clByCaused={};
  claim.forEach(cl=>{
    if(cl.type)clByType[cl.type]=(clByType[cl.type]||0)+1;
    if(cl.caused_by)clByCaused[cl.caused_by]=(clByCaused[cl.caused_by]||0)+(cl.claim_amount||0);
  });

  const tNci=nci.length,tQty=nci.reduce((s,n)=>s+(n.qty||0),0);
  const tClaim=claim.reduce((s,cl)=>s+(cl.claim_amount||0),0);
  const pending=nci.filter(n=>!n.effectiveness_result).length;
  const accepted=nci.filter(n=>n.effectiveness_result==="Accepted").length;
  const tErpQty=(erp||[]).reduce((s,e)=>s+e.qty,0);
  const tRevKRW=(erp||[]).reduce((s,e)=>s+(e.total_amount_krw||0),0);

  /* ── 색상 팔레트 ── */
  const PAL=["#1a6ef5","#ffab00","#00e676","#8b5cf6","#ff3d3d","#00d4ff","#00bcd4","#f97316","#a855f7","#10b981"];
  const base={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:"#7fb3d3",font:{size:11},padding:10}}},
    scales:{
      x:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}},
      y:{grid:{color:"rgba(255,255,255,.06)"},ticks:{color:"#7fb3d3",font:{size:10}}}
    }
  };
  const noScale={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:"#7fb3d3",font:{size:11},padding:12},position:"right"}}
  };
  const barH={...base,indexAxis:"y",scales:{
    x:{grid:{color:"rgba(255,255,255,.04)"},ticks:{color:"#7fb3d3",font:{size:10}}},
    y:{grid:{display:false},ticks:{color:"#e8f4fd",font:{size:11}}}
  }};

  useEffect(()=>{
    /* 1. NCI 월별 건수 */
    if(rNciMonth.current){
      cNciMonth.current?.destroy();
      cNciMonth.current=new Chart(rNciMonth.current,{type:"bar",data:{
        labels:MO,
        datasets:[
          {label:"NCI건수",data:nciM,backgroundColor:"rgba(0,212,255,.6)",borderColor:"#00d4ff",borderWidth:1.5,borderRadius:3},
          {label:"목표",data:Array(12).fill(Math.round((target.total_nci_target||30)/12)),type:"line",borderColor:"#ff3d3d",borderWidth:2,pointRadius:3,pointBackgroundColor:"#ff3d3d",fill:false,tension:.3}
        ]
      },options:base});
    }
    /* 2. NCI TYPE별 도넛 */
    if(rNciType.current&&Object.keys(byType).length){
      cNciType.current?.destroy();
      cNciType.current=new Chart(rNciType.current,{type:"doughnut",data:{
        labels:Object.keys(byType),
        datasets:[{data:Object.values(byType),backgroundColor:PAL,borderWidth:0,hoverOffset:8}]
      },options:{...noScale,plugins:{...noScale.plugins,
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed}건 (${(ctx.parsed/tNci*100).toFixed(1)}%)`}}
      }}});
    }
    /* 3. NCI CAUSED BY 가로막대 */
    if(rNciCaused.current&&Object.keys(byCaused).length){
      const sorted=Object.entries(byCaused).sort((a,b)=>b[1]-a[1]);
      cNciCaused.current?.destroy();
      cNciCaused.current=new Chart(rNciCaused.current,{type:"bar",data:{
        labels:sorted.map(([k])=>k),
        datasets:[{label:"NCI건수",data:sorted.map(([,v])=>v),
          backgroundColor:sorted.map((_,i)=>PAL[i%PAL.length]),borderWidth:0,borderRadius:4}]
      },options:{...barH,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.parsed.x}건 (${(ctx.parsed.x/tNci*100).toFixed(1)}%)`}}
      }}});
    }
    /* 4. NCI DISPOSITION 도넛 */
    if(rNciDisp.current&&Object.keys(byDisp).length){
      const dColors={Return:"#1a6ef5","Owner Rework":"#ffab00","Site Rework":"#f97316",Discard:"#ff3d3d"};
      cNciDisp.current?.destroy();
      cNciDisp.current=new Chart(rNciDisp.current,{type:"pie",data:{
        labels:Object.keys(byDisp),
        datasets:[{data:Object.values(byDisp),
          backgroundColor:Object.keys(byDisp).map(k=>dColors[k]||"#8b5cf6"),borderWidth:0,hoverOffset:6}]
      },options:{...noScale,plugins:{...noScale.plugins,
        tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed}건 (${(ctx.parsed/tNci*100).toFixed(1)}%)`}}
      }}});
    }
    /* 5. NCI PART NAME 가로막대 */
    if(rNciPart.current&&Object.keys(byPart).length){
      const sorted=Object.entries(byPart).sort((a,b)=>b[1]-a[1]).slice(0,8);
      cNciPart.current?.destroy();
      cNciPart.current=new Chart(rNciPart.current,{type:"bar",data:{
        labels:sorted.map(([k])=>k),
        datasets:[{label:"NCI건수",data:sorted.map(([,v])=>v),
          backgroundColor:"rgba(0,230,118,.65)",borderColor:"#00e676",borderWidth:1,borderRadius:4}]
      },options:{...barH,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${ctx.parsed.x}건`}}
      }}});
    }
    /* 6. 클레임 월별 금액 */
    if(rClaimMonth.current){
      cClaimMonth.current?.destroy();
      cClaimMonth.current=new Chart(rClaimMonth.current,{type:"bar",data:{
        labels:MO,
        datasets:[{label:"클레임(KRW)",data:claimM,
          backgroundColor:"rgba(255,61,61,.55)",borderColor:"#ff3d3d",borderWidth:1.5,borderRadius:3}]
      },options:base});
    }
    /* 7. 클레임 CAUSED BY (금액 기준) 가로막대 */
    if(rClaimCaused.current&&Object.keys(clByCaused).length){
      const sorted=Object.entries(clByCaused).sort((a,b)=>b[1]-a[1]);
      cClaimCaused.current?.destroy();
      cClaimCaused.current=new Chart(rClaimCaused.current,{type:"bar",data:{
        labels:sorted.map(([k])=>k),
        datasets:[{label:"클레임금액(KRW)",data:sorted.map(([,v])=>v),
          backgroundColor:sorted.map((_,i)=>PAL[i%PAL.length]),borderWidth:0,borderRadius:4}]
      },options:{...barH,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>`${fmt(ctx.parsed.x)}원`}}
      }}});
    }
    /* 8. 클레임 TYPE 도넛 */
    if(rClaimType.current&&Object.keys(clByType).length){
      cClaimType.current?.destroy();
