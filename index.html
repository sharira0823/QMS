      // NCI 실시간
      const nciCh=sb.channel("nci_realtime")
        .on("postgres_changes",{event:"*",schema:"public",table:"nci_list"},payload=>{
          const{eventType,new:n,old:o}=payload;
          if(eventType==="INSERT"){
            setYearDB(db=>{
              const yr=n.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,nci:[...cur.nci.filter(x=>x.id!==n.id),n].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))}};
            });
          }else if(eventType==="UPDATE"){
            setYearDB(db=>{
              const yr=n.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,nci:cur.nci.map(x=>x.id===n.id?{...x,...n}:x)}};
            });
          }else if(eventType==="DELETE"){
            setYearDB(db=>{
              const yr=o.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,nci:cur.nci.filter(x=>x.id!==o.id)}};
            });
          }
        }).subscribe();
      // Claim 실시간
      const claimCh=sb.channel("claim_realtime")
        .on("postgres_changes",{event:"*",schema:"public",table:"claim_list"},payload=>{
          const{eventType,new:n,old:o}=payload;
          if(eventType==="INSERT"){
            setYearDB(db=>{
              const yr=n.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,claim:[...cur.claim.filter(x=>x.id!==n.id),n].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))}};
            });
          }else if(eventType==="UPDATE"){
            setYearDB(db=>{
              const yr=n.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,claim:cur.claim.map(x=>x.id===n.id?{...x,...n}:x)}};
            });
          }else if(eventType==="DELETE"){
            setYearDB(db=>{
              const yr=o.year||new Date().getFullYear();
              const cur=db[yr]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()};
              return{...db,[yr]:{...cur,claim:cur.claim.filter(x=>x.id!==o.id)}};
            });
          }
        }).subscribe();
      // ERP 실시간
      const erpCh=sb.channel("erp_realtime")
        .on("postgres_changes",{event:"*",schema:"public",table:"erp_sales"},()=>{
          // ERP 변경 시 전체 재로드
          load();
        }).subscribe();
      channels=[nciCh,claimCh,erpCh];
    };
    const load=async()=>{
    /* ── localStorage ERP 복구 (Supabase 연결 여부 무관하게 항상 실행) ── */
    try{
      const savedYear=parseInt(localStorage.getItem('qms_erp_year')||'0');
      if(savedYear>2020){
        const saved=localStorage.getItem('qms_erp_'+savedYear);
        if(saved){
          const erpData=JSON.parse(saved);
          if(Array.isArray(erpData)&&erpData.length>0){
            setYearDB(db=>({...db,[savedYear]:{
              ...(db[savedYear]||{nci:[],claim:[],erp:[],kpiTarget:mkKPI()}),
              erp:erpData
            }}));
          }
        }
      }
    }catch(e){}
    /* ── Supabase 없으면 여기서 종료 (localStorage 복구는 위에서 완료) ── */
    const sb=getSB();if(!sb)return;
    try{
      // ── NCI 로드 ──
      const{data:nciRaw,error:e1}=await sb.from("nci_list").select("*").order("sort_order",{ascending:true});
      if(e1)throw e1;
      // ── Claim 로드 ──
      const{data:claimRaw,error:e2}=await sb.from("claim_list").select("*").order("sort_order",{ascending:true});
      if(e2)throw e2;
      // ── ERP 로드 ──
      const{data:erpRaw,error:e3}=await sb.from("erp_sales").select("*");
      if(e3)throw e3;
      // ── KPI 목표 로드 ──
      const{data:kpiRaw,error:e4}=await sb.from("kpi_targets").select("*");
      if(e4)throw e4;
      // ── 연도별로 분류하여 state 업데이트 ──
      const allYears=[...new Set([
        ...(nciRaw||[]).map(n=>n.year),
        ...(claimRaw||[]).map(c=>c.year),
        ...Object.keys(yearDB).map(Number)
      ])].filter(Boolean);
      const newDB={};
      allYears.forEach(y=>{
        const yn=Number(y);
        const kpiT=(kpiRaw||[]).find(k=>k.year===yn);
        newDB[yn]={
          nci:(nciRaw||[]).filter(n=>n.year===yn).map(n=>({
            id:n.id,seq_no:n.seq_no,year:n.year,sort_order:n.sort_order,
            internal_ncr_no:n.internal_ncr_no,owner_ncr_no:n.owner_ncr_no,
            week_no:n.week_no,issued_date:n.issued_date,due_date:n.due_date,
            part_name:n.part_name,part_no:n.part_no,
            item_category:n.item_category||(n.part_name?.toLowerCase().includes("cut")?"cut":"fab"),
            nci_photo_yn:n.nci_photo_yn,nci_description:n.nci_description,
            rca:n.rca,corrective_action:n.corrective_action,
            car_no:n.car_no,qty:n.qty,type:n.type,
            caused_by:n.caused_by,disposition:n.disposition,
            effectiveness_date:n.effectiveness_date,
            effectiveness_result:n.effectiveness_result,
            remark:n.remark,
            photo_urls:n.photo_urls||[],doc_urls:n.doc_urls||[]
          })),
          claim:(claimRaw||[]).filter(n=>n.year===yn).map(n=>({
            id:n.id,seq_no:n.seq_no,year:n.year,sort_order:n.sort_order,
            internal_ncr_no:n.internal_ncr_no,owner_ncr_no:n.owner_ncr_no,
            week_no:n.week_no,issued_date:n.issued_date,
            part_name:n.part_name,part_no:n.part_no,
            nci_description:n.nci_description,type:n.type,
            caused_by:n.caused_by,disposition:n.disposition,
            claim_amount:n.claim_amount,final_agreed:n.final_agreed,
            tc_tech_ratio:n.tc_tech_ratio,partner_ratio:n.partner_ratio,
            doc_no:n.doc_no,remark:n.remark,
            photo_urls:n.photo_urls||[],doc_urls:n.doc_urls||[]
          })),
          erp:(erpRaw||[]).filter(n=>n.year===yn).map(n=>({
            id:n.id, year:n.year, month:n.month, week_no:n.week_no,
            invoice_no:n.invoice_no||'',
            cust_name:n.customer_name||'지니(GENIE IND.)',
            item_code:n.item_code||'', item_name:n.item_name||'',
            item_group:n.item_group_name||'', item_spec:n.item_spec||'',
            qty:Number(n.qty)||0,
            total_amount_krw:Number(n.total_amount_krw)||0,
            is_fabrication:!!n.is_fabrication,
            is_cut_parts:!!n.is_cut_parts,
            is_target:true,
            ship_date:n.invoice_no||'',
          })),

          kpiTarget:kpiT?{
            cut_nci_target:kpiT.cut_nci_target,cut_qty_target:kpiT.cut_qty_target,
            cut_ppm_target:kpiT.cut_ppm_target,fab_nci_target:kpiT.fab_nci_target,
            fab_qty_target:kpiT.fab_qty_target,fab_ppm_target:kpiT.fab_ppm_target,
            total_nci_target:kpiT.total_nci_target,total_qty_target:kpiT.total_qty_target,
            claim_target:kpiT.claim_target
          }:mkKPI()
        };
      });
      setYearDB(newDB);
      // 가장 최근 연도로 자동 전환
      const latestYear=Math.max(...allYears.map(Number));
      setYear(latestYear);
      setConn(true);
    }catch(e){console.error("Supabase 로드 오류:",e);}
  };load();subscribeRealtime();
    return()=>{channels.forEach(ch=>{try{getSB()?.removeChannel(ch);}catch(e){}});};
  },[]);
  if(!user)return<Login onLogin={setUser}/>;
  const SY=Object.keys(yearDB).map(Number).sort((a,b)=>b-a);
  const ce=user.role==="admin"||user.role==="manager";
  const NAV=[
    {id:"dashboard",ic:"◈",l:"대시보드",s:"메인"},
    {id:"nci",ic:"◉",l:"NCI & CAR List",s:"품질 데이터"},
    {id:"claim",ic:"◎",l:"Filed Claim List",s:"품질 데이터"},
    
    {id:"kpi",ic:"▦",l:"Quality KPI",s:"분석"},
    {id:"erp",ic:"📦",l:"ERP 출하/매출",s:"ERP 연동"},
    {id:"items",ic:"📋",l:"품목 마스터",s:"ERP 연동"},
    {id:"settings",ic:"⚙",l:"설정",s:"시스템"},
  ];
  const TITLES={dashboard:"대시보드",nci:"NCI & CAR List",claim:"Filed Claim List",kpi:"Quality KPI",erp:"ERP 출하/매출 연동",items:"품목 마스터 (제관품 관리)",settings:"시스템 설정"};
  const secs=[...new Set(NAV.map(n=>n.s))];
  return(<div className="layout">
    <aside className="sidebar">
      <div className="logo-wrap"><div className="logo">QMS</div><div className="logo-sub">QUALITY MANAGEMENT SYSTEM</div><div className="logo-ver">v2.0 — 용접구조물 품질관리 포털</div></div>
      <div className="yr-panel"><div className="yr-lbl">연도</div>
        {SY.map(y=>(
          <div key={y} className={`yt ${y===year?"act":""}`} onClick={()=>setYear(y)}>
            <span>{y}년</span>
            <div style={{display:"flex",alignItems:"center",gap:4}}>
              <span className="yt-c">NCI {yearDB[y].nci.length}</span>
              {ce&&SY.length>1&&<button style={{width:14,height:14,borderRadius:"50%",background:"rgba(255,61,61,.7)",border:"none",color:"#fff",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}} onClick={e=>{e.stopPropagation();if(!window.confirm(`${y}년 데이터를 삭제하시겠습니까?`))return;delYear(y);}} title="연도 삭제">✕</button>}
            </div>
          </div>
        ))}
        {ce&&<YearAddInline onAdd={y=>{addYear(y);setYear(y);}}/>}
      </div>
      {secs.map(s=><div className="nav-sec" key={s}><div className="nav-lbl">{s}</div>
        {NAV.filter(n=>n.s===s).map(n=><div key={n.id} className={`ni ${page===n.id?"act":""}`} onClick={()=>setPage(n.id)}>
          <span style={{width:14,textAlign:"center"}}>{n.ic}</span><span>{n.l}</span>
        </div>)}
      </div>)}
      <div className="sb-foot"><div className="ubadge"><div className="uav">{user.name[0]}</div><div style={{flex:1}}><div className="uname">{user.name}</div><div className="udept">{user.dept}</div></div><span className={`rb ${user.role}`}>{user.role}</span></div>
        <button className="btn btn-s" style={{width:"100%",marginTop:6,justifyContent:"center"}} onClick={()=>setUser(null)}>로그아웃</button>
      </div>
    </aside>
    <div className="main">
      <div className="topbar">
        <div style={{display:"flex",alignItems:"center",gap:8}}><div className="pg-title">{TITLES[page]}</div><span className="yr-badge">📅 {year}년</span></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {conn&&<span className="conn-ok">🔗 DB실시간 연결중</span>}
          <span style={{fontSize:12,color:"var(--t3)"}}>{new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric"})}</span>
        </div>
      </div>
      <div className="content">
        {page==="dashboard"&&<Dashboard nci={cur.nci} claim={cur.claim} erp={cur.erp} target={cur.kpiTarget} year={year} yearDB={yearDB}/>}
        {page==="nci"&&<NCIPage data={cur.nci} setData={setNci} role={user.role} toast={toast} year={year}/>}
        {page==="claim"&&<ClaimPage data={cur.claim} setData={setClaim} role={user.role} toast={toast} year={year} currency={currency} setCurrency={setCurrency} rates={rates} setRates={setRates}/>}

        {page==="kpi"&&<KPIPage nci={cur.nci} claim={cur.claim} erp={cur.erp} target={cur.kpiTarget} setTarget={setKpiTarget} role={user.role} year={year} yearDB={yearDB}/>}
        {page==="erp"&&<ERPPage data={cur.erp} setData={setErp} role={user.role} toast={toast} year={year} fabItems={fabItems}/>}
        {page==="items"&&<ItemMasterPage fabItems={fabItems} setFabItems={setFabItems} role={user.role} toast={toast}/>}
        {page==="settings"&&<Settings user={user} toast={toast} conn={conn}/>}
      </div>
    </div>
    <Toast toasts={toasts}/>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
