              <thead><tr><th>용접사</th><th>기간</th><th>NDT</th><th>결과</th></tr></thead>
              <tbody>{[...renewals].reverse().slice(0,5).map(r=>{
                const wdr=welders.find(w=>w.id===r.welder_id)||{name_kr:'-'};
                return(<tr key={r.id}>

/* ══════════════════════════════════════
   👷 용접사 등록 — 번호 수동/자동 혼용
══════════════════════════════════════ */
function WWelderList({welders,setWelders,wpqrList,ce,toast}){
  const[showM,setShowM]=useState(false);
  const[edit,setEdit]=useState(null);
  const[search,setSearch]=useState('');
  const[dupCheck,setDupCheck]=useState(null); // null | {found, welder}
  const mkF=()=>({welder_no:'',name_kr:'',name_en:'',birth_date:'',department:'',job_title:'',hire_date:'',manual_no:false});
  const[form,setForm]=useState(mkF());
  const sf=p=>setForm(v=>({...v,...p}));

  const filtered=welders.filter(w=>
    w.name_kr.includes(search)||w.welder_no.includes(search)||(w.department||'').includes(search)
  );

  // 다음 자동 번호 계산
  function nextAutoNo(){
    const nums=welders.map(w=>{const m=w.welder_no.match(/W-(\d+)/);return m?parseInt(m[1]):0;});
    return wFmtNo(nums.length>0?Math.max(...nums)+1:1);
  }

  function openAdd(){
    setEdit(null);
    setDupCheck(null);
    setForm({...mkF(), welder_no:nextAutoNo(), manual_no:false});
    setShowM(true);
  }
  function openEdit(w){setEdit(w);setDupCheck(null);setForm({...w,manual_no:true});setShowM(true);}

  // 생년월일 입력 시 중복 체크
  function handleBirth(v){
    const masked=wMaskBirth(v);
    sf({birth_date:masked});
    if(masked.length>=7&&!edit){
      const front=masked.slice(0,7);
      const found=welders.find(w=>w.birth_date&&w.birth_date.slice(0,7)===front);
      if(found){
        setDupCheck({found:true,welder:found});
        sf({birth_date:masked, welder_no:found.welder_no});
      } else {
        setDupCheck({found:false});
        if(!form.manual_no) sf({birth_date:masked, welder_no:nextAutoNo()});
        else sf({birth_date:masked});
      }
    }
  }

  function handleNoChange(v){
    sf({welder_no:v, manual_no:true});
  }

  function save(){
    if(!form.name_kr||!form.birth_date){toast('이름과 주민번호를 입력하세요.','error');return;}
    if(!form.welder_no){toast('용접사 번호를 확인하세요.','error');return;}
    // 번호 중복 체크 (수정 제외)
    if(!edit){
      const dupNo=welders.find(w=>w.welder_no===form.welder_no);
      if(dupNo){toast(`번호 ${form.welder_no}는 이미 사용 중입니다.`,'error');return;}
    }
    if(edit){
      setWelders(l=>l.map(w=>w.id===edit.id?{...w,...form}:w));
      toast('수정 완료','success');
    } else {
      setWelders(l=>[...l,{...form,id:'wm'+Date.now(),name_en:krToEn(form.name_kr)}]);
      toast('등록 완료','success');
    }
    setShowM(false);
  }
  function del(id){if(!confirm('삭제하시겠습니까?'))return;setWelders(l=>l.filter(w=>w.id!==id));toast('삭제 완료','info');}

  return(
    <div>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <input placeholder="🔍 이름, 번호, 부서 검색..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:260}}/>
        <div style={{marginLeft:'auto'}}>
          {ce&&<button className="btn btn-p" onClick={openAdd}>+ 용접사 등록</button>}
        </div>
      </div>
      <div className="card">
        <div className="card-hd">
          <span className="card-title">용접사 기본정보 ({welders.length}명)</span>
          <span className="b bc" style={{fontSize:11}}>다음 자동 번호: {nextAutoNo()}</span>
        </div>
        <div className="tw"><table>
          <thead><tr><th>용접사 번호</th><th>한글 이름</th><th>영문 이름</th><th>주민번호</th><th>부서</th><th>직책</th><th>입사일</th><th>자격</th>{ce&&<th>관리</th>}</tr></thead>
          <tbody>{filtered.map(w=>{
            const q=wpqrList.filter(wq=>wq.welder_id===w.id&&wq.approved&&new Date(wq.cert_expiry_date)>=new Date());
            return(<tr key={w.id}>
              <td style={{color:'var(--cyan)',fontWeight:700,fontFamily:'Calibri'}}>{w.welder_no}</td>
              <td style={{fontWeight:600}}>{w.name_kr}</td>
              <td style={{fontFamily:'Calibri',fontSize:11,color:'var(--t3)'}}>{w.name_en}</td>
              <td style={{fontFamily:'Calibri',fontSize:11}}>{w.birth_date}</td>
              <td>{w.department}</td>
              <td>{w.job_title}</td>
              <td style={{fontSize:11}}>{w.hire_date}</td>
              <td>{q.length>0?<span className="b bg">{q.length}개 유효</span>:<span className="b br">없음</span>}</td>
              {ce&&<td><div style={{display:'flex',gap:3}}>
                <button className="ib" onClick={()=>openEdit(w)}>✎</button>
                <button className="ib d" onClick={()=>del(w.id)}>✕</button>
              </div></td>}
            </tr>);
          })}</tbody>
        </table></div>
      </div>

      {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
        <div className="modal" style={{maxWidth:640}}>
          <div className="mhd">

            {/* 생년월일 중복 알림 */}

              </div>
            )}
            {dupCheck&&!dupCheck.found&&(
              <div className="info-box" style={{marginBottom:12,fontSize:12,background:'rgba(0,230,118,0.08)',borderLeft:'4px solid var(--green)'}}>
                ✅ 기존 번호 없음 — <strong>{form.welder_no}</strong>로 신규 부여됩니다.
              </div>
            )}

            <div className="fgg">
              {/* 용접사 번호 — 수동 수정 가능 */}
              <div className="fg">
                <label>용접사 번호 <span style={{color:'var(--amber,#f59e0b)',fontSize:10}}>✎ 직접 수정 가능</span></label>

              <div className="fg">
                <label>한글 이름 *</label>
                <input value={form.name_kr} onChange={e=>sf({name_kr:e.target.value,name_en:krToEn(e.target.value)})}/>
              </div>
              <div className="fg">
                <label>영문 이름 <span style={{color:'var(--green)',fontSize:10}}>🔄 자동</span></label>
                <input readOnly value={form.name_en}/>
              </div>
              <div className="fg">
                <label>주민번호 * <span style={{fontSize:10,color:'var(--t3)'}}>(앞 7자리 입력→뒤 자동 마스킹, 기존 번호 조회)</span></label>
                <input value={form.birth_date} onChange={e=>handleBirth(e.target.value)} placeholder="850315-1" maxLength={9}/>
              </div>
              <div className="fg">
                <label>소속 부서</label>
                <select value={form.department||''} onChange={e=>sf({department:e.target.value})}>
                  <option value="">선택</option><option>용접팀</option><option>제관팀</option><option>절단팀</option><option>조립팀</option>
                </select>
              </div>
              <div className="fg">
                <label>직책</label>
                <select value={form.job_title||''} onChange={e=>sf({job_title:e.target.value})}>
                  <option value="">선택</option><option>용접사</option><option>선임용접사</option><option>수석용접사</option><option>용접반장</option>
                </select>
              </div>
              <div className="fg">
                <label>입사일</label>
                <input type="date" value={form.hire_date||''} onChange={e=>sf({hire_date:e.target.value})}/>
              </div>
            </div>
          </div>
          <div className="mft">
            <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
            <button className="btn btn-p" onClick={save}>💾 저장</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

              <span>적용두께: {t.range_thickness||'-'}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

    ut_sensitivity:'FSH 80%',ut_transducer_angle:'70°',ut_frequency:'4',ut_examiner:'D.Y.LEE',ut_level:'II',ut_indication:'NO RECORDABLE INDICATION',
    macro_test_date:'',macro_report_no:'',macro_result:'Accepted',
    break_test_date:'',break_report_no:'',break_result:'Accepted',
    test_photos:[],macro_photos:[],
    conducted_by:tpl?tpl.conducted_by:'D.Y.LEE', prepared_by:tpl?tpl.prepared_by:'D.Y.LEE', certified_by:tpl?tpl.certified_by:'J.H.HWANG',
    overall_result:'PASS', approved:false, approved_date:'', approved_by:'', status:'DRAFT', remarks:'',
  });

  const[form,setForm]=useState(mkForm(null));
  const sf=p=>setForm(v=>({...v,...p}));

  function startNew(){setSelTemplate(null);setEditItem(null);setView('select');}
  function selectTemplate(tpl){
    const no=wFmtWPQR(wpqrList.length+1);
    const cert=wFmtCert(wpqrList.length+1);
    setForm({...mkForm(tpl),wpqr_no:no,cert_no:cert});
    setSelTemplate(tpl);
    setView('form');
  }
  function openEdit(w){
    setForm({...mkForm(null),...w});
    setEditItem(w);
    setSelTemplate(templates.find(t=>t.id===w.template_id)||null);
    setView('form');
  }
  function del(id){if(!confirm('삭제?'))return;setWpqrList(l=>l.filter(w=>w.id!==id));toast('삭제 완료','info');}

  function saveDraft(){
    if(!form.welder_id){toast('용접사를 선택하세요.','error');return;}
    const item={...form,status:'DRAFT',approved:false};
    if(editItem) setWpqrList(l=>l.map(w=>w.id===editItem.id?{...w,...item}:w));
    else setWpqrList(l=>[...l,{...item,id:'wq'+Date.now()}]);
    toast('임시저장 완료','info');setView('list');
  }
  function saveApprove(){
    if(!form.welder_id){toast('용접사를 선택하세요.','error');return;}
    const today=new Date().toISOString().split('T')[0];
    const item={...form,status:'APPROVED',approved:true,approved_date:today,approved_by:form.certified_by,
      cert_issued_date:form.test_date,cert_expiry_date:wExpiry(form.test_date)};
    if(editItem) setWpqrList(l=>l.map(w=>w.id===editItem.id?{...w,...item}:w));
    else setWpqrList(l=>[...l,{...item,id:'wq'+Date.now()}]);
    toast('✅ 승인 완료! 유자격 명단 자동 등록.','success');setView('list');
  }

  const wdr=welders.find(w=>w.id===form.welder_id)||{};

  /* ── 목록 ── */
  if(view==='list') return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
        <div style={{display:'flex',gap:6}}>
          <span className="b bg">{wpqrList.filter(w=>w.approved).length}건 승인</span>
          <span className="b ba">{wpqrList.filter(w=>!w.approved).length}건 초안</span>
        </div>
        {ce&&<button className="btn btn-p" onClick={startNew}>+ 시험 합격 후 WPQR 작성</button>}
      </div>
      <div className="card">
        <div className="tw"><table>
          <thead><tr><th>WPQR No.</th><th>용접사</th><th>양식명</th><th>용접종류</th><th>시험일</th><th>자세</th><th>판정</th><th>상태</th><th>유효기간</th><th>관리</th></tr></thead>
          <tbody>{wpqrList.length===0
            ?<tr><td colSpan={10} style={{textAlign:'center',padding:20,color:'var(--t3)'}}>등록된 WPQR이 없습니다.</td></tr>
            :wpqrList.map(w=>{
              const wdr2=welders.find(ww=>ww.id===w.welder_id)||{name_kr:'-',welder_no:'-'};
              const exp=w.cert_expiry_date&&new Date(w.cert_expiry_date)<new Date();
              return(<tr key={w.id}>
                <td style={{color:'#60a5fa',fontSize:11,fontFamily:'Calibri',cursor:'pointer'}} onClick={()=>setShowPreview(w)}>{w.wpqr_no}</td>
                <td><strong>{wdr2.name_kr}</strong><br/><span style={{fontSize:10,color:'var(--t3)'}}>{wdr2.welder_no}</span></td>
                <td style={{fontSize:11}}>{w.template_name||'-'}</td>
                <td><span className={`b ${w.weld_type==='Groove'?'bg':w.weld_type==='Fillet'?'bc':'bb'}`}>{w.weld_type||'-'}</span></td>
                <td style={{fontSize:11}}>{w.test_date}</td>
                <td>{w.position}</td>
                <td><span className={`b ${w.overall_result==='PASS'?'bg':'br'}`}>{w.overall_result}</span></td>
                <td>{w.approved?<span className="b bg">✅ 승인</span>:<span className="b ba">📝 초안</span>}</td>
                <td style={{fontSize:10,color:exp?'var(--red)':'var(--t2)'}}>{w.cert_expiry_date||'-'}</td>
                <td><div style={{display:'flex',gap:3}}>
                  <button className="ib" onClick={()=>setShowPreview(w)}>📄</button>
                  {ce&&<button className="ib" onClick={()=>openEdit(w)}>✎</button>}
                  {ce&&<button className="ib d" onClick={()=>del(w.id)}>✕</button>}
                </div></td>
              </tr>);
            })
          }</tbody>
        </table></div>
      </div>
      {showPreview&&(
        <div className="ov" onClick={e=>e.target===e.currentTarget&&setShowPreview(null)}>
          <div className="modal" style={{maxWidth:860}}>
            <div className="mhd">
              <span className="mtitle">📄 {showPreview.wpqr_no} — {showPreview.template_name||showPreview.weld_type}</span>
              <div style={{display:'flex',gap:6}}>
                <button className="btn btn-s btn-sm" onClick={()=>window.print()}>🖨 인쇄</button>
                {ce&&<button className="btn btn-s btn-sm" onClick={()=>{setShowPreview(null);openEdit(showPreview);}}>✎</button>}
                <button className="xb" onClick={()=>setShowPreview(null)}>✕</button>
              </div>
            </div>
            <div className="mbd" style={{padding:0}}>
              <WPQRPrintView wpqr={showPreview} welders={welders}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  /* ── 양식 선택 ── */
  if(view==='select') return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <button className="btn btn-s btn-sm" onClick={()=>setView('list')}>← 목록으로</button>
        <span style={{fontWeight:700,fontSize:14}}>WPQR 양식 선택</span>
      </div>
      <div className="info-box blue" style={{marginBottom:14}}>
        💡 시험 합격 후 해당하는 양식을 선택하세요. 용접사 기본정보(이름·번호·주민번호)는 자동으로 입력됩니다.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}}>
        {templates.map(t=>(
          <div key={t.id} className="card" onClick={()=>selectTemplate(t)} style={{cursor:'pointer',borderLeft:`4px solid ${t.weld_type==='Groove'?'var(--cyan)':t.weld_type==='Fillet'?'#a78bfa':'var(--green)'}`,transition:'box-shadow .15s'}}

            onMouseLeave={e=>e.currentTarget.style.boxShadow=''}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{t.name}</div>
            <div style={{display:'flex',gap:4,marginBottom:8}}>
              <span className="b bp">{t.process}</span>
              <span className={`b ${t.weld_type==='Groove'?'bg':t.weld_type==='Fillet'?'bc':'bb'}`}>{t.weld_type}</span>
              <span className="b ba">{t.position}</span>
            </div>
            <div style={{fontSize:11,color:'var(--t3)'}}>
              {t.material_spec} {t.material_grade} · {t.filler_class} · 적용자세: {t.range_position}
            </div>
            <div style={{marginTop:8,textAlign:'right',fontSize:11,color:'var(--cyan)',fontWeight:600}}>이 양식으로 작성 →</div>
          </div>
        ))}
      </div>
    </div>
  );

  /* ── 작성 폼 ── */
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>

        <span style={{fontWeight:700,fontSize:14}}>{editItem?'WPQR 수정':'WPQR 작성'}</span>
        <span style={{fontFamily:'Calibri',color:'var(--cyan)',fontSize:13}}>{form.wpqr_no}</span>
        {selTemplate&&<span className="b bp">양식: {selTemplate.name}</span>}
        {form.approved&&<span className="b bg">✅ 승인완료</span>}

      <div className="card" style={{marginBottom:10,borderTop:'3px solid var(--cyan)'}}>
        <div className="card-hd" style={{background:'rgba(0,212,255,0.05)'}}>
          <span className="card-title">① 기본 정보</span>
          <span style={{fontSize:11,color:'var(--green)'}}>🔄 이름·주민번호·번호는 용접사 선택 시 자동 반영</span>
        </div>
        <div className="card-bd">
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
            <div className="fg"><label>WPQR No. 🔄</label><input readOnly value={form.wpqr_no}/></div>
            <div className="fg"><label>Certificate No. 🔄</label><input readOnly value={form.cert_no}/></div>
            <div className="fg"><label>Test Date *</label><input type="date" value={form.test_date} onChange={e=>sf({test_date:e.target.value})}/></div>
            <div className="fg">
              <label>Welder / 용접사 *</label>
              <select value={form.welder_id} onChange={e=>sf({welder_id:e.target.value})}>

                {welders.map(w=><option key={w.id} value={w.id}>{w.name_kr} ({w.welder_no})</option>)}
              </select>
            </div>
            <div className="fg"><label>Name 🔄</label><input readOnly value={form.welder_id?`${wdr.name_en||''} (${wdr.name_kr||''})`:''}/></div>
            <div className="fg"><label>Identification No. 🔄</label><input readOnly value={form.welder_id?(wdr.birth_date||''):''}/></div>
            <div className="fg"><label>WPS No.</label><input value={form.wps_no||''} onChange={e=>sf({wps_no:e.target.value})} placeholder="TCS-FC-1206"/></div>
            <div className="fg"><label>용접 종류 🔄</label><input readOnly value={form.weld_type}/></div>
            <div className="fg">
              <label>적용 코드 / 규격</label>
              <select style={{width:'100%'}} value={form.code_standard||'AWS D1.1 (2010)'} onChange={e=>sf({code_standard:e.target.value})}>
                <option value="AWS D1.1 (2010)">AWS D1.1 (2010)</option>
                <option value="AWS D1.1 (2015)">AWS D1.1 (2015)</option>
                <option value="AWS D1.1 (2020)">AWS D1.1 (2020)</option>
                <option value="AWS D14.3 (2010)">AWS D14.3 (2010)</option>
                <option value="AWS D14.3 (2020)">AWS D14.3 (2020)</option>
                <option value="ISO 9606-1 (2012)">ISO 9606-1 (2012)</option>
                <option value="ISO 9606-1 (2017)">ISO 9606-1 (2017)</option>
                <option value="KS B ISO 9606-1">KS B ISO 9606-1</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      {/* ② Variables — 템플릿 고정값, 수정 가능 */}
      <div className="card" style={{marginBottom:10}}>
        <div className="card-hd">
          <span className="card-title">② Variables</span>
          <span style={{fontSize:11,color:'var(--t3)'}}>양식에서 자동 채움 — 필요 시 수정 가능</span>
        </div>
        <div className="card-bd" style={{padding:0}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr>
              <th style={{background:'var(--bg4)',padding:'6px 10px',border:'1px solid var(--bdr)',fontWeight:600,width:'32%'}}>VARIABLES</th>
              <th style={{background:'var(--bg4)',padding:'6px 10px',border:'1px solid var(--bdr)',fontWeight:600,width:'34%'}}>ACTUAL VALUES</th>
              <th style={{background:'var(--bg4)',padding:'6px 10px',border:'1px solid var(--bdr)',fontWeight:600,width:'34%'}}>QUALIFICATION RANGE</th>
            </tr></thead>
            <tbody>
              {[
                ['WELDING PROCESS(ES)','process',null,'range_process'],
                ['ELECTRODE','electrode_type',['Single','Multiple'],null],
                ['WELDING POSITION','position',null,'range_position'],
                ['PROGRESSION','progression',['Uphill','Downhill','N/A'],null],
                ['BACKING','backing',['Yes','No','N/A'],null],
              ].map(([lbl,fld,opts,rfld])=>(
                <tr key={fld}>
                  <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>{lbl}</td>
                  <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>
                    {opts?<select style={{width:'100%'}} value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}>{opts.map(o=><option key={o}>{o}</option>)}</select>
                      :<input style={{width:'100%'}} value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}/>}
                  </td>
                  <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>
                    {rfld?<input style={{width:'100%'}} value={form[rfld]||''} onChange={e=>sf({[rfld]:e.target.value})}/>
                      :<span style={{color:'var(--t3)',fontSize:11,padding:'0 4px'}}>-</span>}
                  </td>
                </tr>
              ))}
              <tr>
                <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>MATERIAL / SPEC</td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>
                  <input style={{width:'100%',marginBottom:3}} value={form.material_spec||''} onChange={e=>sf({material_spec:e.target.value})}/>
                  <input style={{width:'100%'}} value={form.material_grade||''} onChange={e=>sf({material_grade:e.target.value})}/>
                </td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><input style={{width:'100%'}} value={form.range_material||''} onChange={e=>sf({range_material:e.target.value})}/></td>
              </tr>
              {[['두께-GROOVE','thickness_groove','range_thickness'],['두께-FILLET','thickness_fillet',null],['직경-GROOVE','diameter_groove','range_diameter'],['직경-FILLET','diameter_fillet',null],['FILLER-SPEC','filler_spec',null],['FILLER-CLASS','filler_class',null],['F.NO','filler_fno',null],['GAS TYPE','gas_type',null],['GAS BACKING','gas_backing',null]].map(([lbl,fld,rfld])=>(
                <tr key={fld}>
                  <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>{lbl}</td>
                  <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><input style={{width:'100%'}} value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}/></td>
                  <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>{rfld?<input style={{width:'100%'}} value={form[rfld]||''} onChange={e=>sf({[rfld]:e.target.value})}/>:<span style={{color:'var(--t3)',padding:'0 4px',fontSize:11}}>-</span>}</td>
                </tr>
              ))}
              <tr>
                <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>CURRENT & POL.</td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><select style={{width:'100%'}} value={form.current_polarity||''} onChange={e=>sf({current_polarity:e.target.value})}><option>DCEP</option><option>DCEN</option><option>AC</option></select></td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><input style={{width:'100%'}} value={form.range_current||''} onChange={e=>sf({range_current:e.target.value})} placeholder="DCEP or DCEN"/></td>
              </tr>
              <tr>
                <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>TRANSFER MODE</td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><select style={{width:'100%'}} value={form.transfer_mode||''} onChange={e=>sf({transfer_mode:e.target.value})}><option>Spray/Globular</option><option>Short Circuit</option><option>Pulse</option><option>N/A</option></select></td>
                <td style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><input style={{width:'100%'}} value={form.range_transfer||''} onChange={e=>sf({range_transfer:e.target.value})} placeholder="Any"/></td>
              </tr>
              <tr>
                <td style={{padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600}}>OTHERS</td>
                <td colSpan={2} style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}><input style={{width:'100%'}} value={form.others||''} onChange={e=>sf({others:e.target.value})}/></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      {/* ③ 시험결과 */}
      <div className="card" style={{marginBottom:10}}>
        <div className="card-hd"><span className="card-title">③ 시험 결과 입력</span></div>
        <div className="card-bd">
          <div style={{marginBottom:10}}>
            <label style={{fontSize:12,fontWeight:600,color:'var(--t3)'}}>VISUAL INSPECTION</label>
            <select value={form.visual_result} onChange={e=>sf({visual_result:e.target.value})} style={{width:180,marginLeft:10}}>
              <option>ACCEPTED</option><option>REJECTED</option>
            </select>
          </div>
          {(form.weld_type==='Groove'||form.weld_type==='Both')&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:600,color:'var(--t3)',marginBottom:6}}>GUIDED BEND TEST</div>
              <div style={{display:'flex',gap:6,marginBottom:6,alignItems:'center'}}>
                <span style={{fontSize:11}}>Test No.</span>
                <input value={form.bend_test_no||''} onChange={e=>sf({bend_test_no:e.target.value})} style={{width:160}}/>
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                <thead><tr>
                  {['TYPE','RESULTS','TYPE','RESULTS'].map((h,i)=><th key={i} style={{background:'var(--bg4)',padding:'5px 8px',border:'1px solid var(--bdr)',textAlign:'center'}}>{h}</th>)}
                </tr></thead>
                <tbody>{[[1,2],[3,4]].map(([a,b])=>(
                  <tr key={a}>
                    {[a,b].map(n=>[
                      <td key={`t${n}`} style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>
                        <select style={{width:'100%'}} value={form[`bend${n}_type`]||''} onChange={e=>sf({[`bend${n}_type`]:e.target.value})}>
                          <option value="">선택</option><option>Face Bend</option><option>Root Bend</option><option>Side Bend</option>
                        </select>
                      </td>,
                      <td key={`r${n}`} style={{padding:'4px 6px',border:'1px solid var(--bdr)'}}>
                        <select style={{width:'100%'}} value={form[`bend${n}_result`]||''} onChange={e=>sf({[`bend${n}_result`]:e.target.value})}>
                          <option value="">선택</option><option>ACCEPTED</option><option>REJECTED</option>
                        </select>
                      </td>
                    ])}
                  </tr>
                ))}</tbody>
              </table>
            </div>
          )}
          {(form.weld_type==='Fillet'||form.weld_type==='Both')&&(
            <div style={{marginBottom:10}}>
              <div style={{fontSize:12,fontWeight:600,color:'var(--t3)',marginBottom:6}}>FILLET WELD TEST</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
                {[['fillet_appearance','APPEARANCE',['GOOD','FAIR','POOR']],['fillet_leg_size','FILLET LEG SIZE',null],['fracture_test','FRACTURE TEST',['','ACCEPTED','REJECTED','N/A']],['macroetch_test','MACROETCH TEST',['','ACCEPTED','REJECTED','N/A']]].map(([fld,lbl,opts])=>(
                  <div key={fld} className="fg">
                    <label>{lbl}</label>
                    {opts?<select value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}>{opts.map(o=><option key={o}>{o}</option>)}</select>
                      :<input value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}/>}
                  </div>
                ))}
              </div>
            </div>
          )}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div className="fg"><label>RT 결과</label><select value={form.rt_result||''} onChange={e=>sf({rt_result:e.target.value})}><option>N/A</option><option>ACCEPTED</option><option>REJECTED</option></select></div>
            <div className="fg"><label>UT 결과</label><select value={form.ut_result||''} onChange={e=>sf({ut_result:e.target.value})}><option>N/A</option><option>ACCEPTED</option><option>REJECTED</option></select></div>
          </div>
        </div>
      </div>

      {/* ④ Macro-Etch & Break */}
      <div className="card" style={{marginBottom:10}}>
        <div className="card-hd"><span className="card-title">④ Macro-Etch & Break Test <span style={{fontSize:11,color:'var(--green)',fontWeight:400}}>— 기본정보 자동 반영</span></span></div>
        <div className="card-bd">
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            {[['◎ Macro-Etch Test','macro_test_date','macro_report_no','macro_result','macroP','macro_photos'],
              ['◎ Break Test','break_test_date','break_report_no','break_result','breakP','test_photos']].map(([title,dFld,nFld,rFld,pid,pFld])=>(
              <div key={title}>

function WRenewalMgr({renewals,setRenewals,wpqrList,setWpqrList,welders,ce,toast}){
  const[showM,setShowM]=useState(false);
  const year=new Date().getFullYear();
  const[form,setForm]=useState({welder_id:'',wpqr_id:'',renewal_period:`${year}-H1`,renewal_date:new Date().toISOString().split('T')[0],ndt_method:'RT',ndt_result:'',remarks:''});
  const sf=p=>setForm(v=>({...v,...p}));
  const h1=renewals.filter(r=>r.renewal_period===`${year}-H1`);
  const h2=renewals.filter(r=>r.renewal_period===`${year}-H2`);
  const allQual=wpqrList.filter(w=>w.overall_result==='PASS'&&w.approved);
  const welderQuals=form.welder_id?wpqrList.filter(w=>w.welder_id===form.welder_id&&w.overall_result==='PASS'&&w.approved):[];
  function save(){
    if(!form.welder_id||!form.wpqr_id||!form.ndt_result){toast('필수 항목을 입력하세요.','error');return;}
    const res=form.ndt_result==='PASS'?'RENEWED':'EXPIRED';
    setRenewals(l=>[...l,{...form,id:'wr'+Date.now(),result:res}]);
    if(form.ndt_result==='FAIL') setWpqrList(l=>l.map(w=>w.id===form.wpqr_id?{...w,status:'EXPIRED',approved:false}:w));
    else setWpqrList(l=>l.map(w=>{if(w.id!==form.wpqr_id)return w;const d=new Date(w.cert_expiry_date);d.setMonth(d.getMonth()+6);return{...w,cert_expiry_date:d.toISOString().split('T')[0]};}));
    toast(res==='RENEWED'?'갱신 완료':'자격 만료 처리','info');
    setShowM(false);
  }
  return(
    <div>
      <div className="info-box blue" style={{marginBottom:12}}>📅 매년 <b>6월(상반기)</b>·<b>12월(하반기)</b> 비파괴검사로 갱신. 미갱신 시 자격 자동 만료.</div>
      {ce&&<div style={{display:'flex',justifyContent:'flex-end',marginBottom:12}}><button className="btn btn-p" onClick={()=>setShowM(true)}>+ 갱신 결과 입력</button></div>}
      <div className="g2" style={{marginBottom:14}}>
        {[{period:`${year}-H1`,label:`🌸 ${year}년 상반기 (6월)`,list:h1},{period:`${year}-H2`,label:`🍂 ${year}년 하반기 (12월)`,list:h2}].map(({period,label,list})=>(
          <div key={period} className="card">
            <div className="card-hd"><span className="card-title">{label}</span><span className="b ba">{allQual.length-list.length}명 미완료</span></div>
            <div className="card-bd">{allQual.map(w=>{
              const wdr=welders.find(ww=>ww.id===w.welder_id)||{name_kr:'-'};
              const rn=list.find(r=>r.wpqr_id===w.id);
              return(<div key={w.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 0',borderBottom:'1px solid var(--bdr2)'}}>
                <span style={{fontWeight:600,fontSize:12}}>{wdr.name_kr} <span style={{color:'var(--t3)',fontSize:10}}>{w.template_name||w.process}</span></span>
                {rn?<span className={`b ${rn.result==='RENEWED'?'bg':'br'}`}>{rn.result==='RENEWED'?'갱신완료':'만료'}</span>:<span className="b ba">미완료</span>}
              </div>);
            })}</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="card-hd"><span className="card-title">🔄 갱신 이력</span></div>
        <div className="tw"><table>
          <thead><tr><th>용접사</th><th>갱신기간</th><th>갱신일</th><th>NDT</th><th>결과</th><th>처리</th></tr></thead>
          <tbody>{[...renewals].reverse().map(r=>{
            const wdr=welders.find(w=>w.id===r.welder_id)||{name_kr:'-'};
            return(<tr key={r.id}><td style={{fontWeight:600}}>{wdr.name_kr}</td><td><span className="b bp">{r.renewal_period}</span></td><td style={{fontSize:11}}>{r.renewal_date}</td><td>{r.ndt_method}</td><td><span className={`b ${r.ndt_result==='PASS'?'bg':'br'}`}>{r.ndt_result}</span></td><td><span className={`b ${r.result==='RENEWED'?'bg':'br'}`}>{r.result==='RENEWED'?'갱신':'만료'}</span></td></tr>);
          })}</tbody>
        </table></div>
      </div>
      {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
        <div className="modal" style={{maxWidth:520}}>
          <div className="mhd"><span className="mtitle">🔄 갱신 결과 입력</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div>
          <div className="mbd">
            <div className="info-box amber" style={{marginBottom:12}}>⚠ NDT FAIL 시 자격 즉시 만료 → 명단·스티커 자동 제거</div>
            <div className="fgg">
              <div className="fg"><label>용접사 *</label><select value={form.welder_id} onChange={e=>sf({welder_id:e.target.value,wpqr_id:''})}><option value="">선택</option>{welders.map(w=><option key={w.id} value={w.id}>{w.name_kr} ({w.welder_no})</option>)}</select></div>
              <div className="fg"><label>대상 자격 *</label><select value={form.wpqr_id} onChange={e=>sf({wpqr_id:e.target.value})}><option value="">선택</option>{welderQuals.map(w=><option key={w.id} value={w.id}>{w.template_name||w.process} / {w.position} ({w.cert_no})</option>)}</select></div>
              <div className="fg"><label>갱신 기간 *</label><select value={form.renewal_period} onChange={e=>sf({renewal_period:e.target.value})}><option value={`${year}-H1`}>{year}년 상반기</option><option value={`${year}-H2`}>{year}년 하반기</option></select></div>
              <div className="fg"><label>갱신일 *</label><input type="date" value={form.renewal_date} onChange={e=>sf({renewal_date:e.target.value})}/></div>
              <div className="fg"><label>NDT 방법</label><select value={form.ndt_method} onChange={e=>sf({ndt_method:e.target.value})}><option>RT</option><option>UT</option><option>MT</option><option>PT</option><option>작업실적</option></select></div>
              <div className="fg"><label>NDT 결과 *</label><select value={form.ndt_result} onChange={e=>sf({ndt_result:e.target.value})}><option value="">선택</option><option>PASS</option><option>FAIL</option></select></div>
              <div className="fg full"><label>비고</label><input value={form.remarks||''} onChange={e=>sf({remarks:e.target.value})}/></div>
            </div>
          </div>
          <div className="mft">
            <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
            <button className={`btn ${form.ndt_result==='FAIL'?'btn-d':'btn-g'}`} onClick={save}>{form.ndt_result==='FAIL'?'❌ 만료 처리':'✅ 갱신 완료'}</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
