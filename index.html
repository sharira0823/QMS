<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ── Supabase 연결 설정 ── */
let _sb=null;
const getSB=()=>{const u=localStorage.getItem("supa_url"),k=localStorage.getItem("supa_key");if(!u||!k)return null;if(!_sb)_sb=window.supabase.createClient(u,k);return _sb;};

/* ── 유틸리티 함수 ── */
const fmt=n=>n==null?"-":Number(n).toLocaleString("ko-KR");
const fmtD=d=>d?String(d).substring(0,10):"-";
const MO=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const TC={가공:"ba",취부:"bp",용접:"br",치수:"bb",도장:"ba",기타:"bx",포장:"bx",절단:"bc"};
const DC={Return:"bb","Owner Rework":"ba","Site Rework":"ba",Discard:"br"};
const TYPES=["가공","취부","용접","치수","도장","기타","포장","절단"];
const DISPS=["Return","Owner Rework","Site Rework","Discard"];

const isoW=ds=>{if(!ds)return"";const d=new Date(ds);if(isNaN(d))return"";const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/86400000+1)/7);};
const getMo=ds=>{if(!ds)return null;const d=new Date(ds);return isNaN(d)?null:d.getMonth()+1;};
const add90=ds=>{if(!ds)return"";try{const d=new Date(ds);d.setDate(d.getDate()+90);return d.toISOString().slice(0,10);}catch{return "";}};

/* 이미지 및 파일 업로드 유틸 */
const compImg=f=>new Promise(res=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{const M=600;let w=img.width,h=img.height;if(w>M||h>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);res({name:f.name,size:f.size,data:cv.toDataURL("image/jpeg",.75),w,h});};img.src=e.target.result;};rd.readAsDataURL(f);});
const attFile=f=>new Promise(res=>{const ext=f.name.split(".").pop().toLowerCase();if(["jpg","jpeg","png","gif","webp"].includes(ext)){compImg(f).then(res);}else{const rd=new FileReader();rd.onload=e=>res({name:f.name,size:f.size,data:e.target.result,fileType:"doc"});rd.readAsDataURL(f);}});
const FICONS={pdf:"📄",doc:"📝",docx:"📝",xls:"📊",xlsx:"📊",hwp:"📝",zip:"🗜"};
const gIcon=n=>FICONS[n?.split(".").pop()?.toLowerCase()]||"📁";
const fSz=b=>b<1024?b+"B":b<1048576?(b/1024).toFixed(1)+"KB":(b/1048576).toFixed(1)+"MB";

/* ── useDrag 커스텀 훅 (DB 실시간 연동 및 동기화 완벽 수정) ── */
function useDrag(items,setItems,ce,toast){
  const di=useRef(null),oi=useRef(null);
  const start=(e,i)=>{if(!ce)return;di.current=i;e.dataTransfer.effectAllowed="move";e.currentTarget.classList.add("drag-on");};
  
  const end=async(e)=>{
    e.currentTarget.classList.remove("drag-on");
    document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));
    if(di.current===null||oi.current===null||di.current===oi.current){di.current=null;oi.current=null;return;}
    
    const arr=[...items];
    const[m]=arr.splice(di.current,1);
    arr.splice(oi.current,0,m);
    
    // 순서 정렬 가공 (seq_no와 sort_order 값을 완벽 매칭 동기화)
    const updatedArr=arr.map((x,i)=>({...x,seq_no:i+1,sort_order:i+1}));
    setItems(updatedArr);
    
    // Supabase DB에 행 순서 고정 업데이트 처리
    const sb=getSB();
    if(sb){
      try{
        const rowsToUpdate=updatedArr
          .filter(x=>!String(x.id).startsWith("tmp_"))
          .map(x=>({
            id:x.id,
            seq_no:x.seq_no,
            sort_order:x.sort_order,
            issued_date:x.issued_date,
            nci_description:x.nci_description
          }));

        if(rowsToUpdate.length>0){
          const{error}=await sb.from("nci_list").upsert(rowsToUpdate,{onConflict:'id'});
          if(error){
            console.error(error);
            if(toast)toast("정렬 DB 순서 동기화 실패","error");
          }else{
            if(toast)toast("정렬 순서가 보존 및 업데이트되었습니다.","success");
          }
        }
      }catch(err){console.error(err);}
    }
    di.current=null;oi.current=null;
  };
  
  const over=(e,i)=>{e.preventDefault();if(!ce||di.current===null)return;oi.current=i;document.querySelectorAll(".drag-ov,.drag-bw").forEach(r=>r.classList.remove("drag-ov","drag-bw"));if(i!==di.current)e.currentTarget.classList.add(i>di.current?"drag-bw":"drag-ov");};
  const leave=e=>e.currentTarget.classList.remove("drag-ov","drag-bw");
  return{start,end,over,leave};
}

/* ── 라이트박스 컴포넌트 ── */
function Lightbox({photos,si=0,onClose}){
  const[i,setI]=useState(si);
  useEffect(()=>{const fn=e=>{if(e.key==="ArrowLeft")setI(v=>Math.max(0,v-1));if(e.key==="ArrowRight")setI(v=>Math.min(photos.length-1,v+1));if(e.key==="Escape")onClose();};window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);},[]);
  if(!photos.length)return null;const c=photos[i];
  return(<div className="lb" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <button className="lb-close" onClick={onClose}>✕</button>
    <img src={c.data} alt={c.name}/>
    <div className="lb-info">{c.name} · {fSz(c.size)}</div>
    <div className="lb-bar">
      <button className="lb-btn" onClick={()=>setI(v=>Math.max(0,v-1))} disabled={i===0}>‹</button>
      <span style={{fontSize:12,color:"var(--t3)"}}>{i+1}/{photos.length}</span>
      <button className="lb-btn" onClick={()=>setI(v=>Math.min(photos.length-1,v+1))} disabled={i===photos.length-1}>›</button>
      <a className="lb-btn" href={c.data} download={c.name}>⬇</a>
    </div>
  </div>);
}

/* ── 파일 첨부 컴포넌트 ── */
function Attachments({files=[],onChange,canEdit=true,label="사진/문서"}){
  const[drag,setDrag]=useState(false);const[lb,setLb]=useState(null);const[tab,setTab]=useState("all");const ref=useRef();
  const isImg=f=>["jpg","jpeg","png","gif","webp"].includes(f.name?.split(".").pop()?.toLowerCase());
  const add=async raw=>{const a=Array.from(raw);if(!a.length)return;const d=await Promise.all(a.map(attFile));onChange([...files,...d]);};
  const rm=(i,e)=>{e.stopPropagation();onChange(files.filter((_,j)=>j!==i));};
  const imgs=files.map((f,i)=>({f,i})).filter(({f})=>isImg(f));
  const docs=files.map((f,i)=>({f,i})).filter(({f})=>!isImg(f));
  return(<div>
    <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5}}>
      <span style={{fontSize:12,color:"var(--t3)",fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{label}</span>
      {files.length>0&&<span style={{fontSize:12,color:"var(--t3)"}}>🖼{imgs.length} 📄{docs.length}</span>}
    </div>
    {canEdit&&<div className={`pzone${drag?" dov":""}`} onClick={()=>ref.current.click()}
      onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);add(e.dataTransfer.files);}}>
      <div style={{fontSize:17,marginBottom:2}}>📎</div>
      <div style={{fontSize:12,fontWeight:600}}>클릭 또는 드래그 업로드</div>
      <input ref={ref} type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.hwp,.txt,.zip" multiple style={{display:"none"}} onChange={e=>add(e.target.files)}/>
    </div>}
    {files.length>0&&<React.Fragment>
      <div className="atabs" style={{marginTop:7}}>
        {[["all","전체"],["img","사진🖼"],["doc","문서📄"]].map(([k,l])=>
          <div key={k} className={`atab ${tab===k?"act toggle":""}`} onClick={()=>setTab(k)}>{l}</div>)}
      </div>
      {(tab==="all"||tab==="img")&&imgs.length>0&&<div className="pgrid">
        {imgs.map(({f,i})=><div key={i} className="pt" onClick={()=>setLb(imgs.findIndex(x=>x.i===i))}>
          <img src={f.data} alt={f.name}/><div className="plbl">{f.name}</div>
          {canEdit&&<button className="pdel" onClick={e=>rm(i,e)}>✕</button>}
        </div>)}
      </div>}
      {(tab==="all"||tab==="doc")&&docs.length>0&&<div className="doc-grid" style={{marginTop:tab==="all"&&imgs.length?7:0}}>
        {docs.map(({f,i})=><div key={i} className="doc-card">
          <div style={{fontSize:20,marginBottom:2}}>{gIcon(f.name)}</div>
          <div style={{fontSize:11,color:"var(--t2)",wordBreak:"break-all",lineHeight:1.2}}>{f.name}</div>
          <div style={{display:"flex",gap:3,marginTop:4,justifyContent:"center"}}>
            <a className="btn btn-s btn-sm" href={f.data} download={f.name}>⬇</a>
            {canEdit&&<button style={{fontSize:11,padding:"1px 5px",borderRadius:3,border:"1px solid rgba(255,61,61,.3)",background:"rgba(255,61,61,.08)",color:"var(--red)",cursor:"pointer"}} onClick={e=>rm(i,e)}>✕</button>}
          </div>
        </div>)}
      </div>}
    </React.Fragment>}
    {lb!==null&&<Lightbox photos={imgs.map(({f})=>f)} si={lb} onClose={()=>setLb(null)}/>}
  </div>);
}

function PhBadge({item,fields,onClick}){
  const t=fields.reduce((s,f)=>s+(item[f]?.length||0),0);
  if(!t)return<span style={{fontSize:12,color:"var(--t3)"}}>—</span>;
  return<span className="phc" onClick={e=>{e.stopPropagation();onClick();}}>📎{t}</span>;
}

/* ── Toast 알림 ── */
function Toast({toasts}){return<div className="twrap">{toasts.map(t=><div key={t.id} className={`toast ${t.type==="success"?"s":t.type==="error"?"e":"i"}`}><span>{t.type==="success"?"✓":t.type==="error"?"✕":"ℹ"}</span><span>{t.msg}</span></div>)}</div>;}

/* ── 부적합 및 시정조치 NCI 페이지 컴포넌트 ── */
function NCIPage({data,setData,role,toast,year}){
  const[srch,setSrch]=useState("");const[fT,setFT]=useState("");const[fP,setFP]=useState("");const[fC,setFC]=useState("");
  const[showM,setShowM]=useState(false);const[edit,setEdit]=useState(null);const[detail,setDetail]=useState(null);
  const ce=role==="admin"||role==="manager";
  
  // useDrag 선언부에 toast 전송 처리
  const drag=useDrag(data,setData,ce,toast);
  
  const mkE=()=>({year,seq_no:data.length+1,sort_order:data.length+1,internal_ncr_no:"",owner_ncr_no:"",week_no:"",issued_date:new Date().toISOString().slice(0,10),due_date:"",part_name:"",part_no:"",item_category:"fab",qty:1,type:"용접",caused_by:"",disposition:"Return",effectiveness_date:"",effectiveness_result:"",remark:"",photo_urls:[],doc_urls:[]});
  const[form,setForm]=useState(mkE());
  const sf=p=>setForm(v=>({...v,...p}));
  
  const filtered=useMemo(()=>data.filter(n=>{
    const q=srch.toLowerCase();
    return(!srch||[n.internal_ncr_no,n.nci_description,n.caused_by,n.part_name].some(v=>v?.toLowerCase().includes(q)))
      &&(!fT||n.type===fT)&&(!fP||n.part_name===fP)&&(!fC||n.caused_by===fC);
  }),[data,srch,fT,fP,fC]);
  
  const parts=[...new Set(data.map(n=>n.part_name).filter(Boolean))];
  const types=[...new Set(data.map(n=>n.type).filter(Boolean))];
  const causeds=[...new Set(data.map(n=>n.caused_by).filter(Boolean))];
  
  const openAdd=()=>{setEdit(null);setForm(mkE());setShowM(true);};
  const openEdit=n=>{setEdit(n);setForm({...n,week_no:isoW(n.issued_date),due_date:add90(n.issued_date),photo_urls:[...(n.photo_urls||[])],doc_urls:[...(n.doc_urls||[])]});setShowM(true);};
  
  const save=async()=>{
    if(!form.issued_date||!form.nci_description){toast("발행일과 부적합 내용은 필수입니다.","error");return;}
    const w=isoW(form.issued_date);
    const ncr=form.internal_ncr_no||"NCI-"+form.issued_date.replace(/-/g,"").slice(2,8)+"-"+String(form.seq_no||1).padStart(2,"0");
    const item={...form,week_no:w,year,internal_ncr_no:ncr,due_date:add90(form.issued_date)};
    
    const sb=getSB();
    if(sb){
      const row={
        issued_date:      item.issued_date,
        internal_ncr_no:  item.internal_ncr_no||null,
        owner_ncr_no:     item.owner_ncr_no||null,
        part_name:        item.part_name||null,
        part_no:          item.part_no||null,
        item_category:    item.item_category||"fab",
        nci_description:  item.nci_description||null,
        rca:              item.rca||null,
        corrective_action:item.corrective_action||null,
        car_no:           item.car_no||null,
        qty:              Number(item.qty)||1,
        type:             item.type||null,
        caused_by:        item.caused_by||null,
        disposition:      item.disposition||"Return",
        effectiveness_date:  item.effectiveness_date||null,
        effectiveness_result:item.effectiveness_result||null,
        remark:           item.remark||null,
        seq_no:           Number(item.seq_no||1),
        sort_order:       Number(item.sort_order||item.seq_no||1),
        photo_urls:       item.photo_urls||[],
        doc_urls:         item.doc_urls||[]
      };
      if(edit&&edit.id&&!String(edit.id).startsWith("tmp_")){
        const{error}=await sb.from("nci_list").update(row).eq("id",edit.id);
        if(error){toast("저장 오류: "+error.message,"error");return;}
      }else{
        const{data:resD,error}=await sb.from("nci_list").insert(row).select("id").single();
        if(error){toast("저장 오류: "+error.message,"error");return;}
        if(resD)item.id=resD.id;
      }
    }
    if(edit)setData(p=>p.map(n=>n.id===edit.id?{...n,...item}:n));
    else setData(p=>[...p,{...item,id:item.id||"tmp_"+Date.now()}]);
    toast(edit?"수정 완료":"등록 완료","success");setShowM(false);
  };

  const del=async id=>{
    if(!confirm("삭제하시겠습니까?"))return;
    const sb=getSB();
    if(sb&&!String(id).startsWith("tmp_")){
      const{error}=await sb.from("nci_list").delete().eq("id",id);
      if(error){toast("삭제 오류: "+error.message,"error");return;}
    }
    setData(p=>p.filter(n=>n.id!==id));toast("삭제 완료","info");
  };

  const xlDown=()=>{
    const ws=XLSX.utils.json_to_sheet(filtered.map(n=>({"No.":n.seq_no,"Internal NCR No.":n.internal_ncr_no,"Owner NCR No.":n.owner_ncr_no,"W":n.week_no,"Issued Date":n.issued_date,"Part Name(모델)":n.part_name,"Part No.":n.part_no,"NCI Description":n.nci_description,"QTY":n.qty,"Type":n.type,"Caused By":n.caused_by,"Disposition":n.disposition,"Due Date":n.due_date})));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"NCI");XLSX.writeFile(wb,`NCI_CAR_List_${year}.xlsx`);toast("다운로드 완료","success");
  };

  return(<div>
    <div className="fbar">
      <input style={{flex:1,maxWidth:250}} placeholder="🔍 NCR번호·내용·귀책처·모델" value={srch} onChange={e=>setSrch(e.target.value)}/>
      <select style={{width:100}} value={fT} onChange={e=>setFT(e.target.value)}><option value="">전체 유형</option>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
      <select style={{width:120}} value={fP} onChange={e=>setFP(e.target.value)}><option value="">전체 모델</option>{parts.map(p=><option key={p}>{p}</option>)}</select>
      <select style={{width:100}} value={fC} onChange={e=>setFC(e.target.value)}><option value="">전체 귀책</option>{causeds.map(c=><option key={c}>{c}</option>)}</select>
      <span className="hint" style={{marginLeft:"auto"}}>⠿ 드래그 순서변경</span>
      {ce&&<button className="btn btn-p" onClick={openAdd}>+ NCI 등록</button>}
      <button className="btn btn-s" onClick={xlDown}>⬇ 엑셀</button>
    </div>
    <div className="card">
      <div className="card-hd"><span className="card-title">NCI & CAR List ({year}년)</span>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          <span className="b bc">{filtered.length}건</span>
          <span className="b ba">{filtered.reduce((s,n)=>s+(n.qty||0),0)}대</span>
        </div>
      </div>
      <div className="tw"><table>
        <thead><tr>
          {ce&&<th style={{width:20}}>⇅</th>}
          <th>No.</th><th>Internal NCR No.</th><th>Owner NCR No.</th><th>W</th>
          <th>Issued Date</th><th>구분</th><th>Part Name(모델)</th><th>Part No.</th>
          <th>NCI Description</th><th>QTY</th><th>Type</th><th>Caused By</th>
          <th>Disposition</th><th>+90일</th><th>첨부</th>{ce&&<th>관리</th>}
        </tr></thead>
        <tbody>{filtered.map((n,idx)=>(
          <tr key={n.id} draggable={ce} 
            onDragStart={e=>drag.start(e,data.findIndex(x=>x.id===n.id))} 
            onDragEnd={drag.end} 
            onDragOver={e=>drag.over(e,data.findIndex(x=>x.id===n.id))} 
            onDragLeave={drag.leave}
            onClick={()=>setDetail(n)} style={{cursor:"pointer"}}>
            {ce&&<td className="dh" onClick={e=>e.stopPropagation()}>⠿</td>}
            
            {/* 고정 인덱스가 아닌, 데이터 순위 연동 seq_no 실시간 바인딩 출력 보완 */}
            <td className="mono">{n.seq_no || (idx + 1)}</td>
            
            <td className="mono" style={{color:"var(--cyan)",fontWeight:"bold"}}>{n.internal_ncr_no}</td>
            <td className="mono">{n.owner_ncr_no||"—"}</td>
            <td className="mono">{n.week_no||isoW(n.issued_date)}</td>
            <td>{fmtD(n.issued_date)}</td>
            <td><span className={`b ${n.item_category==="fab"?"bc":"bp"}`}>{n.item_category==="fab"?"제작":"조립"}</span></td>
            <td style={{fontWeight:600}}>{n.part_name||"—"}</td>
            <td style={{maxWidth:200,overflow:"hidden",textOverflow:"ellipsis"}}>{n.nci_description}</td>
            <td className="mono">{fmt(n.qty)}</td>
            <td><span className={`b ${TC[n.type]||"bx"}`}>{n.type}</span></td>
            <td>{n.caused_by||"—"}</td>
            <td><span className={`b ${DC[n.disposition]||"bx"}`}>{n.disposition}</span></td>
            <td className="mono" style={{color:"var(--amber)"}}>{n.due_date||add90(n.issued_date)}</td>
            <td onClick={e=>e.stopPropagation()}><PhBadge item={n} fields={["photo_urls","doc_urls"]} onClick={()=>setDetail(n)}/></td>
            {ce&&<td onClick={e=>e.stopPropagation()}>
              <button className="btn btn-s btn-sm" style={{marginRight:3}} onClick={()=>openEdit(n)}>수정</button>
              <button className="btn btn-d btn-sm" onClick={()=>del(n.id)}>삭제</button>
            </td>}
          </tr>
        ))}</tbody>
      </table></div>
    </div>

    {/* 등록/수정 모달창 */}
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}><div className="modal">
      <div className="mhd"><span className="mtitle">{edit?"부적합 보고서 수정":"부적합 보고서 등록"}</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div>
      <div className="mbd">
        <div className="g2 mb4">
          <div className="fg"><label>발행일자 *</label><input type="date" value={form.issued_date} onChange={e=>sf({issued_date:e.target.value})}/></div>
          <div className="fg"><label>NCR 번호</label><input type="text" readOnly value={form.internal_ncr_no} placeholder="자동 생성"/></div>
          <div className="fg"><label>고객사 NCR 번호</label><input type="text" value={form.owner_ncr_no} onChange={e=>sf({owner_ncr_no:e.target.value})}/></div>
          <div className="fg"><label>품목 구분</label><select value={form.item_category} onChange={e=>sf({item_category:e.target.value})}><option value="fab">제작 (Fab)</option><option value="assembly">조립</option></select></div>
          <div className="fg"><label>모델명</label><input type="text" value={form.part_name} onChange={e=>sf({part_name:e.target.value})}/></div>
          <div className="fg"><label>도번/품번</label><input type="text" value={form.part_no} onChange={e=>sf({part_no:e.target.value})}/></div>
          <div className="fg"><label>불량 수량</label><input type="number" value={form.qty} onChange={e=>sf({qty:e.target.value})}/></div>
          <div className="fg"><label>결함 유형</label><select value={form.type} onChange={e=>sf({type:e.target.value})}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
          <div className="fg"><label>귀책처</label><input type="text" value={form.caused_by} onChange={e=>sf({caused_by:e.target.value})}/></div>
          <div className="fg"><label>처리 방안</label><select value={form.disposition} onChange={e=>sf({disposition:e.target.value})}>{DISPS.map(d=><option key={d}>{d}</option>)}</select></div>
        </div>
        <div className="fg mb3"><label>부적합 내용 *</label><textarea value={form.nci_description} onChange={e=>sf({nci_description:e.target.value})}/></div>
        <div className="fg mb3"><label>원인 분석 (RCA)</label><textarea value={form.rca} onChange={e=>sf({rca:e.target.value})}/></div>
        <div className="fg mb4"><label>시정 조치 계획</label><textarea value={form.corrective_action} onChange={e=>sf({corrective_action:e.target.value})}/></div>
        <div className="g2 mb4">
          <div className="fg"><label>CAR No</label><input type="text" value={form.car_no} onChange={e=>sf({car_no:e.target.value})}/></div>
          <div className="fg"><label>유효성 평가일</label><input type="date" value={form.effectiveness_date} onChange={e=>sf({effectiveness_date:e.target.value})}/></div>
          <div className="fg full"><label>유효성 결과</label><input type="text" value={form.effectiveness_result} onChange={e=>sf({effectiveness_result:e.target.value})}/></div>
          <div className="fg full"><label>비고</label><input type="text" value={form.remark} onChange={e=>sf({remark:e.target.value})}/></div>
        </div>
        <div className="psec">
          <Attachments files={[...(form.photo_urls||[]),...(form.doc_urls||[])]} onChange={all=>{
            const imgs=all.filter(f=>!f.fileType);const docs=all.filter(f=>f.fileType==="doc");
            sf({photo_urls:imgs,doc_urls:docs});
          }} canEdit={true}/>
        </div>
      </div>
      <div className="mft"><button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button><button className="btn btn-p" onClick={save}>저장</button></div>
    </div></div>}

    {/* 상세 팝업창 */}
    {detail&&<div className="ov" onClick={()=>setDetail(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="mhd"><span className="mtitle" style={{color:"var(--cyan)"}}>📄 상세 정보 [{detail.internal_ncr_no}]</span><button className="xb" onClick={()=>setDetail(null)}>✕</button></div>
      <div className="mbd">
        <div className="info-box blue mb4" style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          <div><strong>발행일자:</strong> {detail.issued_date} (W{detail.week_no})</div>
          <div><strong>고객 NCR:</strong> {detail.owner_ncr_no||"—"}</div>
          <div><strong>품목/유형:</strong> {detail.item_category==="fab"?"제작":"조립"} / {detail.type}</div>
          <div><strong>모델명:</strong> {detail.part_name||"—"}</div>
          <div><strong>수량/귀책:</strong> {detail.qty} EA / {detail.caused_by||"—"}</div>
          <div><strong>조치/Due:</strong> {detail.disposition} / {detail.due_date||add90(detail.issued_date)}</div>
        </div>
        <div className="mb4"><h4 className="psec-lbl">부적합 결함 내용</h4><div className="info-box" style={{background:"var(--bg3)"}}>{detail.nci_description}</div></div>
        <div className="mb4"><h4 className="psec-lbl">원인 분석 (RCA)</h4><div className="info-box" style={{background:"var(--bg3)"}}>{detail.rca||"원인 분석 내용 없음"}</div></div>
        <div className="mb4"><h4 className="psec-lbl">시정 조치 계획</h4><div className="info-box green">{detail.corrective_action||"조치 계획 수립중"}</div></div>
        <div className="psec"><Attachments files={[...(detail.photo_urls||[]),...(detail.doc_urls||[])]} canEdit={false}/></div>
      </div>
      <div className="mft"><button className="btn btn-s" onClick={()=>setDetail(null)}>닫기</button></div>
    </div></div>}
  </div>);
}

/* ── 메인 App 레이아웃 ── */
function App(){
  const[user,setUser]=useState(null);
  const[year,setYear]=useState(2026);
  const[menu,setMenu]=useState("nci");
  const[data,setData]=useState([]);
  const[toasts,setToasts]=useState([]);

  const toast=useCallback((msg,type="success")=>{
    const id=Date.now();setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3000);
  },[]);

  // 데이터 로드 시 sort_order 명시적 정렬 체계 구현 보완
  useEffect(()=>{
    const sb=getSB();
    if(sb){
      sb.from("nci_list").select("*").order("sort_order",{ascending:true})
        .then(({data:resD,error})=>{
          if(!error&&resD){
            const sorted=resD.map((x,i)=>({
              ...x,
              seq_no:x.seq_no||(i+1),
              sort_order:x.sort_order||(i+1)
            }));
            setData(sorted);
          }
        });
    }else{
      setData([
        {id:"1",year:2026,seq_no:1,sort_order:1,internal_ncr_no:"NCI-260501-01",owner_ncr_no:"OWN-26-009",week_no:"18",issued_date:"2026-05-01",due_date:"2026-07-30",part_name:"메인 프레임 모듈",part_no:"DRW-A-001",item_category: "fab",qty:2,type:"용접",caused_by:"용접반 A조",disposition:"Owner Rework",nci_description:"CO2 용접 비드 하부 언더컷 및 슬래그 혼입 발생",rca:"가스 유량 부족",corrective_action:"토치 노즐 교체",photo_urls:[],doc_urls:[]},
        {id:"2",year:2026,seq_no:2,sort_order:2,internal_ncr_no:"NCI-260515-02",owner_ncr_no:"",week_no:"20",issued_date:"2026-05-15",due_date:"2026-08-13",part_name:"지지용 각관 브래킷",part_no:"DRW-B-042",item_category: "fab",qty:15,type:"치수",caused_by:"절단실",disposition:"Return",nci_description:"사각 파이프 절단면 직각도 공차 초과 (+2.5mm)",rca:"고정 유격 발생",corrective_action:"가이드 지그 보정",photo_urls:[],doc_urls:[]}
      ]);
    }
  },[year]);

  if(!user)return<Login onLogin={setUser}/>;

  return(<div className="layout">
    <Toast toasts={toasts}/>
    <aside className="sidebar">
      <div className="logo-wrap">
        <div className="logo">QMS v2</div>
        <div className="logo-sub">QUALITY MANAGEMENT SYSTEM</div>
      </div>
      <div className="yr-panel">
        <div className="yr-lbl">작업 년도 선택</div>
        {[2025,2026].map(y=>(
          <div key={y} className={`yt ${year===y?"act":""}`} onClick={()=>setYear(y)}>
            <span>{y}년도 데이터</span><span className="yt-c">{data.filter(x=>new Date(x.issued_date).getFullYear()===y).length}</span>
          </div>
        ))}
      </div>
      <nav className="nav-sec">
        <div className="nav-lbl">메뉴</div>
        <div className={`ni ${menu==="nci"?"act":""}`} onClick={() => setMenu("nci")}>⚠️ 부적합 / CAR 관리</div>
      </nav>
      <footer className="sb-foot">
        <div className="ubadge">
          <div className="uav">{user.name[0]}</div>
          <div style={{flex:1}}>
            <div className="uname">{user.name}</div>
            <div className="udept">{user.dept}</div>
          </div>
          <span className={`rb ${user.role}`}>{user.role.toUpperCase()}</span>
        </div>
      </footer>
    </aside>

    <main className="main">
      <header className="topbar">
        <div className="pg-title">품질 관리 포털 포털자 포털 포털</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <span className="yr-badge">{year}년 활성화</span>
          <span className="conn-ok">Supabase Connected</span>
        </div>
      </header>
      <div className="content">
        <div className="stats">
          <div className="sc cb"><div className="sc-lbl">총 부적합 발견 건수</div><div className="sc-val">{data.length} 건</div></div>
          <div className="sc cr"><div className="sc-lbl">반품 / 폐기 (Return / Discard)</div><div className="sc-val">{data.filter(x=>["Return","Discard"].includes(x.disposition)).length} 건</div></div>
          <div className="sc cg"><div className="sc-lbl">종합 조치 완료율</div><div className="sc-val">{data.length?Math.round((data.filter(x=>x.corrective_action).length/data.length)*100):0}%</div></div>
        </div>
        {menu==="nci"&&<NCIPage data={data} setData={setData} role={user.role} toast={toast} year={year}/>}
      </div>
    </main>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
