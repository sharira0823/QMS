/* ══ 👷 용접사 기본정보 — 사진 포함, 번호 수동/자동 ══ */
function WWelderList({welders,setWelders,wpqrList,ce,toast}){
  const[showM,setShowM]=useState(false);
  const[edit,setEdit]=useState(null);
  const[dupCheck,setDupCheck]=useState(null);
  const mkF=()=>({welder_no:'',name_kr:'',name_en:'',birth_date:'',department:'',job_title:'',hire_date:'',photo:null,manual_no:false});
  const[form,setForm]=useState(mkF());
  const sf=p=>setForm(v=>({...v,...p}));

  function nextAutoNo(){
    const nums=welders.map(w=>{const m=w.welder_no.match(/TCW-(\d+)/);return m?parseInt(m[1]):0;});
    const next=nums.length>0?Math.max(...nums)+1:1;
    return 'TCW-'+String(next).padStart(3,'0');
  }
  function openAdd(){setEdit(null);setDupCheck(null);setForm({...mkF(),welder_no:nextAutoNo()});setShowM(true);}
  function openEdit(w){setEdit(w);setDupCheck(null);setForm({...w,manual_no:true});setShowM(true);}

  function handleBirth(v){
    const masked=wMaskBirth(v);
    sf({birth_date:masked});
    if(masked.length>=7&&!edit){
      const front=masked.slice(0,7);
      const found=welders.find(w=>w.birth_date&&w.birth_date.slice(0,7)===front);
      if(found){setDupCheck({found:true,welder:found});sf({birth_date:masked,welder_no:found.welder_no});}
      else{setDupCheck({found:false});if(!form.manual_no)sf({birth_date:masked,welder_no:nextAutoNo()});else sf({birth_date:masked});}
    }
  }

  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=ev=>sf({photo:ev.target.result});
    rd.readAsDataURL(file);
  }

  function save(){
    if(!form.name_kr||!form.birth_date){toast('이름과 주민번호를 입력하세요.','error');return;}
    if(!form.welder_no){toast('용접사 번호를 확인하세요.','error');return;}
    if(!edit&&welders.find(w=>w.welder_no===form.welder_no)){toast(`번호 ${form.welder_no}는 이미 사용 중입니다.`,'error');return;}
    const data={...form,name_en:form.name_en||krToEn(form.name_kr)};
    if(edit)setWelders(l=>l.map(w=>w.id===edit.id?{...w,...data}:w));
    else setWelders(l=>[...l,{...data,id:'wm'+Date.now(),welder_no:data.welder_no||nextAutoNo()}]);
    toast(edit?'수정 완료':'등록 완료','success');setShowM(false);
  }
  function del(id){if(!confirm('삭제하시겠습니까?'))return;setWelders(l=>l.filter(w=>w.id!==id));toast('삭제 완료','info');}

  return(<div>
    <div style={{display:'flex',gap:8,marginBottom:10}}>
      <input placeholder="🔍 이름, 번호, 소속 검색..." onChange={e=>{}} style={{width:240}}/>
      <span style={{marginLeft:'auto',fontSize:11,color:'var(--t3)',alignSelf:'center'}}>다음 자동 번호: <strong style={{color:'var(--cyan)'}}>{nextAutoNo()}</strong></span>
      {ce&&<button className="btn btn-p" onClick={openAdd}>+ 용접사 기본정보 등록</button>}
    </div>

    {/* 카드형 목록 */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
      {welders.map(w=>{
        const q=wpqrList.filter(wq=>wq.welder_id===w.id&&wq.approved&&new Date(wq.cert_expiry_date)>=new Date());
        return(<div key={w.id} className="card" style={{padding:0,overflow:'hidden'}}>
          {/* 카드 헤더 - 사진 + 기본정보 */}
          <div style={{display:'flex',gap:12,padding:'14px 14px 10px',alignItems:'flex-start'}}>
            {/* 증명사진 */}
            <div style={{flexShrink:0}}>
              {w.photo
                ?<img src={w.photo} style={{width:64,height:80,objectFit:'cover',borderRadius:4,border:'2px solid var(--bdr)'}}/>
                :<div style={{width:64,height:80,background:'var(--bg4)',borderRadius:4,border:'2px dashed var(--bdr)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:10}}>
                  <div style={{fontSize:22}}>{w.name_kr[0]}</div>
                  <div>사진없음</div>
                </div>
              }
            </div>
            {/* 기본정보 */}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:800,fontSize:14,marginBottom:2}}>{w.name_kr}</div>
              <div style={{fontSize:11,color:'var(--t3)',marginBottom:4,fontFamily:'Calibri'}}>{w.name_en}</div>
              <div style={{display:'flex',gap:4,marginBottom:4}}>
                <span className="b bc" style={{fontFamily:'Calibri',fontSize:11}}>{w.welder_no}</span>
                <span className={`b ${q.length>0?'bg':'br'}`}>{q.length>0?`${q.length}개 유효`:'자격없음'}</span>
              </div>
              <div style={{fontSize:10,color:'var(--t3)',fontFamily:'Calibri'}}>{w.birth_date}</div>
              <div style={{fontSize:10,color:'var(--t3)'}}>{w.department} · {w.job_title}</div>
            </div>
          </div>
          {/* WPQR 보유 목록 */}
          {q.length>0&&<div style={{padding:'6px 14px',background:'rgba(0,230,118,0.05)',borderTop:'1px solid var(--bdr2)'}}>
            {q.map(wq=><div key={wq.id} style={{fontSize:10,color:'var(--green)',display:'flex',justifyContent:'space-between'}}>
              <span>{wq.template_name||wq.process}</span>
              <span style={{fontFamily:'Calibri'}}>{wq.cert_expiry_date}까지</span>
            </div>)}
          </div>}
          {/* 관리 버튼 */}
          {ce&&<div style={{padding:'6px 10px',borderTop:'1px solid var(--bdr2)',display:'flex',gap:4,justifyContent:'flex-end'}}>
            <button className="ib" onClick={()=>openEdit(w)}>✎ 수정</button>
            <button className="ib d" onClick={()=>del(w.id)}>✕ 삭제</button>
          </div>}
        </div>);
      })}
    </div>

    {/* 등록/수정 모달 */}
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
      <div className="modal" style={{maxWidth:620}}>
        <div className="mhd">
          <span className="mtitle">{edit?'용접사 기본정보 수정':'신규 용접사 기본정보 등록'}</span>
          <button className="xb" onClick={()=>setShowM(false)}>✕</button>
        </div>
        <div className="mbd">
          <div style={{display:'flex',gap:20,marginBottom:16}}>
            {/* 사진 업로드 */}
            <div style={{flexShrink:0}}>
              <div style={{width:100,height:130,background:'var(--bg4)',border:'2px dashed var(--bdr)',borderRadius:6,overflow:'hidden',cursor:'pointer',position:'relative'}}
                onClick={()=>document.getElementById('welderPhoto').click()}>
                {form.photo
                  ?<img src={form.photo} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  :<div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',color:'var(--t3)',fontSize:11}}>
                    <div style={{fontSize:28}}>📷</div>
                    <div style={{marginTop:4}}>증명사진</div>
                    <div>클릭하여 업로드</div>
                  </div>
                }
              </div>
              <input id="welderPhoto" type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto}/>
              {form.photo&&<button className="btn btn-s btn-sm" style={{width:'100%',marginTop:4,fontSize:10}} onClick={()=>sf({photo:null})}>사진 제거</button>}
            </div>
            {/* 기본정보 입력 */}
            <div style={{flex:1}}>
              <div className="info-box blue" style={{marginBottom:10,fontSize:11}}>
                💡 <strong>번호:</strong> 직접 입력 가능 | <strong>주민번호:</strong> 앞 7자리 입력 시 기존 번호 자동 조회
              </div>
              {dupCheck&&dupCheck.found&&<div className="info-box amber" style={{marginBottom:8,fontSize:11}}>
                ⚠ <strong>{dupCheck.welder.name_kr} ({dupCheck.welder.welder_no})</strong>으로 기존 등록 확인 — 번호 자동 입력됨
              </div>}
              {dupCheck&&!dupCheck.found&&<div style={{marginBottom:8,padding:'6px 10px',background:'rgba(0,230,118,0.08)',borderLeft:'3px solid var(--green)',borderRadius:3,fontSize:11}}>
                ✅ 기존 번호 없음 — <strong>{form.welder_no}</strong>로 신규 부여
              </div>}
              <div className="fgg">
                <div className="fg"><label>용접사 번호 ✎ 수정가능</label><input value={form.welder_no||''} onChange={e=>sf({welder_no:e.target.value,manual_no:true})} placeholder="W-0001"/></div>
                <div className="fg"><label>한글 이름 *</label><input value={form.name_kr||''} onChange={e=>sf({name_kr:e.target.value,name_en:krToEn(e.target.value)})}/></div>
                <div className="fg full"><label>영문 이름 🔄 자동생성</label><input readOnly value={form.name_en||''}/></div>
                <div className="fg full">
                  <label>주민번호 * <span style={{fontSize:10,color:'var(--t3)'}}>(앞 7자리 입력 → 뒤 자동 마스킹 + 기존 번호 조회)</span></label>
                  <input value={form.birth_date||''} onChange={e=>handleBirth(e.target.value)} placeholder="810101-1" maxLength={9}
                    style={{fontFamily:'Calibri',letterSpacing:1}}/>
                  {form.birth_date&&<div style={{fontSize:11,color:'var(--cyan)',marginTop:3,fontFamily:'Calibri'}}>표시: {form.birth_date}</div>}
                </div>
              </div>
            </div>
          </div>
          <div className="fgg">
            <div className="fg"><label>소속 부서</label>
              <select value={form.department||''} onChange={e=>sf({department:e.target.value})}>
                <option value="">선택</option><option>사외협력사</option><option>사내협력사</option><option>직영인력</option>
              </select>
            </div>
            <div className="fg"><label>직책</label>
              <select value={form.job_title||''} onChange={e=>sf({job_title:e.target.value})}>
                <option value="">선택</option><option>용접사</option><option>가접사</option><option>로봇용접 오퍼레이터</option>
              </select>
            </div>
            <div className="fg"><label>입사일</label><input type="date" value={form.hire_date||''} onChange={e=>sf({hire_date:e.target.value})}/></div>
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
          <button className="btn btn-p" onClick={save}>💾 저장</button>
        </div>
      </div>
    </div>}
  </div>);
}

/* ══ 📁 WPQR 양식 라이브러리 ══ */

    <div className="card" style={{marginBottom:10}}>
      <div className="card-hd"><span className="card-title">서명 기본값</span></div>

        <div className="fg"><label>PREPARED BY</label><input style={{width:'100%'}} value={form['prepared_by']||''} onChange={e=>sf({'prepared_by':e.target.value})} placeholder="D.Y.LEE"/></div>

  return(<div>

      {templates.map(t=>(
        <div key={t.id} className="card" style={{borderLeft:`4px solid ${t.weld_type==='Groove'?'var(--cyan)':t.weld_type==='Fillet'?'#a78bfa':'var(--green)'}`}}>

            <div>
              <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{t.name}</div>
              <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6}}>
                <span className="b bp">{t.process}</span>
                <span className={`b ${t.weld_type==='Groove'?'bg':t.weld_type==='Fillet'?'bc':'bb'}`}>{t.weld_type}</span>
                <span className="b ba">{t.position}</span>

              <button className="ib" onClick={()=>openEdit(t)}>✎</button>
              <button className="ib d" onClick={()=>del(t.id)}>✕</button>

          </div>
        </div>
      ))}
    </div>
  </div>);
}

/* ══ 📋 WPQR 작성 ══ */
function WWPQRList({wpqrList,setWpqrList,welders,templates,ce,toast}){
  const[view,setView]=useState('list');
  const[editItem,setEditItem]=useState(null);
  const[showPreview,setShowPreview]=useState(null);

  const mkForm=(tpl)=>({
    wpqr_no:'',cert_no:'',welder_id:'',test_date:new Date().toISOString().split('T')[0],wps_no:'',
    template_id:tpl?tpl.id:'',template_name:tpl?tpl.name:'',
    weld_type:tpl?tpl.weld_type:'',code_standard:tpl?tpl.code_standard:'AWS D1.1 (2010)',
    process:tpl?tpl.process:'',electrode_type:tpl?tpl.electrode_type:'Single',
    position:tpl?tpl.position:'',range_position:tpl?tpl.range_position:'',
    progression:tpl?tpl.progression:'',backing:tpl?tpl.backing:'',
    material_spec:tpl?tpl.material_spec:'',material_grade:tpl?tpl.material_grade:'',
    thickness_groove:tpl?tpl.thickness_groove:'',thickness_fillet:tpl?tpl.thickness_fillet:'',
    diameter_groove:tpl?tpl.diameter_groove:'N/A',diameter_fillet:tpl?tpl.diameter_fillet:'N/A',
    filler_spec:tpl?tpl.filler_spec:'',filler_class:tpl?tpl.filler_class:'',filler_fno:tpl?tpl.filler_fno:'',
    gas_type:tpl?tpl.gas_type:'',gas_backing:tpl?tpl.gas_backing:'',
    current_polarity:tpl?tpl.current_polarity:'',transfer_mode:tpl?tpl.transfer_mode:'',
    range_material:tpl?tpl.range_material:'P-No.1',range_thickness:tpl?tpl.range_thickness:'',
    range_diameter:tpl?tpl.range_diameter:'N/A',range_process:tpl?tpl.range_process:'',
    range_electrode:tpl?tpl.range_electrode:'Single or Multiple',range_progression:tpl?tpl.range_progression:'Both',
    range_backing:tpl?tpl.range_backing:'With or Without Backing',
    range_filler_spec:tpl?tpl.range_filler_spec:'Any per A5.XX',range_filler_class:tpl?tpl.range_filler_class:'Any Classification',
    range_filler_fno:tpl?tpl.range_filler_fno:'F-No. 1~6',range_gas:tpl?tpl.range_gas:'Any',
    range_gas_backing:tpl?tpl.range_gas_backing:'N/A',range_current:tpl?tpl.range_current:'DCEP or DCEN',
    range_transfer:tpl?tpl.range_transfer:'Any',others:tpl?tpl.others:'',
    visual_result:'ACCEPTED',
    bend_test_no:'',bend1_type:'',bend1_result:'',bend2_type:'',bend2_result:'',bend3_type:'',bend3_result:'',bend4_type:'',bend4_result:'',
    fillet_appearance:'GOOD',fillet_leg_size:'6~8mm',fracture_test:'',macroetch_test:'',
    rt_result:'N/A',ut_result:'N/A',ut_report_no:'',
    macro_test_date:'',macro_report_no:'',macro_result:'Accepted',
    break_test_date:'',break_report_no:'',break_result:'Accepted',
    test_photos:[],macro_photos:[],
    conducted_by:tpl?tpl.conducted_by:'D.Y.LEE',prepared_by:tpl?tpl.prepared_by:'D.Y.LEE',certified_by:tpl?tpl.certified_by:'J.H.HWANG',
    overall_result:'PASS',approved:false,approved_date:'',status:'DRAFT',remarks:'',
  });
  const[form,setForm]=useState(mkForm(null));
  const sf=p=>setForm(v=>({...v,...p}));

  function startNew(){setEditItem(null);setView('select');}
  function selectTemplate(tpl){
    const no=wFmtWPQR(wpqrList.length+1);
    const cert=wFmtCert(wpqrList.length+1);
    setForm({...mkForm(tpl),wpqr_no:no,cert_no:cert});
    setView('form');
  }
  function openEdit(w){setForm({...mkForm(null),...w});setEditItem(w);setView('form');}
  function del(id){if(!confirm('삭제?'))return;setWpqrList(l=>l.filter(w=>w.id!==id));toast('삭제','info');}

  function saveDraft(){
    if(!form.welder_id){toast('용접사를 선택하세요.','error');return;}
    const item={...form,status:'DRAFT',approved:false};
    if(editItem)setWpqrList(l=>l.map(w=>w.id===editItem.id?{...w,...item}:w));
    else setWpqrList(l=>[...l,{...item,id:'wq'+Date.now()}]);
    toast('임시저장 완료','info');setView('list');
  }
  function saveApprove(){
    if(!form.welder_id){toast('용접사를 선택하세요.','error');return;}
    const today=new Date().toISOString().split('T')[0];
    const item={...form,status:'APPROVED',approved:true,approved_date:today,approved_by:form.certified_by,cert_issued_date:form.test_date,cert_expiry_date:wExpiry(form.test_date)};
    if(editItem)setWpqrList(l=>l.map(w=>w.id===editItem.id?{...w,...item}:w));
    else setWpqrList(l=>[...l,{...item,id:'wq'+Date.now()}]);
    toast('✅ 승인 완료! WPQR 문서·스티커·유자격명단 자동 연계됩니다.','success');
    setView('list');
  }

  const wdr=welders.find(w=>w.id===form.welder_id)||{};
  const S={th:{background:'var(--bg4)',padding:'5px 8px',border:'1px solid var(--bdr)',fontWeight:600,fontSize:11},td:{padding:'4px 6px',border:'1px solid var(--bdr)',fontSize:11}};

  /* 목록 */
  if(view==='list') return(<div>
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
      <div style={{display:'flex',gap:4}}>
        <span className="b bg">{wpqrList.filter(w=>w.approved).length}건 승인</span>
        <span className="b ba">{wpqrList.filter(w=>!w.approved).length}건 초안</span>
      </div>
      {ce&&<button className="btn btn-p" onClick={startNew}>+ WPQR 신규 작성</button>}
    </div>
    <div className="card">
      <div className="tw"><table>
        <thead><tr><th>WPQR No.</th><th>용접사</th><th>양식</th><th>종류</th><th>시험일</th><th>자세</th><th>판정</th><th>상태</th><th>유효기간</th><th>관리</th></tr></thead>
        <tbody>{wpqrList.length===0
          ?<tr><td colSpan={10} style={{textAlign:'center',padding:20,color:'var(--t3)'}}>WPQR이 없습니다. 신규 작성을 시작하세요.</td></tr>
          :wpqrList.map(w=>{
            const wdr2=welders.find(ww=>ww.id===w.welder_id)||{name_kr:'-',welder_no:'-'};
            const exp=w.cert_expiry_date&&new Date(w.cert_expiry_date)<new Date();
            return(<tr key={w.id}>
              <td style={{color:'#60a5fa',fontSize:11,fontFamily:'Calibri',cursor:'pointer'}} onClick={()=>setShowPreview(w)}>{w.wpqr_no}</td>
              <td>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  {wdr2.photo?<img src={wdr2.photo} style={{width:24,height:24,borderRadius:'50%',objectFit:'cover'}}/>
                    :<div style={{width:24,height:24,borderRadius:'50%',background:'var(--bg4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--t3)'}}>{(wdr2.name_kr||'?')[0]}</div>}
                  <div>
                    <div style={{fontWeight:600,fontSize:12}}>{wdr2.name_kr}</div>
                    <div style={{fontSize:10,color:'var(--t3)',fontFamily:'Calibri'}}>{wdr2.welder_no}</div>
                  </div>
                </div>
              </td>
              <td style={{fontSize:11}}>{w.template_name||'-'}</td>
              <td><span className={`b ${w.weld_type==='Groove'?'bg':w.weld_type==='Fillet'?'bc':'bb'}`}>{w.weld_type||'-'}</span></td>
              <td style={{fontSize:11}}>{w.test_date}</td>
              <td>{w.position}</td>
              <td><span className={`b ${w.overall_result==='PASS'?'bg':'br'}`}>{w.overall_result}</span></td>
              <td>{w.approved?<span className="b bg">✅ 승인</span>:<span className="b ba">📝 초안</span>}</td>
              <td style={{fontSize:10,color:exp?'var(--red)':'var(--t2)'}}>{w.cert_expiry_date||'-'}</td>
              <td><div style={{display:'flex',gap:3}}>
                <button className="ib" onClick={()=>setShowPreview(w)}>📄</button>
                {ce&&<button className="ib" onClick={()=>openEdit(w)}>✎</button>}
                {ce&&<button className="ib d" onClick={()=>del(w.id)}>✕</button>}
              </div></td>
            </tr>);
          })
        }</tbody>
      </table></div>
    </div>
    {showPreview&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowPreview(null)}>

        <div className="mhd">

          <div style={{display:'flex',gap:6}}>
            <button className="btn btn-s btn-sm" onClick={()=>window.print()}>🖨 인쇄</button>
            {ce&&<button className="btn btn-s btn-sm" onClick={()=>{setShowPreview(null);openEdit(showPreview);}}>✎</button>}
            <button className="xb" onClick={()=>setShowPreview(null)}>✕</button>
          </div>
        </div>
        <div className="mbd" style={{padding:0}}><WPQRPrintView wpqr={showPreview} welders={welders}/></div>
      </div>
    </div>}
  </div>);

  if(view==='select') return(<div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
      <button className="btn btn-s btn-sm" onClick={()=>setView('list')}>← 목록</button>

          style={{cursor:'pointer',borderLeft:`4px solid ${t.weld_type==='Groove'?'var(--cyan)':t.weld_type==='Fillet'?'#a78bfa':'var(--green)'}`}}
          onMouseEnter={e=>e.currentTarget.style.boxShadow='0 4px 16px rgba(0,212,255,0.2)'}
          onMouseLeave={e=>e.currentTarget.style.boxShadow=''}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{t.name}</div>
          <div style={{display:'flex',gap:4,marginBottom:6}}>
            <span className="b bp">{t.process}</span>
            <span className={`b ${t.weld_type==='Groove'?'bg':t.weld_type==='Fillet'?'bc':'bb'}`}>{t.weld_type}</span>
            <span className="b ba">{t.position}</span>
          </div>
          <div style={{fontSize:10,color:'var(--t3)'}}>{t.code_standard} · {t.material_spec} {t.material_grade} · {t.filler_class}</div>
          <div style={{fontSize:10,color:'var(--t3)'}}>적용자세: {t.range_position}</div>
          <div style={{marginTop:8,textAlign:'right',fontSize:11,color:'var(--cyan)',fontWeight:600}}>이 양식으로 작성 →</div>
        </div>
      ))}
    </div>
  </div>);

  /* 작성 폼 */
  return(<div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,flexWrap:'wrap'}}>
      <button className="btn btn-s btn-sm" onClick={()=>setView('list')}>← 목록</button>
      <span style={{fontWeight:700,fontSize:14}}>{editItem?'WPQR 수정':'WPQR 작성'}</span>
      <span style={{fontFamily:'Calibri',color:'var(--cyan)',fontSize:13}}>{form.wpqr_no}</span>
      {form.template_name&&<span className="b bp">{form.template_name}</span>}
      {form.approved&&<span className="b bg">✅ 승인완료</span>}
    </div>

    {/* ① 기본정보 — 용접사 선택 시 이름·주민번호·사진 자동 연계 */}
    <div className="card" style={{marginBottom:10,borderTop:'3px solid var(--cyan)'}}>
      <div className="card-hd" style={{background:'rgba(0,212,255,0.04)'}}>
        <span className="card-title">① 기본 정보</span>
        <span style={{fontSize:11,color:'var(--green)'}}>🔄 용접사 선택 시 이름·주민번호·사진 자동 연계 → 모든 문서에 출력</span>
      </div>
      <div className="card-bd">
        <div style={{display:'flex',gap:20,alignItems:'flex-start'}}>
          {/* 자동 연계 사진 */}
          <div style={{flexShrink:0,textAlign:'center'}}>
            {wdr.photo
              ?<img src={wdr.photo} style={{width:80,height:100,objectFit:'cover',borderRadius:4,border:'2px solid var(--cyan)'}}/>
              :<div style={{width:80,height:100,background:'var(--bg4)',borderRadius:4,border:'2px dashed var(--bdr)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'var(--t3)',fontSize:10}}>
                <div style={{fontSize:24}}>{form.welder_id?(wdr.name_kr||'?')[0]:'📷'}</div>
                <div style={{marginTop:2}}>{form.welder_id?'사진없음':'용접사\n선택 후'}</div>
              </div>
            }
            <div style={{fontSize:9,color:'var(--green)',marginTop:3}}>🔄 자동연계</div>
          </div>
          {/* 자동 입력 필드들 */}
          <div style={{flex:1}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
              <div className="fg"><label>WPQR No. 🔄</label><input readOnly value={form.wpqr_no}/></div>
              <div className="fg"><label>Certificate No. 🔄</label><input readOnly value={form.cert_no}/></div>
              <div className="fg"><label>Test Date *</label><input type="date" value={form.test_date||''} onChange={e=>sf({test_date:e.target.value})}/></div>
              <div className="fg">
                <label>Welder / 용접사 *</label>
                <select value={form.welder_id||''} onChange={e=>sf({welder_id:e.target.value})}>
                  <option value="">선택하세요</option>
                  {welders.map(w=><option key={w.id} value={w.id}>{w.name_kr} ({w.welder_no})</option>)}
                </select>
              </div>
              <div className="fg"><label>Name 🔄 자동</label><input readOnly value={form.welder_id?`${wdr.name_en||''} (${wdr.name_kr||''})`:''}/></div>
              <div className="fg"><label>Identification No. 🔄 자동</label><input readOnly value={form.welder_id?(wdr.birth_date||''):''} style={{fontFamily:'Calibri',letterSpacing:1}}/></div>
              <div className="fg"><label>WPS No.</label><input style={{width:'100%'}} value={form['wps_no']||''} onChange={e=>sf({'wps_no':e.target.value})} placeholder="TCS-FC-001"/></div>
              <div className="fg"><label>용접 종류 🔄</label><input readOnly value={form.weld_type}/></div>
              <div className="fg"><label>적용 코드/규격</label>
                <select value={form.code_standard||''} onChange={e=>sf({code_standard:e.target.value})}>
                  <option>AWS D1.1 (2010)</option><option>AWS D1.1 (2015)</option><option>AWS D1.1 (2020)</option>
                  <option>AWS D14.3 (2010)</option><option>AWS D14.3 (2020)</option>
                  <option>ISO 9606-1 (2012)</option><option>ISO 9606-1 (2017)</option><option>KS B ISO 9606-1</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    {/* ② Variables */}
    <div className="card" style={{marginBottom:10}}>
      <div className="card-hd"><span className="card-title">② Variables <span style={{fontSize:11,color:'var(--t3)',fontWeight:400}}>— 양식에서 자동 채움, 수정 가능</span></span></div>
      <div className="card-bd" style={{padding:0}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr><th style={{...S.th,width:'28%'}}>VARIABLES</th><th style={{...S.th,width:'36%'}}>ACTUAL VALUES</th><th style={{...S.th,width:'36%',background:'#FFFBEB',color:'#92400E'}}>QUALIFICATION RANGE</th></tr></thead>
          <tbody>
            {[['WELDING PROCESS','process','range_process'],['ELECTRODE','electrode_type','range_electrode'],['POSITION','position','range_position'],['PROGRESSION','progression','range_progression'],['BACKING','backing','range_backing']].map(([lbl,af,rf])=>(
              <tr key={lbl}><td style={{...S.td,fontWeight:600}}>{lbl}</td><td style={S.td}><input style={{width:'100%'}} value={form[af]||''} onChange={e=>sf({[af]:e.target.value})} placeholder={lbl}/></td><td style={S.td}><input style={{width:'100%'}} value={form[rf]||''} onChange={e=>sf({[rf]:e.target.value})} placeholder="인정범위 입력"/></td></tr>
            ))}
            <tr><td style={{...S.td,fontWeight:600}}>MATERIAL</td><td style={S.td}><input style={{width:'100%'}} value={form['material_spec']||''} onChange={e=>sf({'material_spec':e.target.value})} placeholder=""/><div style={{marginTop:2}}><input style={{width:'100%'}} value={form['material_grade']||''} onChange={e=>sf({'material_grade':e.target.value})} placeholder=""/></div></td><td style={S.td}><input style={{width:'100%'}} value={form['range_material']||''} onChange={e=>sf({'range_material':e.target.value})} placeholder="P-No.1"/></td></tr>
            <tr><td rowSpan={2} style={{...S.td,fontWeight:600,verticalAlign:'middle'}}>THICKNESS</td><td style={S.td}><div style={{display:'flex',gap:4}}><span style={{fontSize:10,color:'var(--t3)',minWidth:36}}>GROOVE</span><input style={{width:'100%'}} value={form['thickness_groove']||''} onChange={e=>sf({'thickness_groove':e.target.value})} placeholder="mm"/></div></td><td style={S.td}><input style={{width:'100%'}} value={form['range_thickness']||''} onChange={e=>sf({'range_thickness':e.target.value})} placeholder="예: 6mm ~ Unlimited"/></td></tr>
            <tr><td style={S.td}><div style={{display:'flex',gap:4}}><span style={{fontSize:10,color:'var(--t3)',minWidth:36}}>FILLET</span><input style={{width:'100%'}} value={form['thickness_fillet']||''} onChange={e=>sf({'thickness_fillet':e.target.value})} placeholder="mm"/></div></td><td style={S.td}><input style={{width:'100%'}} value={form['range_thickness_fillet']||''} onChange={e=>sf({'range_thickness_fillet':e.target.value})} placeholder="All"/></td></tr>
            <tr><td rowSpan={2} style={{...S.td,fontWeight:600,verticalAlign:'middle'}}>DIAMETER</td><td style={S.td}><div style={{display:'flex',gap:4}}><span style={{fontSize:10,color:'var(--t3)',minWidth:36}}>GROOVE</span><input style={{width:'100%'}} value={form['diameter_groove']||''} onChange={e=>sf({'diameter_groove':e.target.value})} placeholder="N/A"/></div></td><td style={S.td}><input style={{width:'100%'}} value={form['range_diameter']||''} onChange={e=>sf({'range_diameter':e.target.value})} placeholder="N/A"/></td></tr>
            <tr><td style={S.td}><div style={{display:'flex',gap:4}}><span style={{fontSize:10,color:'var(--t3)',minWidth:36}}>FILLET</span><input style={{width:'100%'}} value={form['diameter_fillet']||''} onChange={e=>sf({'diameter_fillet':e.target.value})} placeholder="N/A"/></div></td><td style={S.td}><input style={{width:'100%'}} value={form['range_diameter_fillet']||''} onChange={e=>sf({'range_diameter_fillet':e.target.value})} placeholder="N/A"/></td></tr>
            {[['FILLER SPEC','filler_spec','range_filler_spec'],['FILLER CLASS','filler_class','range_filler_class'],['F. NO','filler_fno','range_filler_fno'],['GAS TYPE','gas_type','range_gas'],['GAS BACKING','gas_backing','range_gas_backing'],['CURRENT & POL.','current_polarity','range_current'],['TRANSFER MODE','transfer_mode','range_transfer']].map(([lbl,af,rf])=>(
              <tr key={lbl}><td style={{...S.td,fontWeight:600}}>{lbl}</td><td style={S.td}><input style={{width:'100%'}} value={form[af]||''} onChange={e=>sf({[af]:e.target.value})} placeholder=""/></td><td style={S.td}><input style={{width:'100%'}} value={form[rf]||''} onChange={e=>sf({[rf]:e.target.value})} placeholder="인정범위 입력"/></td></tr>
            ))}
            <tr><td style={{...S.td,fontWeight:600}}>OTHERS</td><td colSpan={2} style={S.td}><input style={{width:'100%'}} value={form['others']||''} onChange={e=>sf({'others':e.target.value})} placeholder="기타"/></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    {/* ③ 시험결과 */}
    <div className="card" style={{marginBottom:10}}>
      <div className="card-hd"><span className="card-title">③ 시험 결과</span></div>
      <div className="card-bd">
        <div style={{marginBottom:10,display:'flex',alignItems:'center',gap:10}}>
          <label style={{fontSize:12,fontWeight:600,color:'var(--t3)',whiteSpace:'nowrap'}}>VISUAL INSPECTION</label>
          <select value={form.visual_result||'ACCEPTED'} onChange={e=>sf({visual_result:e.target.value})} style={{width:160}}>
            <option>ACCEPTED</option><option>REJECTED</option>
          </select>
        </div>
        {(form.weld_type==='Groove'||form.weld_type==='Both')&&<>
          <div style={{fontSize:11,fontWeight:600,color:'var(--t3)',marginBottom:6}}>GUIDED BEND TEST</div>
          <div style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
            <span style={{fontSize:11,color:'var(--t3)'}}>Test No.</span>
            <input value={form.bend_test_no||''} onChange={e=>sf({bend_test_no:e.target.value})} style={{width:180}}/>
          </div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,marginBottom:10}}>
            <thead><tr>{['TYPE','RESULTS','TYPE','RESULTS'].map((h,i)=><th key={i} style={{...S.th,textAlign:'center'}}>{h}</th>)}</tr></thead>
            <tbody>{[[1,2],[3,4]].map(([a,b])=>(
              <tr key={a}>
                {[a,b].map(n=>[
                  <td key={'t'+n} style={S.td}><select style={{width:'100%'}} value={form[`bend${n}_type`]||''} onChange={e=>sf({[`bend${n}_type`]:e.target.value})}><option value="">선택</option><option>Face Bend</option><option>Root Bend</option><option>Side Bend</option></select></td>,
                  <td key={'r'+n} style={S.td}><select style={{width:'100%'}} value={form[`bend${n}_result`]||''} onChange={e=>sf({[`bend${n}_result`]:e.target.value})}><option value="">선택</option><option>ACCEPTED</option><option>REJECTED</option></select></td>
                ])}
              </tr>
            ))}</tbody>
          </table>
        </>}
        {(form.weld_type==='Fillet'||form.weld_type==='Both')&&<>
          <div style={{fontSize:11,fontWeight:600,color:'var(--t3)',marginBottom:6}}>FILLET WELD TEST</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8,marginBottom:10}}>
            {[['fillet_appearance','APPEARANCE',['GOOD','FAIR','POOR']],['fillet_leg_size','FILLET LEG SIZE',null],['fracture_test','FRACTURE TEST',['','ACCEPTED','REJECTED','N/A']],['macroetch_test','MACROETCH TEST',['','ACCEPTED','REJECTED','N/A']]].map(([fld,lbl,opts])=>(
              <div key={fld} className="fg"><label>{lbl}</label>
                {opts?<select value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}>{opts.map(o=><option key={o}>{o}</option>)}</select>
                  :<input value={form[fld]||''} onChange={e=>sf({[fld]:e.target.value})}/>}
              </div>
            ))}
          </div>
        </>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div className="fg"><label>RT 결과</label><select value={form.rt_result||'N/A'} onChange={e=>sf({rt_result:e.target.value})}><option>N/A</option><option>ACCEPTED</option><option>REJECTED</option></select></div>
          <div className="fg"><label>UT 결과</label><select value={form.ut_result||'N/A'} onChange={e=>sf({ut_result:e.target.value})}><option>N/A</option><option>ACCEPTED</option><option>REJECTED</option></select></div>
          {form.ut_result==='ACCEPTED'&&<div className="fg"><label>UT Report No.</label><input value={form.ut_report_no||''} onChange={e=>sf({ut_report_no:e.target.value})} placeholder="TC-WPQT-UT-XXX"/></div>}
        </div>
      </div>
    </div>

    {/* ④ Macro & Break */}
    <div className="card" style={{marginBottom:10}}>
      <div className="card-hd"><span className="card-title">④ Macro-Etch & Break Test <span style={{fontSize:11,color:'var(--green)',fontWeight:400}}>— 용접사 기본정보 자동 반영</span></span></div>
      <div className="card-bd">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          {[['◎ Macro-Etch Test','macro_test_date','macro_report_no','macro_result','macroP','macro_photos'],
            ['◎ Break Test','break_test_date','break_report_no','break_result','breakP','test_photos']].map(([title,dF,nF,rF,pid,pF])=>(
            <div key={title}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--t3)',marginBottom:8}}>{title}</div>
              <div className="fg" style={{marginBottom:6}}><label>Test Date</label><input type="date" value={form[dF]||''} onChange={e=>sf({[dF]:e.target.value})}/></div>
              <div className="fg" style={{marginBottom:6}}><label>Report No.</label><input value={form[nF]||''} onChange={e=>sf({[nF]:e.target.value})} placeholder="WQT-YYMMDD-XX"/></div>
              <div className="fg" style={{marginBottom:6}}><label>Results</label><select value={form[rF]||'Accepted'} onChange={e=>sf({[rF]:e.target.value})}><option>Accepted</option><option>Rejected</option></select></div>
              <div className="pzone" style={{padding:8}} onClick={()=>document.getElementById(pid).click()}>
                <span style={{fontSize:11}}>📸 사진 업로드</span>
                <input id={pid} type="file" accept="image/*" multiple style={{display:'none'}}
                  onChange={e=>Array.from(e.target.files).forEach(f=>{const rd=new FileReader();rd.onload=ev=>sf({[pF]:[...(form[pF]||[]),{name:f.name,url:ev.target.result}]});rd.readAsDataURL(f);})}/>
              </div>
              {(form[pF]||[]).length>0&&<div className="pgrid" style={{marginTop:4}}>
                {(form[pF]||[]).map((p,i)=><div key={i} className="pt"><img src={p.url} alt={p.name}/><button className="pdel" onClick={()=>sf({[pF]:(form[pF]||[]).filter((_,ii)=>ii!==i)})}>✕</button></div>)}
              </div>}
            </div>
          ))}
        </div>
      </div>
    </div>

    {/* ⑤ 서명 & 판정 */}
    <div className="card" style={{marginBottom:10}}>
      <div className="card-hd"><span className="card-title">⑤ 서명 및 최종 판정</span></div>
      <div className="card-bd">
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:10}}>
          {[['conducted_by','TEST CONDUCTED BY'],['prepared_by','PREPARED BY'],['certified_by','CERTIFIED BY']].map(([k,l])=>(
            <div key={k} className="fg"><label>{l}</label><input value={form[k]||''} onChange={e=>sf({[k]:e.target.value})}/></div>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
          <div className="fg"><label>최종 판정</label><select value={form.overall_result||'PASS'} onChange={e=>sf({overall_result:e.target.value})}><option>PASS</option><option>FAIL</option></select></div>
          <div className="fg"><label>비고</label><input value={form.remarks||''} onChange={e=>sf({remarks:e.target.value})}/></div>
        </div>
        <div style={{fontSize:10,color:'var(--t3)',padding:'6px 8px',background:'var(--bg3)',borderRadius:3}}>
          {`WE, THE UNDERSIGNED, CERTIFY THAT THE STATEMENTS IN THIS RECORD ARE CORRECT AND THAT THE TEST WELDS WERE PREPARED, WELDED, AND TESTED IN CONFORMANCE WITH THE REQUIREMENTS OF ${form.code_standard||'AWS D1.1 (2010)'}.`}
        </div>
      </div>
    </div>

    <div style={{display:'flex',gap:8,justifyContent:'flex-end',paddingBottom:20}}>
      <button className="btn btn-s" onClick={()=>setView('list')}>취소</button>
      <button className="btn btn-s" onClick={saveDraft}>📝 임시저장</button>
      {form.overall_result==='PASS'
        ?<button className="btn btn-p" onClick={saveApprove} style={{background:'var(--green)'}}>✅ 승인 → WPQR·스티커·명단 자동연계</button>
        :<button className="btn btn-d" onClick={saveApprove}>❌ 불합격 처리</button>
      }
    </div>
  </div>);
}

/* ══ 인쇄뷰 — 모든 문서에 사진·이름·주민번호 자동 출력 ══ */
function WPQRPrintView({wpqr,welders}){
  const wdr=welders.find(w=>w.id===wpqr.welder_id)||{};
  const S={tbl:{width:'100%',borderCollapse:'collapse',marginBottom:12},th:{background:'#F1F5F9',padding:'5px 8px',border:'1px solid #CBD5E1',fontWeight:600,textAlign:'left',fontSize:11},td:{padding:'5px 8px',border:'1px solid #CBD5E1',fontSize:11}};
  return(
    <div style={{padding:20,background:'#fff',color:'#1E293B',fontFamily:'Calibri,Malgun Gothic,sans-serif',fontSize:11}}>

        <div style={{fontSize:8,letterSpacing:1}}>TC TECH</div><div style={{fontSize:12,fontWeight:800}}>APPROVED</div><div style={{fontSize:8}}>{wpqr.approved_date}</div>
      </div></div>}

      <div style={{textAlign:'center',fontSize:13,fontWeight:800,marginBottom:2}}>WELDER / WELDING OPERATOR PERFORMANCE QUALIFICATION TEST RECORD</div>

      {/* 기본정보 + 사진 */}
      <div style={{display:'flex',gap:16,marginBottom:12}}>
        <div style={{flex:1}}>
          <table style={S.tbl}>
            <tbody>
              <tr>
                <th style={{...S.th,background:'#EFF6FF',width:'22%'}}>Code / Standard</th>
                <td colSpan={3} style={{...S.td,fontWeight:700,color:'#1E40AF'}}>{wpqr.code_standard||'AWS D1.1 (2010)'}</td>
              </tr>
              <tr><th style={S.th}>Certificate No.</th><td style={{...S.td,fontFamily:'Calibri',fontWeight:700,color:'#1a6ef5'}}>{wpqr.cert_no}</td><th style={S.th}>WPS No.</th><td style={S.td}>{wpqr.wps_no||'-'}</td></tr>
              <tr><th style={S.th}>WPQR No.</th><td style={{...S.td,fontFamily:'Calibri',fontWeight:700}}>{wpqr.wpqr_no}</td><th style={S.th}>Test Date</th><td style={S.td}>{wpqr.test_date}</td></tr>
              <tr><th style={S.th}>Name</th><td style={S.td}>{wdr.name_en||'-'} ({wdr.name_kr||'-'})</td><th style={S.th}>Welder No.</th><td style={{...S.td,fontFamily:'Calibri',fontWeight:700}}>{wdr.welder_no||'-'}</td></tr>
              <tr><th style={S.th}>Identification No.</th><td colSpan={3} style={{...S.td,fontFamily:'Calibri',letterSpacing:1}}>{wdr.birth_date||'-'}</td></tr>
              <tr><th style={S.th}>Template</th><td colSpan={3} style={S.td}>{wpqr.template_name||'-'}</td></tr>
            </tbody>
          </table>
        </div>
        {/* 사진 자동 출력 */}
        <div style={{flexShrink:0,textAlign:'center'}}>

          {wpqr.macro_test_date&&<><tr><th style={S.th}>MACRO-ETCH DATE</th><td style={S.td}>{wpqr.macro_test_date}</td><th style={S.th}>MACRO REPORT No.</th><td style={S.td}>{wpqr.macro_report_no}</td></tr>

          {(wpqr.macro_photos||[]).length>0&&<tr><th style={S.th}>Macro 사진</th><td colSpan={3} style={S.td}><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{(wpqr.macro_photos||[]).map((p,i)=><img key={i} src={p.url} style={{width:80,height:60,objectFit:'cover',borderRadius:3,border:'1px solid #CBD5E1'}}/>)}</div></td></tr>}
          {(wpqr.test_photos||[]).length>0&&<tr><th style={S.th}>Break 사진</th><td colSpan={3} style={S.td}><div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{(wpqr.test_photos||[]).map((p,i)=><img key={i} src={p.url} style={{width:80,height:60,objectFit:'cover',borderRadius:3,border:'1px solid #CBD5E1'}}/>)}</div></td></tr>}
        </tbody>
      </table>

      {/* 서명 */}
      <table style={S.tbl}>
        <tbody>
          <tr><th style={S.th}>TEST CONDUCTED BY</th><th style={S.th}>PREPARED BY</th><th style={S.th}>CERTIFIED BY</th></tr>
          <tr><td style={{...S.td,height:32,verticalAlign:'bottom'}}>{wpqr.conducted_by}</td><td style={{...S.td,height:32,verticalAlign:'bottom'}}>{wpqr.prepared_by}</td><td style={{...S.td,height:32,verticalAlign:'bottom'}}>{wpqr.certified_by}</td></tr>
        </tbody>
      </table>
      <div style={{fontSize:9,color:'#64748B',border:'1px solid #CBD5E1',padding:'4px 8px',marginBottom:4}}>
        {`WE, THE UNDERSIGNED, CERTIFY THAT THE STATEMENTS IN THIS RECORD ARE CORRECT AND THAT THE TEST WELDS WERE PREPARED, WELDED, AND TESTED IN CONFORMANCE WITH THE REQUIREMENTS OF ${wpqr.code_standard||'AWS D1.1 (2010)'}.`}
      </div>
      <div style={{textAlign:'right',fontWeight:700}}>TC TECH CO., LTD.</div>
    </div>
  );
}

/* ══ 🏷️ 스티커 — 사진+이름+번호 자동 연계 ══ */

      </select>

      {show.map(w=>{

        const d=Math.ceil((new Date(w.cert_expiry_date)-new Date())/86400000);

          {/* 사진 + 정보 */}
          <div style={{display:'flex',gap:8,padding:'8px 10px'}}>
            {wdr.photo?<img src={wdr.photo} style={{width:44,height:56,objectFit:'cover',borderRadius:3,border:'1px solid var(--bdr)',flexShrink:0}}/>

            <div style={{flex:1,fontSize:10}}>
              <div style={{fontWeight:800,fontSize:13,color:'var(--cyan)',fontFamily:'Calibri'}}>{wdr.welder_no}</div>
              <div style={{fontWeight:700,fontSize:11}}>{wdr.name_kr}</div>
              <div style={{color:'var(--t3)',fontFamily:'Calibri',fontSize:9}}>{wdr.name_en}</div>
              <div style={{color:'var(--t3)',fontFamily:'Calibri',fontSize:9,marginTop:2}}>{wdr.birth_date}</div>
            </div>
          </div>
          {/* 자격 정보 */}
          <div style={{padding:'0 10px 6px',fontSize:10}}>
            {[['양식',w.template_name||w.process],['프로세스',w.process],['자세',w.position],['인증No.',w.cert_no]].map(([k,v])=>(
              <div key={k} style={{display:'flex',justifyContent:'space-between',marginBottom:1}}>
                <span style={{color:'var(--t3)'}}>{k}</span><span style={{fontWeight:600,fontSize:9}}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{textAlign:'center',padding:'4px',background:d<=60?'var(--weld-orange,#E85D04)':'var(--pass-green,#06A77D)',color:'#fff',fontWeight:700,fontSize:9}}>

    </div>
  </div>);
}

/* ══ 🔄 자격 갱신 ══ */
function WRenewalMgr({renewals,setRenewals,wpqrList,setWpqrList,welders,ce,toast}){
  const[showM,setShowM]=useState(false);
  const year=new Date().getFullYear();
  const[form,setForm]=useState({welder_id:'',wpqr_id:'',renewal_period:`${year}-H1`,renewal_date:new Date().toISOString().split('T')[0],ndt_method:'RT',ndt_result:'',remarks:''});
  const sf=p=>setForm(v=>({...v,...p}));
  const h1=renewals.filter(r=>r.renewal_period===`${year}-H1`);
  const h2=renewals.filter(r=>r.renewal_period===`${year}-H2`);
  const allQual=wpqrList.filter(w=>w.overall_result==='PASS'&&w.approved);
  const welderQuals=form.welder_id?wpqrList.filter(w=>w.welder_id===form.welder_id&&w.overall_result==='PASS'&&w.approved):[];
  function save(){
    if(!form.welder_id||!form.wpqr_id||!form.ndt_result){toast('필수 항목 입력','error');return;}
    const res=form.ndt_result==='PASS'?'RENEWED':'EXPIRED';
    setRenewals(l=>[...l,{...form,id:'wr'+Date.now(),result:res}]);
    if(form.ndt_result==='FAIL')setWpqrList(l=>l.map(w=>w.id===form.wpqr_id?{...w,status:'EXPIRED',approved:false}:w));
    else setWpqrList(l=>l.map(w=>{if(w.id!==form.wpqr_id)return w;const d=new Date(w.cert_expiry_date);d.setMonth(d.getMonth()+6);return{...w,cert_expiry_date:d.toISOString().split('T')[0]};}));
    toast(res==='RENEWED'?'갱신 완료':'자격 만료 처리','info');setShowM(false);
  }
  return(<div>
    <div className="info-box blue" style={{marginBottom:12}}>📅 매년 <b>6월(상반기)</b>·<b>12월(하반기)</b> 비파괴검사로 갱신. 미갱신 시 자격 자동 만료 → 명단·스티커 자동 제거.</div>
    {ce&&<div style={{display:'flex',justifyContent:'flex-end',marginBottom:12}}><button className="btn btn-p" onClick={()=>setShowM(true)}>+ 갱신 결과 입력</button></div>}
    <div className="g2" style={{marginBottom:14}}>
      {[{period:`${year}-H1`,label:`🌸 ${year}년 상반기 (6월)`,list:h1},{period:`${year}-H2`,label:`🍂 ${year}년 하반기 (12월)`,list:h2}].map(({period,label,list})=>(
        <div key={period} className="card">
          <div className="card-hd"><span className="card-title">{label}</span><span className="b ba">{allQual.length-list.length}명 미완료</span></div>
          <div className="card-bd">{allQual.map(w=>{
            const wdr=welders.find(ww=>ww.id===w.welder_id)||{name_kr:'-'};
            const rn=list.find(r=>r.wpqr_id===w.id);
            return(<div key={w.id} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:'1px solid var(--bdr2)'}}>
              {wdr.photo?<img src={wdr.photo} style={{width:22,height:22,borderRadius:'50%',objectFit:'cover'}}/>
                :<div style={{width:22,height:22,borderRadius:'50%',background:'var(--bg4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--t3)'}}>{(wdr.name_kr||'?')[0]}</div>}
              <span style={{fontWeight:600,fontSize:12,flex:1}}>{wdr.name_kr} <span style={{color:'var(--t3)',fontSize:10}}>{w.template_name||w.process}</span></span>
              {rn?<span className={`b ${rn.result==='RENEWED'?'bg':'br'}`}>{rn.result==='RENEWED'?'갱신완료':'만료'}</span>:<span className="b ba">미완료</span>}
            </div>);
          })}</div>
        </div>
      ))}
    </div>
    <div className="card">
      <div className="card-hd"><span className="card-title">🔄 갱신 이력</span></div>
      <div className="tw"><table>
        <thead><tr><th>사진</th><th>용접사</th><th>갱신기간</th><th>갱신일</th><th>NDT</th><th>결과</th><th>처리</th></tr></thead>
        <tbody>{[...renewals].reverse().map(r=>{
          const wdr=welders.find(w=>w.id===r.welder_id)||{name_kr:'-'};
          return(<tr key={r.id}>
            <td style={{textAlign:'center'}}>
              {wdr.photo?<img src={wdr.photo} style={{width:24,height:24,borderRadius:'50%',objectFit:'cover'}}/>
                :<div style={{width:24,height:24,borderRadius:'50%',background:'var(--bg4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'var(--t3)',margin:'0 auto'}}>{(wdr.name_kr||'?')[0]}</div>}
            </td>
            <td style={{fontWeight:600}}>{wdr.name_kr}</td>
            <td><span className="b bp">{r.renewal_period}</span></td>
            <td style={{fontSize:11}}>{r.renewal_date}</td>
            <td>{r.ndt_method}</td>
            <td><span className={`b ${r.ndt_result==='PASS'?'bg':'br'}`}>{r.ndt_result}</span></td>
            <td><span className={`b ${r.result==='RENEWED'?'bg':'br'}`}>{r.result==='RENEWED'?'갱신':'만료'}</span></td>
          </tr>);
        })}</tbody>
      </table></div>
    </div>
    {showM&&<div className="ov" onClick={e=>e.target===e.currentTarget&&setShowM(false)}>
      <div className="modal" style={{maxWidth:500}}>
        <div className="mhd"><span className="mtitle">🔄 갱신 결과 입력</span><button className="xb" onClick={()=>setShowM(false)}>✕</button></div>
        <div className="mbd">
          <div className="info-box amber" style={{marginBottom:12}}>⚠ NDT FAIL → 자격 즉시 만료 · 명단·스티커 자동 제거</div>
          <div className="fgg">
            <div className="fg"><label>용접사 *</label>
              <select value={form.welder_id} onChange={e=>sf({welder_id:e.target.value,wpqr_id:''})}>
                <option value="">선택</option>{welders.map(w=><option key={w.id} value={w.id}>{w.name_kr} ({w.welder_no})</option>)}
              </select>
            </div>
            <div className="fg"><label>대상 자격 *</label>
              <select value={form.wpqr_id} onChange={e=>sf({wpqr_id:e.target.value})}>
                <option value="">선택</option>{welderQuals.map(w=><option key={w.id} value={w.id}>{w.template_name||w.process} / {w.position} ({w.cert_no})</option>)}
              </select>
            </div>
            <div className="fg"><label>갱신 기간 *</label>
              <select value={form.renewal_period} onChange={e=>sf({renewal_period:e.target.value})}>
                <option value={`${year}-H1`}>{year}년 상반기</option><option value={`${year}-H2`}>{year}년 하반기</option>
              </select>
            </div>
            <div className="fg"><label>갱신일 *</label><input type="date" value={form.renewal_date} onChange={e=>sf({renewal_date:e.target.value})}/></div>
            <div className="fg"><label>NDT 방법</label>
              <select value={form.ndt_method} onChange={e=>sf({ndt_method:e.target.value})}>
                <option>RT</option><option>UT</option><option>MT</option><option>PT</option><option>작업실적</option>
              </select>
            </div>
            <div className="fg"><label>NDT 결과 *</label>
              <select value={form.ndt_result} onChange={e=>sf({ndt_result:e.target.value})}>
                <option value="">선택</option><option>PASS</option><option>FAIL</option>
              </select>
            </div>
            <div className="fg full"><label>비고</label><input value={form.remarks||''} onChange={e=>sf({remarks:e.target.value})}/></div>
          </div>
        </div>
        <div className="mft">
          <button className="btn btn-s" onClick={()=>setShowM(false)}>취소</button>
          <button className={`btn ${form.ndt_result==='FAIL'?'btn-d':'btn-g'}`} onClick={save}>{form.ndt_result==='FAIL'?'❌ 만료 처리':'✅ 갱신 완료'}</button>
        </div>
      </div>
    </div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
